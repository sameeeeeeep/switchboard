<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Switchboard OS — the home you come back to</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Hanken+Grotesk:wght@400;500;600&family=Spline+Sans+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <style>
      /* Switchboard brand design system — same tokens/fonts every wrapp uses (examples/apps/app.css). */
      :root{
        --page:#0A0C10; --inset:#070809; --rail:#0a0b0e; --panel:#12151C; --raised:#1A1F29; --edge:#262C38; --edge-soft:#1C212B;
        --ink:#E8EDF4; --ink-sec:#B4BECE; --ink-dim:#99A3B7; --ink-faint:#6E7C90;
        --lime:#C8F250; --lime-soft:#232B0D; --indigo:#5B4FE8; --indigo-soft:#171633; --danger:#FF2D6E; --ok:#3DD68C; --warn:#F59E0B; --blue:#7DE0FF;
        --display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
        --sans:"Hanken Grotesk",ui-sans-serif,system-ui,sans-serif;
        --mono:"Spline Sans Mono",ui-monospace,Menlo,monospace;
      }
      *{box-sizing:border-box} html,body{margin:0}
      body{background:var(--page); color:var(--ink); font:15px/1.6 var(--sans); -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility}
      ::selection{background:rgba(200,242,80,.3)}
      /* brand typography — headings + logo in Bricolage display, everywhere (shell + all surface modules) */
      h1,h2,h3,.rail .logo,#pane h1,#pane h2,#pane h3,.hero h1,.proj .nm,.stub h1{font-family:var(--display); letter-spacing:-.02em}
      .wrap{color:var(--ink); font-family:var(--sans); line-height:1.55; -webkit-font-smoothing:antialiased;
        display:flex; max-width:1320px; margin:0 auto}
      .maincol{flex:1; min-width:0; padding:0 0 60px}
      /* rail */
      .rail{width:212px; flex:0 0 auto; background:var(--rail); border-right:1px solid var(--edge-soft); padding:20px 12px 40px; position:sticky; top:0; align-self:flex-start; min-height:100vh}
      .rail .logo{display:flex;align-items:center;gap:9px;font-weight:600;font-size:15px;letter-spacing:-.01em;padding:2px 8px 12px}
      .rail .logo .dot{width:9px;height:9px;border-radius:50%;background:var(--lime);box-shadow:0 0 9px 1px rgba(200,242,80,.5)}
      .rail .grp{font-family:var(--mono);font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-faint);padding:15px 10px 5px}
      .rail a{display:flex;align-items:center;gap:11px;padding:7px 10px;border-radius:9px;color:var(--ink-dim);font-size:13.5px;text-decoration:none;cursor:pointer;border-left:2px solid transparent;transition:background .12s,color .12s}
      .rail a .i{width:18px;text-align:center;color:var(--ink-faint);font-size:12.5px;font-family:var(--mono)}
      .rail a:hover{background:var(--raised);color:var(--ink)}
      .rail a.on{background:var(--panel);color:var(--ink);border-left:2px solid var(--lime)} .rail a.on .i{color:var(--lime)}
      .rail a .ct{margin-left:auto;font-family:var(--mono);font-size:10px;color:var(--ink-faint);background:var(--panel);border:1px solid var(--edge-soft);border-radius:20px;padding:1px 7px}
      .rail a .ct.hot{color:var(--page);background:var(--lime);border-color:var(--lime);font-weight:600}
      .railfoot{margin-top:22px;border-top:1px solid var(--edge-soft);padding-top:12px}
      .kick{font-family:var(--mono); font-size:10.5px; letter-spacing:.18em; text-transform:uppercase; color:var(--ink-faint)}
      /* top bar */
      .top{display:flex; align-items:center; gap:14px; padding:20px clamp(18px,4vw,44px) 14px; position:sticky; top:0; background:linear-gradient(var(--page),var(--page) 70%,rgba(8,9,12,0)); z-index:5}
      .omniwrap{flex:1; max-width:560px; margin:0 auto; position:relative}
      .omni{background:var(--panel); border:1px solid var(--edge); border-radius:11px; padding:0 8px 0 13px; height:40px; display:flex; align-items:center; gap:9px}
      .omni:focus-within{border-color:var(--lime); box-shadow:0 0 0 3px rgba(200,242,80,.12)}
      .omni .oic{color:var(--ink-faint); font-size:14px}
      .omni input{flex:1; background:none; border:0; outline:none; color:var(--ink); font-size:13.5px; font-family:inherit}
      .omni input::placeholder{color:var(--ink-faint)}
      .omni .omic{width:26px;height:26px;border-radius:7px;border:1px solid var(--edge);background:transparent;color:var(--ink-dim);font-size:12px;cursor:pointer;display:grid;place-items:center}
      .omni .omic:hover{border-color:var(--lime);color:var(--lime)}
      .omni .k{font-family:var(--mono); font-size:10px; color:var(--ink-faint); border:1px solid var(--edge); border-radius:5px; padding:1px 6px}
      /* spotlight dropdown */
      .spot{position:absolute; top:46px; left:0; right:0; background:var(--panel); border:1px solid var(--edge); border-radius:12px; padding:6px; max-height:60vh; overflow:auto; box-shadow:0 18px 50px rgba(0,0,0,.55); z-index:20}
      .spot .grp{font-family:var(--mono); font-size:9.5px; letter-spacing:.16em; text-transform:uppercase; color:var(--ink-faint); padding:9px 10px 5px}
      .spot .opt{display:flex; align-items:center; gap:11px; padding:8px 10px; border-radius:9px; cursor:pointer}
      .spot .opt.sel,.spot .opt:hover{background:var(--raised)}
      .spot .opt .ico{width:26px;height:26px;border-radius:7px;flex:0 0 auto;display:grid;place-items:center;font-size:13px;overflow:hidden}
      .spot .opt .ico img,.spot .opt .ico svg{width:100%;height:100%;object-fit:cover}
      .spot .opt .lab{flex:1; min-width:0}
      .spot .opt .lab b{display:block; font-size:13px; color:var(--ink); font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
      .spot .opt .lab span{display:block; font-size:11px; color:var(--ink-dim); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
      .spot .opt .go{font-family:var(--mono); font-size:9.5px; color:var(--ink-faint); border:1px solid var(--edge); border-radius:5px; padding:1px 6px}
      .spot .opt.sel .go{color:var(--lime); border-color:var(--lime)}
      .spot .empty{padding:16px 12px; color:var(--ink-dim); font-size:12.5px}
      .top .gear{width:30px;height:30px;border-radius:8px;border:1px solid var(--edge);background:var(--panel);display:grid;place-items:center;color:var(--ink-dim);font-size:14px;cursor:pointer}
      main{padding:6px clamp(18px,4vw,44px) 0}
      /* home hero — a soft lime whisper behind the greeting so the page isn't a flat slab */
      .maincol{position:relative}
      .maincol::before{content:""; position:absolute; top:-40px; left:0; right:0; height:320px; pointer-events:none; z-index:0;
        background:radial-gradient(680px 260px at 30% 0%, rgba(200,242,80,.06), transparent 70%), radial-gradient(560px 240px at 82% 4%, rgba(91,79,232,.07), transparent 72%)}
      main{position:relative; z-index:1}
      .hero{display:grid; grid-template-columns:1fr; gap:16px; margin-top:10px}
      h1{font-size:clamp(24px,3.2vw,34px); font-weight:700; letter-spacing:-.03em; margin:0; line-height:1.1}
      h1 .sub{color:var(--ink-dim); font-weight:400}
      .proj{display:flex; align-items:center; gap:16px; background:linear-gradient(180deg,#15131f,#121319); border:1px solid var(--edge); border-left:2px solid var(--indigo); border-radius:16px; padding:16px 20px; margin-top:12px}
      .proj .mark{width:46px;height:46px;border-radius:12px;background:#1b1a2e;border:1px solid #2c2a55;display:grid;place-items:center;flex:0 0 auto}
      .proj .nm{font-size:16px; font-weight:600}
      .proj .facets{display:flex; gap:8px; margin-top:5px; flex-wrap:wrap}
      .proj .facet{font-size:11.5px; color:var(--ink-dim); background:var(--panel); border:1px solid var(--edge); border-radius:20px; padding:2px 9px}
      .proj .switch{margin-left:auto; font-size:12px; color:var(--indigo); border:1px solid #2c2a55; background:#14122b; border-radius:9px; padding:7px 12px; white-space:nowrap; cursor:pointer}
      /* projects — jump-back + grid */
      .jump{margin-top:12px}
      .mono{border-radius:13px;display:grid;place-items:center;flex:0 0 auto;position:relative;box-shadow:inset 0 1px 0 rgba(255,255,255,.18), 0 2px 8px rgba(0,0,0,.35)}
      .mono span{font-family:var(--display);font-weight:700;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.35);line-height:1}
      .pcard{display:flex; align-items:center; gap:14px; background:linear-gradient(180deg,#141821,#10131a); border:1px solid var(--edge-soft); border-radius:16px; padding:14px 16px; cursor:pointer;
        transition:transform .14s cubic-bezier(.2,.7,.3,1), border-color .14s, box-shadow .14s; box-shadow:inset 0 1px 0 rgba(255,255,255,.03)}
      .pcard:hover{transform:translateY(-2px); border-color:rgba(200,242,80,.45); box-shadow:0 10px 28px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.05)}
      .pcard.big{background:linear-gradient(180deg,#181528,#121218); border:1px solid rgba(91,79,232,.32); border-radius:20px; padding:20px 22px; gap:18px; box-shadow:0 14px 40px rgba(0,0,0,.4), inset 0 1px 0 rgba(255,255,255,.05)}
      .pcard.big:hover{transform:translateY(-2px); border-color:rgba(91,79,232,.6)}
      .pcard .pmark{flex:0 0 auto}
      .pcard .pbody{min-width:0;flex:1}
      .pcard .pnm{font-size:14.5px;font-weight:600;display:flex;align-items:center;gap:8px;letter-spacing:-.01em}
      .pcard.big .pnm{font-size:20px;font-family:var(--display)}
      .pcard .pnm .cur{font-family:var(--mono);font-size:8.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--lime);border:1px solid rgba(200,242,80,.3);background:rgba(200,242,80,.08);border-radius:5px;padding:2px 6px;font-weight:500}
      .pcard .pess{font-size:12.5px;color:var(--ink-dim);margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
      .pcard.big .pess{font-size:13.5px;color:var(--ink-sec);margin-top:6px}
      .pcard .pmeta{display:flex;align-items:center;gap:12px;margin-top:9px;font-size:10.5px;color:var(--ink-faint);font-family:var(--mono);text-transform:uppercase;letter-spacing:.08em}
      .pcard .pmeta .kd{display:inline-flex;align-items:center;gap:5px}
      .pcard .pmeta .kdot{width:5px;height:5px;border-radius:50%;display:inline-block}
      .pcard .pmeta .pend{color:var(--warn)}
      .pcard .pmeta .resume{margin-left:auto;color:var(--lime);opacity:0;transition:opacity .14s;text-transform:none;letter-spacing:0;font-size:12px}
      .pcard.big:hover .resume{opacity:1}
      .pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
      /* needs-attention strip */
      .attn{margin-top:16px; background:linear-gradient(180deg,#1c1512,#161014); border:1px solid #3a2416; border-left:2px solid var(--warn); border-radius:14px; padding:12px 16px}
      .attn .ah{display:flex; align-items:center; gap:9px; font-size:12px; color:var(--warn); font-family:var(--mono); letter-spacing:.06em}
      .attn .ah .ct{margin-left:auto; color:var(--ink-faint)}
      .attn .row{display:flex; align-items:center; gap:10px; padding:8px 0; border-top:1px solid var(--edge-soft); font-size:13px; color:var(--ink-sec)}
      .attn .row:first-of-type{border-top:0}
      .attn .row .do{margin-left:auto; font-size:11.5px; font-family:var(--mono); color:var(--lime); border:1px solid #3a4a12; background:#20260c; border-radius:8px; padding:5px 10px; cursor:pointer}
      /* section head — kicker + a hairline rule that trails off (editorial) */
      .sh{display:flex; align-items:center; gap:14px; margin:36px 0 15px}
      .sh h2{font-size:15px; font-weight:600; margin:0; order:0}
      .sh .kick{order:0}
      .sh::after{content:""; order:1; flex:1; height:1px; background:linear-gradient(90deg,var(--edge-soft),transparent)}
      .sh .more{order:2; font-size:12px; color:var(--ink-dim); cursor:pointer; white-space:nowrap; transition:color .12s}
      .sh .more:hover{color:var(--lime)}
      /* recent work */
      .work{display:grid; grid-template-columns:repeat(auto-fill,minmax(184px,1fr)); gap:14px}
      .card{background:var(--panel); border:1px solid var(--edge); border-radius:14px; overflow:hidden; cursor:pointer}
      .card .thumb{height:104px; display:grid; place-items:center; position:relative; border-bottom:1px solid var(--edge-soft)}
      .card .meta{padding:10px 12px 12px}
      .card .t{font-size:13px; font-weight:500; line-height:1.3}
      .card .src{display:flex; align-items:center; gap:6px; margin-top:7px; font-size:11px; color:var(--ink-faint); font-family:var(--mono)}
      .card .time{margin-left:auto}
      /* apps dock */
      .apps{display:grid; grid-template-columns:repeat(auto-fill,minmax(96px,1fr)); gap:16px}
      .app{text-align:center; cursor:pointer}
      .app .tile{width:72px;height:72px;margin:0 auto;border-radius:18px;display:grid;place-items:center;position:relative;background:linear-gradient(160deg,#15161d,#0d0e13);border:1px solid #1e222c}
      .app .nm{font-size:12px;color:var(--ink-sec);margin-top:8px}
      .app .live{position:absolute;bottom:8px;right:9px;width:6px;height:6px;border-radius:50%;background:var(--lime);box-shadow:0 0 6px 1px rgba(200,242,80,.6)}
      /* real app icons — fill their rounded tile frame; mini variant in work cards */
      .app .tile .os-ic{width:100%;height:100%;object-fit:cover;border-radius:inherit;display:block}
      .proj .mark .os-ic{width:100%;height:100%;object-fit:cover;border-radius:inherit;display:block}
      .src .os-ic{width:15px;height:15px;border-radius:4px;object-fit:cover;vertical-align:-3px}
      .os-ic-broken{display:none!important}
      .app{transition:transform .1s ease} .app:hover{transform:translateY(-2px)}
      /* what's next */
      .next{display:flex; gap:12px; flex-wrap:wrap; margin-top:14px}
      .nx{flex:1; min-width:240px; background:var(--panel); border:1px solid var(--edge); border-radius:13px; padding:14px 16px; display:flex; gap:12px; align-items:center; cursor:pointer}
      .nx .g{width:32px;height:32px;border-radius:9px;background:#20260c;border:1px solid #3a4a12;display:grid;place-items:center;color:var(--lime);flex:0 0 auto}
      .nx.task .g{background:var(--raised);border-color:var(--edge);color:var(--ink-dim)}
      .nx .tx{font-size:13px; color:var(--ink-sec)} .nx .tx b{color:var(--ink); font-weight:500}
      /* stub surfaces */
      .stub{margin-top:10px}
      .stub .head{display:flex; align-items:baseline; gap:12px; margin-bottom:4px}
      .stub h1{font-size:26px}
      .stub .bld{font-family:var(--mono); font-size:10.5px; letter-spacing:.12em; text-transform:uppercase; color:var(--ink-faint); border:1px solid var(--edge-soft); border-radius:20px; padding:3px 9px; display:inline-flex; align-items:center; gap:6px}
      .stub .bld .d{width:6px;height:6px;border-radius:50%;background:var(--warn);box-shadow:0 0 7px var(--warn)}
      .stub .lede{color:var(--ink-dim); font-size:13.5px; margin:6px 0 26px; max-width:560px}
      .cols{display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:14px}
      .col{background:var(--panel); border:1px solid var(--edge); border-radius:14px; padding:14px; min-height:150px}
      .col .ct{font-family:var(--mono); font-size:9.5px; letter-spacing:.16em; text-transform:uppercase; color:var(--ink-dim); display:flex; align-items:center; gap:8px}
      .col .ph{height:34px; border-radius:9px; background:var(--raised); border:1px solid var(--edge-soft); margin-top:12px; opacity:.5}
      .col .ph.s{height:22px; opacity:.35}
      .chips{display:flex; gap:10px; flex-wrap:wrap}
      .chipk{font-size:12.5px; color:var(--ink-sec); background:var(--panel); border:1px solid var(--edge); border-radius:10px; padding:9px 15px}
      .chipk.on{border-color:var(--lime); color:var(--ink)}
      .tiles{display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:12px}
      .tile2{background:var(--panel); border:1px solid var(--edge); border-radius:14px; padding:14px 16px}
      .tile2 .k{font-family:var(--mono); font-size:9.5px; letter-spacing:.14em; text-transform:uppercase; color:var(--ink-dim)}
      .tile2 .big{font-size:30px; font-weight:600; letter-spacing:-.02em; margin-top:8px}
      .tile2 .spark{height:20px; margin-top:8px; border-radius:6px; background:linear-gradient(90deg,var(--edge-soft),var(--raised)); opacity:.6}
      .rows{display:flex; flex-direction:column; gap:10px}
      .rowk{display:flex; align-items:center; gap:12px; background:var(--panel); border:1px solid var(--edge); border-radius:12px; padding:12px 15px; font-size:13px; color:var(--ink-sec)}
      .rowk .dg{width:26px;height:26px;border-radius:7px;background:var(--raised);border:1px solid var(--edge-soft);flex:0 0 auto}
      .rowk .mono{margin-left:auto; font-family:var(--mono); font-size:11px; color:var(--ink-faint)}
      .foot{margin-top:38px; padding:0 clamp(18px,4vw,44px); color:var(--ink-faint); font-size:11.5px; font-family:var(--mono)}
    </style>
  </head>
  <body>
    <div class="wrap">
      <aside class="rail" id="rail"></aside>
      <div class="maincol">
        <div class="top">
          <div class="omniwrap" id="omniwrap">
            <div class="omni" id="omni">
              <span class="oic">⌕</span>
              <input id="omniInput" type="text" autocomplete="off" spellcheck="false"
                     placeholder="Search projects, apps, files — or ask" aria-label="Search or ask" />
              <button class="omic" id="omniMic" title="Ask by voice (⌃⌃)" aria-label="Ask by voice">🎙</button>
              <span class="k">⌥⌥</span>
            </div>
            <div class="spot" id="spot" hidden></div>
          </div>
          <div class="gear" title="Settings">⚙</div>
        </div>
        <main id="pane"></main>
        <div class="foot" id="foot"></div>
      </div>
    </div>
    <script>/* dev: cache-bust the bundle so edits always show */
      { const s = document.createElement("script"); s.type = "module"; s.src = "./dist/os.js?t=" + Date.now(); document.head.appendChild(s); }
    </script>
  </body>
</html>
