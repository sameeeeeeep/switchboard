<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AdPulse · widget</title>
    <style>
      :root {
        --page:#0A0C10; --inset:#070809; --panel:#141416; --raised:#1A1F29;
        --edge:#282829; --edge-soft:#1C212B;
        --ink:#E8EDF4; --ink-sec:#B4BECE; --ink-dim:#9A9AA2; --ink-faint:#6E7C90;
        --accent:#C8F250; --accent-soft:#232B0D; --ok:#3DD68C; --warn:#F59E0B; --danger:#FF2D6E; --blue:#7DE0FF;
        --sans:"Hanken Grotesk",ui-sans-serif,system-ui,-apple-system,sans-serif;
        --mono:"Spline Sans Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
      }
      *{box-sizing:border-box;} [hidden]{display:none !important;}
      html,body{margin:0;}
      body{background:var(--page);color:var(--ink);font:13px/1.5 var(--sans);-webkit-font-smoothing:antialiased;}
      .wrap{width:560px;max-width:100vw;margin:0 auto;padding:14px 16px 16px;display:flex;flex-direction:column;gap:11px;}
      .head{display:flex;align-items:center;gap:8px;}
      .mk{width:16px;height:16px;border-radius:5px;background:var(--accent);box-shadow:0 0 10px rgba(200,242,80,.4);}
      .name{font:600 13px/1 var(--sans);letter-spacing:-.01em;} .name em{font-style:normal;color:var(--accent);}
      .kicker{font:500 9px/1 var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--ink-dim);margin-left:auto;}
      .flabel{font:500 9px/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--ink-dim);margin-bottom:6px;display:block;}
      textarea{width:100%;background:var(--inset);border:1px solid var(--edge);border-radius:9px;color:var(--ink);font:400 12px/1.5 var(--mono);padding:10px 12px;outline:none;resize:vertical;min-height:60px;white-space:pre;}
      textarea:focus{border-color:color-mix(in srgb,var(--accent) 55%,var(--edge));}
      .row{display:flex;gap:9px;align-items:center;justify-content:flex-end;}
      .go{font:600 12.5px/1 var(--sans);background:var(--accent);color:var(--page);border:0;border-radius:9px;padding:11px 16px;cursor:pointer;transition:filter .15s,opacity .15s;}
      .go:hover{filter:brightness(1.08);} .go:disabled{opacity:.45;cursor:default;}
      .out{display:flex;flex-direction:column;gap:11px;}
      .scorecard{display:flex;gap:13px;align-items:center;border:1px solid var(--edge);background:var(--panel);border-radius:14px;padding:14px;}
      .dial{width:56px;height:56px;border-radius:50%;flex:none;display:grid;place-items:center;font:700 18px/1 var(--sans);color:var(--page);}
      .hl{font:600 13.5px/1.4 var(--sans);color:var(--ink);}
      .sect{font:500 8.5px/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--ink-dim);}
      .act{border:1px solid var(--edge);background:var(--panel);border-radius:12px;padding:11px 12px;display:flex;flex-direction:column;gap:4px;}
      .act .at{display:flex;align-items:center;gap:7px;}
      .act .atitle{font:600 12.5px/1.3 var(--sans);color:var(--ink);}
      .pill{font:500 8px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;padding:3px 6px;border-radius:999px;border:1px solid var(--edge);color:var(--ink-dim);}
      .pill.high{color:var(--accent);border-color:color-mix(in srgb,var(--accent) 40%,var(--edge));}
      .act .ad{font:400 12px/1.5 var(--sans);color:var(--ink-sec);}
      .camps{display:flex;flex-wrap:wrap;gap:6px;}
      .camp{font:500 10.5px/1 var(--mono);border:1px solid var(--edge);border-radius:999px;padding:6px 10px;color:var(--ink-sec);display:inline-flex;gap:6px;align-items:center;}
      .camp .vd{font-weight:600;text-transform:uppercase;font-size:8.5px;letter-spacing:.06em;}
      .camp.scale .vd{color:var(--ok);} .camp.keep .vd{color:var(--blue);} .camp.fix .vd{color:var(--warn);} .camp.kill .vd{color:var(--danger);}
      .status{display:flex;align-items:center;gap:8px;font:500 11px/1.4 var(--mono);color:var(--ink-dim);}
      .scan{position:relative;width:24px;height:6px;border-radius:3px;background:var(--inset);overflow:hidden;flex:none;}
      .scan::after{content:"";position:absolute;inset:0;width:40%;background:linear-gradient(90deg,transparent,var(--accent),transparent);animation:scan 1.1s linear infinite;}
      @keyframes scan{from{transform:translateX(-100%);}to{transform:translateX(260%);}}
      .err{color:var(--danger);font:400 11.5px/1.5 var(--mono);}
      .placeholder{font:400 11px/1.5 var(--mono);color:var(--ink-faint);}
      .foot{display:inline-flex;align-items:center;gap:7px;font:500 10px/1 var(--mono);color:var(--ink-dim);}
      .foot .dot{width:6px;height:6px;border-radius:50%;background:var(--ok);box-shadow:0 0 7px var(--ok);}
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="head"><span class="mk"></span><span class="name">Ad<em>Pulse</em></span><span class="kicker">on your claude</span></div>
      <div>
        <label class="flabel" for="csv">Paste your Meta Ads Manager CSV export</label>
        <textarea id="csv" autofocus placeholder="Campaign name,Amount spent (USD),Impressions,Clicks,CTR,CPC,Purchases,Purchase value,ROAS&#10;..."></textarea>
      </div>
      <div class="row"><button id="go" class="go">Diagnose</button></div>
      <div class="out" id="out"><div class="placeholder">Paste last 30 days of campaign data — get a blunt score and the moves to make tomorrow.</div></div>
      <div class="foot"><span class="dot"></span>Analysed on your own Claude · your numbers never leave</div>
    </div>

    <script type="module">
      function injectedText() {
        try { const q = new URLSearchParams(location.search).get("input"); if (q != null && q !== "") return q; } catch {}
        const w = window.__widgetInput;
        if (w && typeof w === "object" && typeof w.text === "string" && w.text.trim()) return w.text;
        if (typeof w === "string" && w.trim()) return w;
        return "";
      }
      const SCOPE = { reason: "AdPulse widget — diagnose a Meta Ads CSV export, on your own Claude", models: ["sonnet"] };
      function provider() { const c = window.claude; return (c && c.isRelay && typeof c.request === "function") ? c : null; }
      function waitForProvider(ms = 1500) {
        const p = provider(); if (p) return Promise.resolve(p);
        return new Promise((res) => { let done = false; const fin = () => { if (done) return; done = true; res(provider()); };
          window.addEventListener("claude#initialized", fin, { once: true }); setTimeout(fin, ms); });
      }
      let grantP = null;
      function ensureGrant(p) {
        if (!grantP) grantP = (async () => { try { const g = await p.request({ method: "claude_permissions" }); if (g) return g; } catch {} return p.request({ method: "claude_connect", params: SCOPE }); })();
        return grantP;
      }
      async function streamPrompt(p, params, onText) {
        const { streamId } = await p.request({ method: "claude_stream", params });
        return new Promise((resolve, reject) => {
          let text = "", settled = false;
          const cleanup = () => { settled = true; try { p.removeListener("delta", handler); } catch {} clearTimeout(timer); };
          const handler = (d) => {
            if (!d || d.streamId !== streamId) return;
            if (d.type === "text") { text += d.text; onText && onText(text); }
            else if (d.type === "error") { cleanup(); reject(new Error((d.error && d.error.message) || "stream error")); }
            else if (d.type === "done") { cleanup(); resolve((d.result && d.result.text) || text); }
          };
          const timer = setTimeout(() => { if (!settled) { cleanup(); reject(new Error("Switchboard didn't respond — reload the widget and try again.")); } }, 180000);
          p.on("delta", handler);
        });
      }
      async function ask(prompt, onText) {
        const p = await waitForProvider();
        if (!p) throw new Error("Switchboard isn't connected — open this widget from the notch.");
        await ensureGrant(p);
        return streamPrompt(p, { prompt, model: "sonnet", maxTokens: 4000 }, onText);
      }

      // mirrors src/adpulse.js diagnosis prompt
      function buildPrompt(csv) {
        return [
          "You are AdPulse, a blunt, numbers-first Meta Ads performance analyst. A founder exported the data below from Meta Ads Manager. Treat the export window as roughly one month.",
          "Pre-computed aggregates (trust the CSV): compute totals from the rows below — total spend, blended ROAS, total purchases and value.",
          "CSV EXPORT:\n" + csv,
          'Respond with ONLY one JSON object — no prose, no markdown fences — in exactly this shape:\n{"score": <integer 0-100, overall account health: 0 = burning cash, 100 = dialed in>, "headline": "<one blunt verdict sentence, max 120 chars>", "wins": [{"title": "...", "detail": "..."}], "leaks": [{"title": "...", "detail": "...", "monthlyBurn": <estimated money wasted per month, plain number>}], "actions": [{"title": "...", "impact": "high"|"medium", "effort": "low"|"medium"|"high", "detail": "..."}], "campaigns": [{"name": "<campaign name copied EXACTLY from the data>", "verdict": "scale"|"keep"|"fix"|"kill", "note": "<max 90 chars>"}]}',
          "Rules: 2-4 wins, 2-4 leaks, 4-6 actions ordered most-urgent first, one campaigns entry per campaign. Cite real numbers in every detail. A founder acts on this tomorrow morning.",
        ].join("\n\n");
      }
      function parseJson(text) {
        let t = String(text || "").replace(/```[a-z]*\n?/gi, "").trim();
        const s = t.indexOf("{"), e = t.lastIndexOf("}");
        if (s === -1 || e <= s) return null;
        try { return JSON.parse(t.slice(s, e + 1)); } catch { return null; }
      }
      const $ = (id) => document.getElementById(id);
      const mk = (tag, cls, text) => { const n = document.createElement(tag); if (cls) n.className = cls; if (text != null) n.textContent = text; return n; };
      const out = $("out"), csvEl = $("csv"), goEl = $("go");
      let busy = false;
      function dialColor(s) { return s >= 67 ? "var(--ok)" : s >= 40 ? "var(--warn)" : "var(--danger)"; }
      async function run() {
        const csv = csvEl.value.trim(); if (!csv || busy) { if (!csv) csvEl.focus(); return; }
        busy = true; goEl.disabled = true; out.textContent = "";
        const st = mk("div", "status"); st.append(mk("div", "scan"), mk("span", null, "reading the numbers on your Claude…")); out.append(st);
        try {
          const raw = await ask(buildPrompt(csv));
          const d = parseJson(raw);
          out.textContent = "";
          if (!d || (d.score == null && !d.headline)) throw new Error("couldn't read a diagnosis — check the CSV and retry");
          const score = Math.max(0, Math.min(100, Math.round(Number(d.score) || 0)));
          const sc = mk("div", "scorecard");
          const dial = mk("div", "dial", String(score)); dial.style.background = dialColor(score);
          const scmain = mk("div"); scmain.append(mk("div", "hl", String(d.headline || "Account diagnosed")));
          sc.append(dial, scmain); out.append(sc);
          const actions = Array.isArray(d.actions) ? d.actions.slice(0, 6) : [];
          if (actions.length) {
            out.append(mk("div", "sect", "do this first"));
            for (const a of actions) {
              const card = mk("div", "act");
              const at = mk("div", "at"); at.append(mk("div", "atitle", String(a.title || "Action")));
              if (a.impact) at.append(mk("span", "pill" + (String(a.impact) === "high" ? " high" : ""), String(a.impact)));
              card.append(at);
              if (a.detail) card.append(mk("div", "ad", String(a.detail)));
              out.append(card);
            }
          }
          const camps = Array.isArray(d.campaigns) ? d.campaigns : [];
          if (camps.length) {
            out.append(mk("div", "sect", "verdict per campaign"));
            const row = mk("div", "camps");
            for (const c of camps) {
              const vd = String(c.verdict || "keep");
              const chip = mk("div", "camp " + vd);
              chip.append(mk("span", "vd", vd), mk("span", null, String(c.name || "campaign")));
              chip.title = String(c.note || ""); row.append(chip);
            }
            out.append(row);
          }
        } catch (e) { out.textContent = ""; out.append(mk("div", "err", String(e?.message || e).slice(0, 200))); }
        finally { busy = false; goEl.disabled = false; }
      }
      goEl.addEventListener("click", run);
      const seed = injectedText(); if (seed) csvEl.value = seed;
      csvEl.focus();
    </script>
  </body>
</html>
