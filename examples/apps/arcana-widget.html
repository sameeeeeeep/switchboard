<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Arcana · widget</title>
    <style>
      :root {
        --page:#0A0C10; --inset:#070809; --panel:#141416; --raised:#1A1F29;
        --edge:#282829; --edge-soft:#1C212B;
        --ink:#E8EDF4; --ink-sec:#B4BECE; --ink-dim:#9A9AA2; --ink-faint:#6E7C90;
        --accent:#C8F250; --gold:#D9B36B; --ok:#3DD68C; --danger:#FF2D6E;
        --sans:"Hanken Grotesk",ui-sans-serif,system-ui,-apple-system,sans-serif;
        --mono:"Spline Sans Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
      }
      *{box-sizing:border-box;} [hidden]{display:none !important;}
      html,body{margin:0;}
      body{background:var(--page);color:var(--ink);font:13px/1.5 var(--sans);-webkit-font-smoothing:antialiased;}
      .wrap{width:560px;max-width:100vw;margin:0 auto;padding:14px 16px 16px;display:flex;flex-direction:column;gap:11px;}
      .head{display:flex;align-items:center;gap:8px;}
      .mk{width:16px;height:16px;border-radius:5px;background:var(--gold);box-shadow:0 0 10px rgba(217,179,107,.4);}
      .name{font:600 13px/1 var(--sans);} .name em{font-style:normal;color:var(--gold);}
      .kicker{font:500 9px/1 var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--ink-dim);margin-left:auto;}
      .row{display:flex;align-items:center;gap:10px;}
      input.line{flex:1;background:var(--inset);border:1px solid var(--edge);border-radius:9px;color:var(--ink);font:400 13px/1.4 var(--sans);padding:11px 12px;outline:none;}
      input.line:focus{border-color:color-mix(in srgb,var(--gold) 55%,var(--edge));}
      .go{font:600 12px/1 var(--sans);background:var(--gold);color:var(--page);border:0;border-radius:999px;padding:10px 16px;cursor:pointer;transition:opacity .15s;white-space:nowrap;}
      .go:disabled{opacity:.4;cursor:default;}
      .act{font:500 11px/1 var(--mono);background:var(--inset);border:1px solid var(--edge);border-radius:999px;color:var(--ink-sec);padding:7px 12px;cursor:pointer;transition:border-color .15s,color .15s;}
      .act:hover{border-color:var(--gold);color:var(--ink);}
      .spread{display:flex;gap:8px;}
      .card{flex:1;border:1px solid color-mix(in srgb,var(--gold) 30%,var(--edge));border-radius:11px;background:linear-gradient(160deg,#16130C,#0d0b07);padding:10px 9px;display:flex;flex-direction:column;gap:5px;min-width:0;}
      .card .pos{font:500 8px/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--gold);}
      .card .cn{font:600 12px/1.15 var(--sans);color:var(--ink);}
      .card .or{font:400 9px/1 var(--mono);color:var(--ink-faint);}
      .card .tk{font:400 10px/1.4 var(--sans);color:var(--ink-sec);}
      .reading{border:1px solid var(--edge);border-radius:11px;background:var(--panel);padding:12px;display:flex;flex-direction:column;gap:8px;}
      .opening{font:500 12.5px/1.5 var(--sans);color:var(--ink);}
      .synth{font:400 11.5px/1.5 var(--sans);color:var(--ink-sec);}
      .advice{font:500 11.5px/1.45 var(--sans);color:var(--ink);border-left:2px solid var(--gold);padding-left:9px;}
      .omen{font:400 11px/1.4 var(--mono);color:var(--gold);}
      .statusrow{display:flex;align-items:center;gap:9px;font:400 11px/1.4 var(--mono);color:var(--ink-faint);}
      .scan{height:2px;border-radius:2px;background:linear-gradient(90deg,transparent,var(--gold),transparent);background-size:200% 100%;animation:scan 1.1s linear infinite;width:60%;}
      @keyframes scan{0%{background-position:200% 0}100%{background-position:-200% 0}}
      .err{color:var(--danger);font:400 12px/1.5 var(--mono);}
      .placeholder{font:400 11px/1.5 var(--mono);color:var(--ink-faint);}
      .badge{display:inline-flex;align-items:center;gap:7px;font:500 10px/1 var(--mono);color:var(--ink-dim);}
      .badge .dot{width:6px;height:6px;border-radius:50%;background:var(--ok);box-shadow:0 0 7px var(--ok);}
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="head"><span class="mk"></span><span class="name"><em>Arcana</em></span><span class="kicker">three-card spread</span></div>
      <div class="row">
        <input id="q" class="line" type="text" autofocus placeholder="What am I not seeing?" />
        <button class="go" id="go">Deal ▸</button>
      </div>
      <div id="out"><div class="placeholder">Ask a question and deal — three cards drawn on your device, read on your own Claude.</div></div>
      <div class="badge"><span class="dot"></span>Cards drawn on your device · reading on your Claude</div>
    </div>

    <script type="module">
      // ===== window.claude bridge — the SAME provider the full page's SDK wraps =====================
      const SCOPE = { reason: "Arcana — read a tarot spread on your own Claude", models: ["sonnet"] };
      function providerNow(){ const p = window.claude; return (p && p.isRelay) ? p : null; }
      function whenProvider(ms = 4000){ return new Promise((res) => { const now = providerNow(); if (now) return res(now); let done = false; const on = () => { if (done) return; done = true; cleanup(); res(providerNow()); }; const t = setTimeout(() => { if (done) return; done = true; cleanup(); res(providerNow()); }, ms); function cleanup(){ clearTimeout(t); window.removeEventListener("claude#initialized", on); } window.addEventListener("claude#initialized", on); }); }
      let _relay = null;
      async function relay(){
        if (_relay) return _relay;
        const p = await whenProvider();
        if (!p) throw new Error("Switchboard isn't connected — open this from the Switchboard notch.");
        let grant = null; try { grant = await p.request({ method: "claude_permissions" }); } catch {}
        if (!grant) { try { grant = await p.request({ method: "claude_connect", params: SCOPE }); } catch (e) { throw new Error("connect failed: " + (e?.message || e)); } }
        _relay = { async *stream(params){ const { streamId } = await p.request({ method: "claude_stream", params }); const q = []; let notify = null, ended = false; const h = (pl) => { if (!pl || pl.streamId !== streamId) return; q.push(pl); if (pl.type === "done" || pl.type === "error") ended = true; notify && notify(); }; p.on("delta", h); try { while (true) { if (!q.length) { if (ended) break; await new Promise((r) => (notify = r)); notify = null; continue; } yield q.shift(); } } finally { p.removeListener("delta", h); } } };
        return _relay;
      }
      async function streamText(params){ const r = await relay(); let acc = ""; for await (const d of r.stream(params)) { if (d.type === "text") acc += d.text; else if (d.type === "error") throw new Error(d.error?.message || "stream error"); } return acc; }

      // ---- injected-input contract ----
      function injectedText(){ try { const q = new URLSearchParams(location.search).get("input"); if (q) return q; } catch {} const w = window.__widgetInput; if (typeof w === "string" && w.trim()) return w; if (w && typeof w === "object" && typeof w.text === "string" && w.text.trim()) return w.text; return ""; }

      // ===== APP — compact of Arcana's primary action (arcana_run) ===================================
      // The 22 major arcana + draw + read prompt, from src/arcana.js. Spread drawn locally (crypto RNG,
      // ~30% reversed), the reading itself streams on the visitor's own Claude.
      const DEFAULT_Q = "What am I not seeing?";
      const POSITIONS = ["past", "present", "future"];
      const DECK = [
        ["The Fool","0","beginnings, a leap of faith, the open road","recklessness, cold feet, a false start"],
        ["The Magician","I","will, focus, making it real","scattered aim, sleight of hand, untapped skill"],
        ["The High Priestess","II","intuition, the unspoken, the inner voice","ignored instincts, secrets kept from yourself"],
        ["The Empress","III","abundance, nurture, creation","creative block, smothering, self-neglect"],
        ["The Emperor","IV","structure, authority, holding the line","rigidity, control for its own sake, abdicated power"],
        ["The Hierophant","V","tradition, counsel, the known way","dead ritual, rebellion, thinking for yourself"],
        ["The Lovers","VI","union, alignment, a real choice","misalignment, avoidance, a choice unmade"],
        ["The Chariot","VII","drive, momentum, victory through will","spinning wheels, lost direction, forced control"],
        ["Strength","VIII","quiet courage, mastery of instinct","self-doubt, raw nerves, force over grace"],
        ["The Hermit","IX","withdrawal, the search, inner counsel","isolation, refusing help, exile overstayed"],
        ["Wheel of Fortune","X","the turn, timing, cycles in motion","resistance to change, a stalled cycle"],
        ["Justice","XI","truth, accountability, cause and effect","denial, imbalance, an unfair verdict"],
        ["The Hanged Man","XII","the sacred pause, a new angle, surrender","stalling, martyrdom, the wasted delay"],
        ["Death","XIII","the ending that frees, transformation","clinging, decay prolonged, fear of release"],
        ["Temperance","XIV","balance, patience, the right mix","excess, impatience, mismatched forces"],
        ["The Devil","XV","the deal you made, appetite, bondage","chains loosening, the shadow faced, power reclaimed"],
        ["The Tower","XVI","collapse, revelation, the necessary ruin","the slow-motion collapse, dread of the fall"],
        ["The Star","XVII","hope, healing, quiet guidance","dimmed faith, doubt, disconnection"],
        ["The Moon","XVIII","the unlit road, dream-logic, illusion","fog lifting, a fear named, clarity returning"],
        ["The Sun","XIX","vitality, unclouded joy, the win","dimmed light, forced cheer, the delayed win"],
        ["Judgement","XX","the call, the reckoning, waking up","the call ignored, old verdicts, self-judgment"],
        ["The World","XXI","completion, integration, arrival","loose ends, the last mile, almost there"],
      ].map(([n, num, up, rev]) => ({ n, num, up, rev }));

      const $ = (id) => document.getElementById(id);
      const el = (tag, cls, text) => { const n = document.createElement(tag); if (cls) n.className = cls; if (text != null) n.textContent = text; return n; };
      const rand = (n) => { const u = new Uint32Array(1); crypto.getRandomValues(u); return u[0] % n; };
      const chance = (p) => { const u = new Uint32Array(1); crypto.getRandomValues(u); return u[0] / 0xffffffff < p; };
      let busy = false, spread = null;

      function drawSpread(){ const picks = []; while (picks.length < 3) { const i = rand(DECK.length); if (!picks.includes(i)) picks.push(i); } return picks.map((i) => ({ i, rev: chance(0.3) })); }
      const cardLine = (pos, s) => { const c = DECK[s.i]; return `${pos.toUpperCase()} — ${c.n} (${c.num}), ${s.rev ? "REVERSED" : "upright"}. Upright keywords: ${c.up}. Reversed keywords: ${c.rev}.`; };
      function buildPrompt(q){
        return [
          'You are the reader at Arcana, a midnight card table. Your voice: sharp, intimate, direct, a little dangerous. Modern language — no "thee" or "thou", no cosmic hedging, no disclaimers. You respect the querent\'s intelligence and never flatter. Reversed cards read as blocked, delayed, or internalized energy — never doom.',
          "",
          `The querent asks: "${q}"`,
          "",
          "They drew this three-card spread (past / present / future):",
          cardLine("past", spread[0]), cardLine("present", spread[1]), cardLine("future", spread[2]),
          "",
          'Read THIS spread for THIS question. Speak to the querent as "you".',
          "Respond with ONLY a valid JSON object — no prose before or after, no markdown fences — in exactly this shape:",
          '{"opening":"1-2 lines that meet the question head-on","cards":[{"position":"past","take":"3-4 sentences reading this exact card, in this position, for this question — honor its orientation"},{"position":"present","take":"3-4 sentences"},{"position":"future","take":"3-4 sentences"}],"synthesis":"the three cards as one arc; 3-5 sentences","advice":"one concrete instruction the querent can act on this week — imperative and specific","omen":"a single closing line, ominous or hopeful, that they will remember"}',
        ].join("\n");
      }

      function renderSpread(showTakes){
        const wrap = el("div", "spread");
        spread.forEach((s, k) => { const c = DECK[s.i]; const card = el("div", "card"); card.dataset.k = String(k);
          card.append(el("div", "pos", POSITIONS[k]), el("div", "cn", c.n), el("div", "or", s.rev ? "reversed" : "upright"));
          if (showTakes) card.append(el("div", "tk", "…")); wrap.append(card); });
        return wrap;
      }

      async function deal(){
        if (busy) return;
        const q = $("q").value.trim() || DEFAULT_Q;
        spread = drawSpread();
        busy = true; $("go").disabled = true; $("go").textContent = "Reading…";
        const out = $("out"); out.textContent = "";
        out.append(renderSpread(true));
        const st = el("div", "statusrow"); st.append(el("div", "scan"), el("span", null, "she reads what you pulled…")); out.append(st);
        try {
          const raw = await streamText({ prompt: buildPrompt(q) });
          const m = raw.match(/\{[\s\S]*\}/);
          if (!m) throw new Error("no reading came back — Deal again.");
          const r = JSON.parse(m[0]);
          if (!r || !r.opening || !Array.isArray(r.cards) || r.cards.length < 3) throw new Error("the reading came back malformed — Deal again.");
          out.textContent = "";
          const sp = renderSpread(true); out.append(sp);
          POSITIONS.forEach((p, k) => { const c = (r.cards || []).find((x) => String(x?.position || "").toLowerCase().includes(p)) || r.cards[k] || {}; const tk = sp.querySelector(`.card[data-k="${k}"] .tk`); if (tk) tk.textContent = c.take || ""; });
          const rd = el("div", "reading");
          rd.append(el("div", "opening", r.opening || ""));
          if (r.synthesis) rd.append(el("div", "synth", r.synthesis));
          if (r.advice) rd.append(el("div", "advice", r.advice));
          if (r.omen) rd.append(el("div", "omen", "— " + r.omen));
          out.append(rd);
        } catch (e) { out.textContent = ""; out.append(renderSpread(false)); out.append(el("div", "err", String(e?.message || e))); }
        finally { busy = false; $("go").disabled = false; $("go").textContent = "Deal ▸"; }
      }
      $("go").addEventListener("click", deal);
      $("q").addEventListener("keydown", (e) => { if (e.key === "Enter") { e.preventDefault(); deal(); } });
      const seed = injectedText(); if (seed) $("q").value = seed;
      $("q").focus();
    </script>
  </body>
</html>
