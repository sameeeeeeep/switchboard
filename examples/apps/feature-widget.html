<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Feature Case · widget</title>
    <style>
      /* Notch widget tokens — compact, dark, one system. */
      :root {
        --page:#0A0C10; --inset:#070809; --panel:#141416; --raised:#1A1F29;
        --edge:#282829; --edge-soft:#1C212B;
        --ink:#E8EDF4; --ink-sec:#B4BECE; --ink-dim:#9A9AA2; --ink-faint:#6E7C90;
        --accent:#C8F250; --accent-soft:#232B0D; --ok:#3DD68C; --warn:#F2C14E; --danger:#FF2D6E;
        --sans:"Hanken Grotesk",ui-sans-serif,system-ui,-apple-system,sans-serif;
        --mono:"Spline Sans Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
      }
      *{box-sizing:border-box;} [hidden]{display:none !important;}
      html,body{margin:0;}
      body{background:var(--page);color:var(--ink);font:13px/1.5 var(--sans);-webkit-font-smoothing:antialiased;}
      .wrap{width:560px;max-width:100vw;margin:0 auto;padding:14px 16px 16px;display:flex;flex-direction:column;gap:11px;}
      .head{display:flex;align-items:center;gap:8px;}
      .mk{width:16px;height:16px;border-radius:5px;background:var(--accent);box-shadow:0 0 10px rgba(200,242,80,.4);}
      .name{font:600 13px/1 var(--sans);letter-spacing:-.01em;} .name em{font-style:normal;color:var(--accent);}
      .kicker{font:500 9px/1 var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--ink-dim);margin-left:auto;}
      .flabel{font:500 9px/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--ink-dim);margin-bottom:6px;display:block;}
      .row{display:flex;align-items:flex-end;gap:9px;}
      .grow{flex:1;}
      textarea{width:100%;background:var(--inset);border:1px solid var(--edge);border-radius:9px;color:var(--ink);font:400 13px/1.45 var(--sans);padding:10px 11px;outline:none;resize:vertical;}
      textarea:focus{border-color:color-mix(in srgb,var(--accent) 55%,var(--edge));}
      .go{flex:none;font:600 12px/1 var(--sans);background:var(--accent);color:var(--page);border:0;border-radius:9px;padding:11px 15px;cursor:pointer;transition:filter .15s;}
      .go:hover{filter:brightness(1.06);} .go:disabled{opacity:.5;cursor:default;}
      .act{font:500 11px/1 var(--mono);background:var(--inset);border:1px solid var(--edge);border-radius:999px;color:var(--ink-sec);padding:7px 12px;cursor:pointer;transition:border-color .15s,color .15s;}
      .act:hover{border-color:var(--accent);color:var(--ink);} .act:disabled{opacity:.5;cursor:default;}
      .hint{font:400 10px/1.4 var(--mono);color:var(--ink-faint);}
      .scan{display:flex;align-items:center;gap:9px;font:500 11px/1 var(--mono);color:var(--ink-sec);padding:3px 0;}
      .dot3{width:26px;height:6px;border-radius:6px;background:linear-gradient(90deg,var(--accent),transparent);background-size:200% 100%;animation:sweep 1.1s linear infinite;}
      @keyframes sweep{to{background-position:-200% 0;}}
      .card{border:1px solid var(--edge);border-radius:12px;background:var(--panel);padding:13px 14px;display:flex;flex-direction:column;gap:10px;}
      .verdict{display:flex;align-items:center;gap:9px;}
      .badge{font:600 10px/1 var(--mono);letter-spacing:.1em;text-transform:uppercase;padding:5px 9px;border-radius:999px;border:1px solid;}
      .badge.build{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 55%,transparent);background:color-mix(in srgb,var(--ok) 12%,transparent);}
      .badge.defer{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 55%,transparent);background:color-mix(in srgb,var(--warn) 12%,transparent);}
      .badge.cut{color:var(--danger);border-color:color-mix(in srgb,var(--danger) 55%,transparent);background:color-mix(in srgb,var(--danger) 12%,transparent);}
      .hl{font:600 15px/1.3 var(--sans);letter-spacing:-.01em;}
      .lines{display:flex;flex-direction:column;gap:9px;}
      .line{display:flex;flex-direction:column;gap:2px;}
      .line .k{font:500 9px/1 var(--mono);letter-spacing:.13em;text-transform:uppercase;color:var(--ink-faint);}
      .line .v{font:400 12.5px/1.45 var(--sans);color:var(--ink-sec);}
      .line.case .v{color:var(--ink);}
      .err{color:var(--danger);font:400 11px/1.5 var(--mono);}
      .aibadge{display:inline-flex;align-items:center;gap:7px;font:500 10px/1 var(--mono);color:var(--ink-dim);}
      .aibadge .dot{width:6px;height:6px;border-radius:50%;background:var(--accent);box-shadow:0 0 7px var(--accent);}
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="head"><span class="mk"></span><span class="name"><em>Feature</em> Case</span><span class="kicker">on your Claude</span></div>
      <div>
        <label class="flabel" for="in">The feature — one line</label>
        <div class="row">
          <textarea id="in" rows="2" autofocus placeholder="e.g. add a shared team inbox to our support tool…"></textarea>
          <button class="go" id="go">Make the case</button>
        </div>
        <div class="hint" style="margin-top:6px;">⌘/Ctrl + Enter · verdict, the case, the risk, effort vs impact</div>
      </div>
      <div id="out"></div>
      <div class="aibadge"><span class="dot"></span>Runs on your own Claude · no key · nothing leaves but your prompt</div>
    </div>

    <script type="module">
      // ============================================================================================
      // window.claude bridge — the notch host injects `window.claude` (the same provider the full
      // Feature Case page uses via @relay/sdk). We talk to it directly: connect once, then stream.
      // ============================================================================================
      const SCOPE = { reason: "Feature Case — pressure-tests whether one feature is worth building, on your own Claude", models: ["sonnet"], tools: [] };
      const STREAM_TIMEOUT_MS = 180000;
      function provider() { const p = window.claude; return (p && p.isRelay) ? p : null; }
      // The extension injects window.claude at document_start but it can land a beat AFTER our module
      // runs (it fires a `claude#initialized` event when ready) — so never declare it absent on the
      // first synchronous look; wait briefly, exactly like @relay/sdk's whenRelayReady.
      function waitForProvider(timeoutMs = 4000) {
        const now = provider(); if (now) return Promise.resolve(now);
        return new Promise((resolve) => {
          let done = false;
          const finish = () => { if (done) return; done = true; clearInterval(poll); clearTimeout(timer); window.removeEventListener("claude#initialized", onInit); resolve(provider()); };
          const onInit = () => finish();
          const poll = setInterval(() => { if (provider()) finish(); }, 80);
          const timer = setTimeout(finish, timeoutMs);
          window.addEventListener("claude#initialized", onInit);
        });
      }
      let grant = null, connectTried = false;
      async function ensure() {
        const p = await waitForProvider();
        if (!p) throw new Error("Switchboard isn't here — open this widget in the notch (window.claude is missing).");
        // Best-effort grant: if this origin already has one, great. If not, kick a connect BUT never
        // block the model call on it — the notch host serves this as a granted origin, and connect can
        // sit pending an interactive consent chip. We race it against a short timeout and proceed; the
        // stream/complete call the daemon authorizes on its own is the real gate.
        if (!grant && !connectTried) {
          connectTried = true;
          grant = await p.request({ method: "claude_permissions" }).catch(() => null);
          if (!grant) {
            const timeout = new Promise((r) => setTimeout(() => r(null), 1500));
            grant = await Promise.race([p.request({ method: "claude_connect", params: SCOPE }).catch(() => null), timeout]);
          }
        }
        return p;
      }
      async function streamText(params, onProgress) {
        const p = await ensure();
        const { streamId } = await p.request({ method: "claude_stream", params });
        let text = "";
        return await new Promise((resolve, reject) => {
          let timer = null;
          const cleanup = () => { clearTimeout(timer); p.removeListener("delta", handler); };
          const handler = (payload) => {
            const d = payload; if (!d || d.streamId !== streamId) return;
            if (d.type === "text") { text += d.text; onProgress && onProgress(text); }
            else if (d.type === "error") { cleanup(); reject(new Error(d.error?.message || "stream error")); }
            else if (d.type === "done") { cleanup(); resolve(text); }
          };
          p.on("delta", handler);
          timer = setTimeout(() => { cleanup(); reject(new Error("Switchboard didn't respond — is the sidekick running?")); }, STREAM_TIMEOUT_MS);
        });
      }
      function parseJson(text) {
        const t = String(text || "").replace(/```[a-z]*\n?/gi, "").trim();
        const s = t.indexOf("{"), e = t.lastIndexOf("}");
        if (s === -1 || e <= s) return null;
        try { return JSON.parse(t.slice(s, e + 1)); } catch { return null; }
      }

      // ---- injected-input contract ----
      function injectedText() {
        try { const q = new URLSearchParams(location.search).get("input"); if (q) return q; } catch {}
        const w = window.__widgetInput;
        if (typeof w === "string" && w.trim()) return w;
        if (w && typeof w === "object" && typeof w.text === "string" && w.text.trim()) return w.text;
        return "";
      }

      // ---- primary action: the case (a compact single-pass reuse of ideabrain's validate) ----
      const $ = (id) => document.getElementById(id);
      const el = (tag, cls, text) => { const n = document.createElement(tag); if (cls) n.className = cls; if (text != null) n.textContent = text; return n; };
      const msg = (e) => String(e?.message || e).slice(0, 200);
      const inEl = $("in"), out = $("out"), goBtn = $("go");
      let running = false;

      async function run() {
        const idea = inEl.value.trim();
        if (!idea) { inEl.focus(); return; }
        if (running) return;
        running = true; goBtn.disabled = true; render({ status: "pressure-testing the case…" });
        try {
          const text = await streamText({
            model: "sonnet", effort: "low", maxTokens: 900,
            prompt: [
              "You are Feature Case. A founder is weighing ONE feature. Make the honest case — build it, defer it, or cut it — and say WHY. Reason over real user value, effort, and what it displaces. Never hype.",
              `THE FEATURE: "${idea}"`,
              "Return ONLY this JSON (no prose, no fences):",
              `{"stance":"build|defer|cut","headline":"<=8 words — the verdict","case":"one line: the strongest reason to build it","risk":"one line: what could make it not worth it","effort":"one line: effort vs impact, honestly"}`,
            ].join("\n\n"),
          });
          const p = parseJson(text);
          if (!p) throw new Error("couldn't read a verdict — try again");
          render({ verdict: {
            stance: ["build", "defer", "cut"].includes(p.stance) ? p.stance : "defer",
            headline: String(p.headline || "Weighed").slice(0, 80),
            caseFor: String(p.case || "").slice(0, 240),
            risk: String(p.risk || "").slice(0, 240),
            effort: String(p.effort || "").slice(0, 240),
          }, idea });
        } catch (e) { render({ error: msg(e), idea }); }
        finally { running = false; goBtn.disabled = false; }
      }

      function render(s) {
        out.textContent = "";
        if (s?.status) { const r = el("div", "scan"); r.append(el("span", "dot3"), el("span", null, s.status)); out.append(r); return; }
        if (s?.error) {
          const box = el("div", "card"); box.append(el("div", "err", s.error));
          const retry = el("button", "act", "try again"); retry.onclick = () => void run(); box.append(retry);
          out.append(box); return;
        }
        if (s?.verdict) {
          const v = s.verdict, card = el("div", "card");
          const vr = el("div", "verdict");
          vr.append(el("span", "badge " + v.stance, v.stance === "build" ? "build it" : v.stance === "cut" ? "cut it" : "defer"));
          vr.append(el("span", "hl", v.headline));
          card.append(vr);
          const lines = el("div", "lines");
          if (v.caseFor) { const l = el("div", "line case"); l.append(el("span", "k", "the case"), el("span", "v", v.caseFor)); lines.append(l); }
          if (v.risk) { const l = el("div", "line"); l.append(el("span", "k", "the risk"), el("span", "v", v.risk)); lines.append(l); }
          if (v.effort) { const l = el("div", "line"); l.append(el("span", "k", "effort vs impact"), el("span", "v", v.effort)); lines.append(l); }
          card.append(lines);
          const bar = el("div", "row"); bar.style.alignItems = "center";
          const cp = el("button", "act", "copy"); cp.onclick = () => navigator.clipboard?.writeText(`${v.stance.toUpperCase()} — ${v.headline}\n\nThe case: ${v.caseFor}\nThe risk: ${v.risk}\nEffort vs impact: ${v.effort}`).catch(() => {});
          const again = el("button", "act", "× new"); again.onclick = () => { out.textContent = ""; inEl.focus(); };
          bar.append(cp, again); card.append(bar);
          out.append(card); return;
        }
      }

      goBtn.onclick = () => void run();
      inEl.addEventListener("keydown", (e) => { if (e.key === "Enter" && (e.metaKey || e.ctrlKey)) { e.preventDefault(); void run(); } });

      const seed = injectedText();
      if (seed) { inEl.value = seed; void run(); }
      inEl.focus();
    </script>
  </body>
</html>
