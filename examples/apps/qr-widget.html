<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>QR · widget</title>
    <style>
      /* Notch widget tokens — compact, dark, one system. */
      :root {
        --page:#0A0C10; --inset:#070809; --panel:#141416; --raised:#1A1F29;
        --edge:#282829; --edge-soft:#1C212B;
        --ink:#E8EDF4; --ink-sec:#B4BECE; --ink-dim:#9A9AA2; --ink-faint:#6E7C90;
        --accent:#C8F250; --accent-soft:#232B0D; --ok:#3DD68C; --danger:#FF2D6E;
        --sans:"Hanken Grotesk",ui-sans-serif,system-ui,-apple-system,sans-serif;
        --mono:"Spline Sans Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
      }
      *{box-sizing:border-box;}
      [hidden]{display:none !important;}
      html,body{margin:0;}
      body{background:var(--page);color:var(--ink);font:13px/1.5 var(--sans);-webkit-font-smoothing:antialiased;}
      .wrap{width:560px;max-width:100vw;margin:0 auto;padding:14px 16px 16px;display:flex;flex-direction:column;gap:12px;}
      .head{display:flex;align-items:center;gap:8px;}
      .mk{width:16px;height:16px;border-radius:5px;background:var(--accent);box-shadow:0 0 10px rgba(200,242,80,.4);}
      .name{font:600 13px/1 var(--sans);letter-spacing:-.01em;}
      .name em{font-style:normal;color:var(--accent);}
      .kicker{font:500 9px/1 var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--ink-dim);margin-left:auto;}
      .flabel{font:500 9px/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--ink-dim);margin-bottom:6px;display:block;}
      .qr-in{width:100%;background:var(--inset);border:1px solid var(--edge);border-radius:9px;color:var(--ink);font:400 13px/1.4 var(--mono);padding:11px 12px;outline:none;}
      .qr-in:focus{border-color:color-mix(in srgb,var(--accent) 55%,var(--edge));}
      .row{display:flex;align-items:center;gap:10px;}
      .seg{display:inline-flex;background:var(--inset);border:1px solid var(--edge);border-radius:8px;padding:2px;gap:2px;}
      .segbtn{font:500 11px/1 var(--sans);background:none;border:0;color:var(--ink-sec);border-radius:6px;padding:6px 11px;cursor:pointer;transition:background .15s,color .15s;}
      .segbtn:hover{color:var(--ink);}
      .segbtn.on{background:var(--accent);color:var(--page);font-weight:600;}
      .out{border:1px solid var(--edge);border-radius:12px;background:var(--panel);padding:14px;display:flex;gap:14px;align-items:center;}
      .qr-canvas{border-radius:8px;border:1px solid var(--edge);image-rendering:pixelated;background:#fff;width:150px;height:150px;flex:none;}
      .meta{display:flex;flex-direction:column;gap:9px;min-width:0;}
      .metaline{font:500 10px/1.3 var(--mono);color:var(--ink-faint);}
      .act{font:500 11px/1 var(--mono);background:var(--inset);border:1px solid var(--edge);border-radius:999px;color:var(--ink-sec);padding:7px 12px;cursor:pointer;text-decoration:none;display:inline-block;transition:border-color .15s,color .15s;}
      .act:hover{border-color:var(--accent);color:var(--ink);}
      .act.dl{border-color:color-mix(in srgb,var(--accent) 45%,var(--edge));color:var(--accent);}
      .dlrow{display:flex;gap:7px;flex-wrap:wrap;}
      .placeholder{font:400 11px/1.5 var(--mono);color:var(--ink-faint);}
      .err{color:var(--danger);font:400 11px/1.5 var(--mono);}
      .nobadge{display:inline-flex;align-items:center;gap:7px;font:500 10px/1 var(--mono);color:var(--ink-dim);}
      .nobadge .dot{width:6px;height:6px;border-radius:50%;background:var(--ok);box-shadow:0 0 7px var(--ok);}
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="head"><span class="mk"></span><span class="name"><em>QR</em></span><span class="kicker">on your device</span></div>
      <div>
        <label class="flabel" for="qr-in">Text or URL</label>
        <input id="qr-in" class="qr-in" type="text" autofocus placeholder="https://example.com or any text…" />
      </div>
      <div class="row">
        <span class="flabel" style="margin:0;">Error correction</span>
        <div class="seg" id="lvl"></div>
      </div>
      <div class="out" id="out"><div class="placeholder">Type something above to get a QR code.</div></div>
      <div class="nobadge"><span class="dot"></span>Runs fully on your device · no AI · no upload</div>
    </div>

    <script type="module">
      import qrcode from "./src/vendor/qrcode.mjs";

      // ---- injected-input contract: ?input=<url-encoded> OR window.__widgetInput { text, dataUrl?, filename? }
      function injectedText() {
        try {
          const q = new URLSearchParams(location.search).get("input");
          if (q != null && q !== "") return q;
        } catch {}
        const w = window.__widgetInput;
        if (w && typeof w === "object" && typeof w.text === "string" && w.text.trim()) return w.text;
        if (typeof w === "string" && w.trim()) return w;
        return "";
      }

      // ---- core pipeline copied from src/qr.js (pure, model-free) ----
      const LEVELS = [{ id:"L" },{ id:"M" },{ id:"Q" },{ id:"H" }];
      const FG = "#0A0C10", BG = "#FFFFFF", MARGIN = 4, SIZE = 300;
      let level = "M";
      const msg = (e) => String(e?.message || e).slice(0, 160);

      function encode(str, lvl) {
        const q = qrcode(0, LEVELS.some((l) => l.id === lvl) ? lvl : "M");
        q.addData(String(str)); q.make(); return q;
      }
      function toSvg(q) {
        const n = q.getModuleCount(), total = n + MARGIN * 2;
        let rects = "";
        for (let r = 0; r < n; r++) for (let c = 0; c < n; c++)
          if (q.isDark(r, c)) rects += `<rect x="${c+MARGIN}" y="${r+MARGIN}" width="1" height="1"/>`;
        return `<svg xmlns="http://www.w3.org/2000/svg" width="${SIZE}" height="${SIZE}" viewBox="0 0 ${total} ${total}" shape-rendering="crispEdges"><rect width="${total}" height="${total}" fill="${BG}"/><g fill="${FG}">${rects}</g></svg>`;
      }
      function toCanvas(q) {
        const n = q.getModuleCount(), total = n + MARGIN * 2;
        const scale = Math.max(1, Math.floor(SIZE / total)), px = total * scale;
        const canvas = document.createElement("canvas");
        canvas.width = px; canvas.height = px;
        const ctx = canvas.getContext("2d");
        ctx.fillStyle = BG; ctx.fillRect(0, 0, px, px); ctx.fillStyle = FG;
        for (let r = 0; r < n; r++) for (let c = 0; c < n; c++)
          if (q.isDark(r, c)) ctx.fillRect((c+MARGIN)*scale, (r+MARGIN)*scale, scale, scale);
        return canvas;
      }

      // ---- UI ----
      const $ = (id) => document.getElementById(id);
      const inEl = $("qr-in"), out = $("out"), lvlSeg = $("lvl");
      for (const l of LEVELS) {
        const b = document.createElement("button");
        b.className = "segbtn" + (level === l.id ? " on" : ""); b.textContent = l.id;
        b.onclick = () => { level = l.id; [...lvlSeg.children].forEach((c) => c.classList.toggle("on", c.textContent === l.id)); run(); };
        lvlSeg.append(b);
      }
      let qr = null;
      function render() {
        out.textContent = "";
        if (!inEl.value.trim()) { out.append(mk("div", "placeholder", "Type something above to get a QR code.")); qr = null; return; }
        let q; try { q = encode(inEl.value, level); } catch (e) { out.append(mk("div", "err", "Couldn't encode — " + msg(e) + " (try shorter text or a lower level).")); qr = null; return; }
        qr = q;
        const canvas = toCanvas(q); canvas.className = "qr-canvas";
        const meta = mk("div", "meta");
        meta.append(mk("div", "metaline", `${q.getModuleCount()}×${q.getModuleCount()} modules · level ${level}`));
        const dl = mk("div", "dlrow");
        const png = mk("a", "act dl", "PNG ⬇"); png.href = "#"; png.onclick = (e) => { e.preventDefault(); dlPng(canvas); };
        const svg = mk("a", "act dl", "SVG ⬇"); svg.href = "#"; svg.onclick = (e) => { e.preventDefault(); dlSvg(q); };
        const cp = mk("button", "act", "copy"); cp.onclick = () => copyPng(canvas);
        dl.append(png, svg, cp); meta.append(dl);
        out.append(canvas, meta);
      }
      function mk(tag, cls, text) { const n = document.createElement(tag); if (cls) n.className = cls; if (text != null) n.textContent = text; return n; }
      let t = null;
      function run() { render(); }
      function debounced() { clearTimeout(t); t = setTimeout(run, 140); }
      inEl.addEventListener("input", debounced);

      function dlPng(canvas) { canvas.toBlob((b) => { if (!b) return; const u = URL.createObjectURL(b); const a = mk("a"); a.href = u; a.download = "qr.png"; a.click(); setTimeout(() => URL.revokeObjectURL(u), 1000); }, "image/png"); }
      function dlSvg(q) { const b = new Blob([toSvg(q)], { type: "image/svg+xml" }); const u = URL.createObjectURL(b); const a = mk("a"); a.href = u; a.download = "qr.svg"; a.click(); setTimeout(() => URL.revokeObjectURL(u), 1000); }
      async function copyPng(canvas) { try { const b = await new Promise((r) => canvas.toBlob(r, "image/png")); if (b && navigator.clipboard && window.ClipboardItem) await navigator.clipboard.write([new window.ClipboardItem({ "image/png": b })]); } catch {} }

      // init: injected input pre-fills + renders
      const seed = injectedText();
      if (seed) inEl.value = seed;
      render();
      inEl.focus();
    </script>
  </body>
</html>
