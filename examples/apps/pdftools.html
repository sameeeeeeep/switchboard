<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>PDF Tools — merge, split &amp; compress PDFs on your device</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Hanken+Grotesk:wght@400;500;600&family=Spline+Sans+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <style>
      /* HOUSE "Atlas cockpit" system (brandbrain tokens). Add app CSS at the END. */
      :root {
        --page: #0A0C10; --inset: #070809; --panel: #12151C; --raised: #1A1F29;
        --edge: #262C38; --edge-soft: #1C212B;
        --ink: #E8EDF4; --ink-sec: #B4BECE; --ink-dim: #99A3B7; --ink-faint: #6E7C90;
        --accent: #C8F250; --accent-soft: #232B0D;
        --ok: #3DD68C; --warn: #F59E0B; --danger: #FF2D6E; --blue: #7DE0FF;
        --display: "Bricolage Grotesque", ui-sans-serif, system-ui, sans-serif;
        --sans: "Hanken Grotesk", ui-sans-serif, system-ui, sans-serif;
        --mono: "Spline Sans Mono", ui-monospace, monospace;
      }
      * { box-sizing: border-box; }
      [hidden] { display: none !important; }
      html, body { margin: 0; min-height: 100%; }
      body { background: var(--page); color: var(--ink); font: 14px/1.6 var(--sans); -webkit-font-smoothing: antialiased; }
      ::selection { background: rgba(200, 242, 80, 0.3); }
      button { font-family: inherit; }
      .kicker { font: 500 10px/1 var(--mono); letter-spacing: .16em; text-transform: uppercase; color: var(--ink-dim); }

      header { display: flex; align-items: center; gap: 14px; padding: 13px 20px; border-bottom: 1px solid var(--edge-soft); }
      .word { font: 700 20px/1 var(--display); letter-spacing: -0.02em; display: flex; align-items: center; gap: 9px; }
      .word em { font-style: normal; color: var(--accent); }
      .word .mk { width: 22px; height: 22px; border-radius: 6px; background: var(--accent); box-shadow: 0 0 14px rgba(200,242,80,.4); }
      #chip-dock { margin-left: auto; }

      main { max-width: 720px; margin: 0 auto; padding: 40px 20px 90px; }
      .hero h1 { font: 700 clamp(1.7rem, 4vw, 2.5rem)/1.05 var(--display); letter-spacing: -0.02em; margin: 0 0 10px; }
      .hero h1 em { font-style: normal; color: var(--accent); }
      .hero p { color: var(--ink-sec); margin: 0 0 26px; font-size: 14.5px; max-width: 540px; }

      .primary { font: 600 13.5px/1 var(--sans); border-radius: 10px; padding: 12px 18px; cursor: pointer; border: 1px solid var(--accent); background: var(--accent); color: var(--page); transition: filter .15s, opacity .15s; }
      .primary:hover { filter: brightness(1.08); }
      .primary:disabled { opacity: .5; cursor: default; }
      .act { font: 500 11.5px/1 var(--mono); background: var(--inset); border: 1px solid var(--edge); border-radius: 999px; color: var(--ink-sec); padding: 7px 11px; cursor: pointer; transition: border-color .15s, color .15s; text-decoration: none; display: inline-block; }
      .act:hover { border-color: var(--accent); color: var(--ink); }

      .toast { position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%); background: var(--raised); border: 1px solid var(--edge); color: var(--ink); font: 500 12.5px/1.4 var(--sans); padding: 11px 16px; border-radius: 10px; box-shadow: 0 14px 40px -14px rgba(0,0,0,.7); z-index: 200; max-width: 80vw; }
      .toast.err { border-color: var(--danger); color: #ffd6e2; }

      /* ==== app-specific CSS below this line ==== */
      .modebox { display: flex; flex-direction: column; gap: 8px; margin-bottom: 16px; }
      .seg { display: inline-flex; background: var(--inset); border: 1px solid var(--edge); border-radius: 10px; padding: 3px; gap: 3px; }
      .seg.modes { align-self: flex-start; }
      .segbtn { font: 500 12px/1 var(--sans); background: none; border: 0; color: var(--ink-sec); border-radius: 7px; padding: 9px 18px; cursor: pointer; white-space: nowrap; transition: background .15s, color .15s; }
      .segbtn:hover { color: var(--ink); }
      .segbtn.on { background: var(--accent); color: var(--page); font-weight: 600; }
      .modehint { font: 400 11.5px/1.4 var(--mono); color: var(--ink-faint); }

      .drop { margin-top: 6px; border: 1.5px dashed var(--edge); border-radius: 18px; background: var(--inset); padding: 44px 24px; text-align: center; cursor: pointer; transition: border-color .15s, background .15s; }
      .drop:hover, .drop.over { border-color: var(--accent); background: color-mix(in srgb, var(--accent-soft) 40%, var(--inset)); }
      .drop-ic { font-size: 32px; line-height: 1; margin-bottom: 12px; }
      .drop-t { font: 700 17px/1.2 var(--display); color: var(--ink); }
      .drop-s { font: 400 12px/1.5 var(--mono); color: var(--ink-faint); margin-top: 6px; }
      .drop .sample-btn { margin-top: 16px; }
      .file-in { display: none; }

      .work { display: flex; flex-direction: column; gap: 14px; }
      .filelist { display: flex; flex-direction: column; gap: 8px; }
      .filerow, .pdf-result { display: flex; align-items: center; gap: 10px; background: var(--inset); border: 1px solid var(--edge); border-radius: 12px; padding: 10px 13px; }
      .fic { font-size: 16px; }
      .fname { font: 500 13px/1.3 var(--sans); color: var(--ink); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 46%; }
      .fmeta { font: 500 11px/1 var(--mono); color: var(--ink-faint); }
      .grow { flex: 1; }
      .delta { font: 500 11px/1 var(--mono); padding: 4px 8px; border-radius: 999px; border: 1px solid var(--edge); }
      .delta.good { color: var(--ok); border-color: color-mix(in srgb, var(--ok) 40%, var(--edge)); }
      .delta.warn { color: var(--warn); border-color: color-mix(in srgb, var(--warn) 40%, var(--edge)); }

      .ctlrow { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
      .rangewrap input { background: var(--inset); border: 1px solid var(--edge); border-radius: 10px; color: var(--ink); font: 400 12.5px/1 var(--mono); padding: 9px 12px; outline: none; min-width: 220px; }
      .rangewrap input:focus { border-color: color-mix(in srgb, var(--accent) 55%, var(--edge)); }

      .outcard { border: 1px solid var(--edge); border-radius: 16px; background: var(--panel); padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; }
      .outcard .kicker { margin-bottom: 2px; }
      .dl { border-color: color-mix(in srgb, var(--accent) 45%, var(--edge)); color: var(--accent); }

      .nobadge { display: inline-flex; align-items: center; gap: 8px; margin-top: 8px; font: 500 11.5px/1 var(--mono); color: var(--ink-dim); background: var(--panel); border: 1px solid var(--edge-soft); border-radius: 999px; padding: 8px 13px; align-self: flex-start; }
      .nobadge .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--ok); box-shadow: 0 0 8px var(--ok); }
    </style>
  </head>
  <body>
    <header>
      <span class="word"><span class="mk"></span>PDF <em>Tools</em></span>
      <div id="chip-dock"></div>
    </header>
    <main>
      <section class="hero" id="hero">
        <h1>Merge, split, <em>compress PDFs.</em></h1>
        <p>Combine files, pull out pages, or shrink a PDF — entirely in this tab. No AI, no upload, no cost, no waiting on a server. Your documents never leave your browser. Powered by pdf-lib, zero network at runtime.</p>
      </section>
      <div id="view"></div>
    </main>
    <script type="module" src="./dist/pdftools.js"></script>
  </body>
</html>
