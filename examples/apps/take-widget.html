<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Take · widget</title>
    <style>
      :root {
        --page:#0A0C10; --inset:#070809; --panel:#141416; --raised:#1A1F29;
        --edge:#282829; --edge-soft:#1C212B;
        --ink:#E8EDF4; --ink-sec:#B4BECE; --ink-dim:#9A9AA2; --ink-faint:#6E7C90;
        --accent:#C8F250; --ok:#3DD68C; --danger:#FF2D6E;
        --sans:"Hanken Grotesk",ui-sans-serif,system-ui,-apple-system,sans-serif;
        --mono:"Spline Sans Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
      }
      *{box-sizing:border-box;} [hidden]{display:none !important;}
      html,body{margin:0;}
      body{background:var(--page);color:var(--ink);font:13px/1.5 var(--sans);-webkit-font-smoothing:antialiased;}
      .wrap{width:560px;max-width:100vw;margin:0 auto;padding:14px 16px 16px;display:flex;flex-direction:column;gap:11px;}
      .head{display:flex;align-items:center;gap:8px;}
      .mk{width:16px;height:16px;border-radius:5px;background:var(--accent);box-shadow:0 0 10px rgba(200,242,80,.4);}
      .name{font:600 13px/1 var(--sans);} .name em{font-style:normal;color:var(--accent);}
      .kicker{font:500 9px/1 var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--ink-dim);margin-left:auto;}
      .flabel{font:500 9px/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--ink-dim);}
      .row{display:flex;align-items:center;gap:10px;}
      input.line{flex:1;background:var(--inset);border:1px solid var(--edge);border-radius:9px;color:var(--ink);font:400 13px/1.4 var(--sans);padding:11px 12px;outline:none;}
      input.line:focus{border-color:color-mix(in srgb,var(--accent) 55%,var(--edge));}
      .seg{display:inline-flex;background:var(--inset);border:1px solid var(--edge);border-radius:8px;padding:2px;gap:2px;}
      .segbtn{font:500 11px/1 var(--sans);background:none;border:0;color:var(--ink-sec);border-radius:6px;padding:6px 10px;cursor:pointer;}
      .segbtn.on{background:var(--accent);color:var(--page);font-weight:600;}
      .go{font:600 12px/1 var(--sans);background:var(--accent);color:var(--page);border:0;border-radius:999px;padding:10px 16px;cursor:pointer;transition:opacity .15s;white-space:nowrap;}
      .go:disabled{opacity:.4;cursor:default;}
      .act{font:500 11px/1 var(--mono);background:var(--inset);border:1px solid var(--edge);border-radius:999px;color:var(--ink-sec);padding:7px 12px;cursor:pointer;transition:border-color .15s,color .15s;}
      .act:hover{border-color:var(--accent);color:var(--ink);}
      .tabs{display:flex;gap:6px;flex-wrap:wrap;}
      .tab{font:500 10px/1 var(--mono);border:1px solid var(--edge);background:var(--inset);color:var(--ink-sec);border-radius:999px;padding:6px 11px;cursor:pointer;position:relative;}
      .tab.on{border-color:var(--accent);color:var(--ink);}
      .tab .star{color:var(--accent);margin-right:4px;}
      .script{border:1px solid var(--edge);border-radius:11px;background:var(--panel);padding:12px;}
      .beats{margin:0;white-space:pre-wrap;font:400 12px/1.55 var(--mono);color:var(--ink-sec);}
      .statusrow{display:flex;align-items:center;gap:9px;font:400 11px/1.4 var(--mono);color:var(--ink-faint);}
      .scan{height:2px;border-radius:2px;background:linear-gradient(90deg,transparent,var(--accent),transparent);background-size:200% 100%;animation:scan 1.1s linear infinite;width:60%;}
      @keyframes scan{0%{background-position:200% 0}100%{background-position:-200% 0}}
      .err{color:var(--danger);font:400 12px/1.5 var(--mono);}
      .placeholder{font:400 11px/1.5 var(--mono);color:var(--ink-faint);}
      .badge{display:inline-flex;align-items:center;gap:7px;font:500 10px/1 var(--mono);color:var(--ink-dim);}
      .badge .dot{width:6px;height:6px;border-radius:50%;background:var(--ok);box-shadow:0 0 7px var(--ok);}
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="head"><span class="mk"></span><span class="name"><em>Take</em></span><span class="kicker">recording script</span></div>
      <div class="row">
        <span class="flabel">Mode</span>
        <div class="seg" id="mode"></div>
      </div>
      <div class="row">
        <input id="line" class="line" type="text" autofocus placeholder="what are you recording? e.g. a 40s walkthrough of the pricing page" />
        <button class="go" id="go">Script ▸</button>
      </div>
      <div id="out"><div class="placeholder">One line in — Take drafts three script angles (one recommended) on your Claude.</div></div>
      <div class="badge"><span class="dot"></span>Runs on your own Claude · nothing uploaded</div>
    </div>

    <script type="module">
      // ===== window.claude bridge — the SAME provider the full page's SDK wraps =====================
      const SCOPE = { reason: "Take — draft a recording script on your own Claude", models: ["sonnet"] };
      function providerNow(){ const p = window.claude; return (p && p.isRelay) ? p : null; }
      function whenProvider(ms = 4000){ return new Promise((res) => { const now = providerNow(); if (now) return res(now); let done = false; const on = () => { if (done) return; done = true; cleanup(); res(providerNow()); }; const t = setTimeout(() => { if (done) return; done = true; cleanup(); res(providerNow()); }, ms); function cleanup(){ clearTimeout(t); window.removeEventListener("claude#initialized", on); } window.addEventListener("claude#initialized", on); }); }
      let _relay = null;
      async function relay(){
        if (_relay) return _relay;
        const p = await whenProvider();
        if (!p) throw new Error("Switchboard isn't connected — open this from the Switchboard notch.");
        let grant = null; try { grant = await p.request({ method: "claude_permissions" }); } catch {}
        if (!grant) { try { grant = await p.request({ method: "claude_connect", params: SCOPE }); } catch (e) { throw new Error("connect failed: " + (e?.message || e)); } }
        _relay = { async *stream(params){ const { streamId } = await p.request({ method: "claude_stream", params }); const q = []; let notify = null, ended = false; const h = (pl) => { if (!pl || pl.streamId !== streamId) return; q.push(pl); if (pl.type === "done" || pl.type === "error") ended = true; notify && notify(); }; p.on("delta", h); try { while (true) { if (!q.length) { if (ended) break; await new Promise((r) => (notify = r)); notify = null; continue; } yield q.shift(); } } finally { p.removeListener("delta", h); } } };
        return _relay;
      }
      async function streamText(params){ const r = await relay(); let acc = ""; for await (const d of r.stream(params)) { if (d.type === "text") acc += d.text; else if (d.type === "error") throw new Error(d.error?.message || "stream error"); } return acc; }
      function parseJsonArray(text){ const t = String(text || "").replace(/```[a-z]*\n?/gi, "").trim(); const s = t.indexOf("["), e = t.lastIndexOf("]"); if (s === -1 || e <= s) return null; try { const a = JSON.parse(t.slice(s, e + 1)); return Array.isArray(a) ? a : null; } catch { return null; } }

      // ---- injected-input contract ----
      function injectedText(){ try { const q = new URLSearchParams(location.search).get("input"); if (q) return q; } catch {} const w = window.__widgetInput; if (typeof w === "string" && w.trim()) return w; if (w && typeof w === "object" && typeof w.text === "string" && w.text.trim()) return w.text; return ""; }

      // ===== APP — compact of Take's primary action (take_script) ====================================
      // Take's own draftScript prompt (src/take.js): 3 angles of beats, one recommended.
      const MODES = { screen: { label: "Screen recording", sub: "what's on screen — the spoken line", maxSeconds: 90 }, camera: { label: "Camera / selfie", sub: "short spoken lines", maxSeconds: 60 } };
      let mode = "screen", busy = false, options = null, sel = 0;
      const $ = (id) => document.getElementById(id);
      const el = (tag, cls, text) => { const n = document.createElement(tag); if (cls) n.className = cls; if (text != null) n.textContent = text; return n; };

      const modeSeg = $("mode");
      for (const key of Object.keys(MODES)) { const b = el("button", "segbtn" + (key === mode ? " on" : ""), key); b.onclick = () => { mode = key; [...modeSeg.children].forEach((c) => c.classList.toggle("on", c.textContent === key)); }; modeSeg.append(b); }

      function render(){
        const out = $("out"); out.textContent = "";
        if (!options) return;
        const tabs = el("div", "tabs");
        options.forEach((o, i) => { const t = el("div", "tab" + (i === sel ? " on" : "")); if (o.recommended) t.append(el("span", "star", "★")); t.append(document.createTextNode(o.label)); t.onclick = () => { sel = i; render(); }; tabs.append(t); });
        out.append(tabs);
        const sc = el("div", "script"); sc.append(el("pre", "beats", options[sel].text)); out.append(sc);
        const bar = el("div", "row"); bar.style.marginTop = "9px";
        const cp = el("button", "act", "copy script"); cp.onclick = () => navigator.clipboard?.writeText(options[sel].text).catch(() => {}); bar.append(cp);
        out.append(bar);
      }

      async function draft(){
        const input = $("line").value.trim();
        if (!input || busy) { if (!input) $("line").focus(); return; }
        const m = MODES[mode];
        busy = true; $("go").disabled = true; $("go").textContent = "Scripting…"; options = null;
        const out = $("out"); out.textContent = "";
        const st = el("div", "statusrow"); st.append(el("div", "scan"), el("span", null, "drafting three angles on your Claude…")); out.append(st);
        try {
          const raw = await streamText({ prompt: [
            `You are Take, scripting a ${m.label.toLowerCase()} recording (${m.sub}, up to ${m.maxSeconds}s).`,
            `WHAT THEY'RE RECORDING (ground truth): "${input}"`,
            "Draft 3 script options, each a genuinely different angle. Each option: a list of BEATS, one per line — for screen recordings each beat is 'what's on screen — the spoken line'; for camera each beat is a short spoken line. Plain words a person actually says out loud. Never invent facts beyond what you're given.",
            'Return ONLY a JSON array — no prose, no fences. Each element: {"label":<the angle, 2-5 words>,"text":<the beats, one per line>,"recommended":<true for exactly one>}',
          ].join("\n\n") });
          const a = parseJsonArray(raw);
          if (!a || !a.length) throw new Error("no script came back — Script again.");
          options = a.slice(0, 3).map((o) => ({ label: String(o.label || "Angle").slice(0, 60), text: String(o.text || "").trim(), recommended: !!o.recommended }));
          if (!options.some((o) => o.recommended)) options[0].recommended = true;
          sel = options.findIndex((o) => o.recommended); if (sel < 0) sel = 0;
          render();
        } catch (e) { out.textContent = ""; out.append(el("div", "err", String(e?.message || e))); }
        finally { busy = false; $("go").disabled = false; $("go").textContent = "Script ▸"; }
      }
      $("go").addEventListener("click", draft);
      $("line").addEventListener("keydown", (e) => { if (e.key === "Enter") { e.preventDefault(); draft(); } });
      const seed = injectedText(); if (seed) $("line").value = seed;
      $("line").focus();
    </script>
  </body>
</html>
