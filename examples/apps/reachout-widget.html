<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Reachout · widget</title>
    <style>
      :root {
        --page:#0A0C10; --inset:#070809; --panel:#141416; --raised:#1A1F29;
        --edge:#282829; --edge-soft:#1C212B;
        --ink:#E8EDF4; --ink-sec:#B4BECE; --ink-dim:#9A9AA2; --ink-faint:#6E7C90;
        --accent:#C8F250; --accent-soft:#232B0D; --ok:#3DD68C; --warn:#F59E0B; --danger:#FF2D6E;
        --sans:"Hanken Grotesk",ui-sans-serif,system-ui,-apple-system,sans-serif;
        --mono:"Spline Sans Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
      }
      *{box-sizing:border-box;} [hidden]{display:none !important;}
      html,body{margin:0;}
      body{background:var(--page);color:var(--ink);font:13px/1.5 var(--sans);-webkit-font-smoothing:antialiased;}
      .wrap{width:560px;max-width:100vw;margin:0 auto;padding:14px 16px 16px;display:flex;flex-direction:column;gap:11px;}
      .head{display:flex;align-items:center;gap:8px;}
      .mk{width:16px;height:16px;border-radius:5px;background:var(--accent);box-shadow:0 0 10px rgba(200,242,80,.4);}
      .name{font:600 13px/1 var(--sans);letter-spacing:-.01em;} .name em{font-style:normal;color:var(--accent);}
      .kicker{font:500 9px/1 var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--ink-dim);margin-left:auto;}
      .flabel{font:500 9px/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--ink-dim);margin-bottom:6px;display:block;}
      .in{width:100%;background:var(--inset);border:1px solid var(--edge);border-radius:9px;color:var(--ink);font:400 13px/1.5 var(--sans);padding:10px 12px;outline:none;}
      textarea.in{resize:vertical;min-height:44px;}
      .in:focus{border-color:color-mix(in srgb,var(--accent) 55%,var(--edge));}
      .grid{display:flex;gap:9px;} .grid > div{flex:1;min-width:0;}
      .row{display:flex;gap:9px;align-items:center;justify-content:flex-end;}
      .go{font:600 12.5px/1 var(--sans);background:var(--accent);color:var(--page);border:0;border-radius:9px;padding:11px 16px;cursor:pointer;transition:filter .15s,opacity .15s;}
      .go:hover{filter:brightness(1.08);} .go:disabled{opacity:.45;cursor:default;}
      .email{border:1px solid var(--edge);background:var(--panel);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:9px;}
      .subj{display:flex;flex-direction:column;gap:3px;}
      .subj .k{font:500 8.5px/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--ink-dim);}
      .subj .v{font:600 14px/1.3 var(--sans);color:var(--ink);}
      .bodyt{font:400 13px/1.6 var(--sans);color:var(--ink-sec);white-space:pre-wrap;word-break:break-word;border-top:1px solid var(--edge-soft);padding-top:10px;}
      .cp{font:500 10.5px/1 var(--mono);background:var(--inset);border:1px solid var(--edge);border-radius:999px;color:var(--ink-sec);padding:7px 12px;cursor:pointer;align-self:flex-start;transition:border-color .15s,color .15s;}
      .cp:hover{border-color:var(--accent);color:var(--ink);}
      .status{display:flex;align-items:center;gap:8px;font:500 11px/1.4 var(--mono);color:var(--ink-dim);}
      .scan{position:relative;width:24px;height:6px;border-radius:3px;background:var(--inset);overflow:hidden;flex:none;}
      .scan::after{content:"";position:absolute;inset:0;width:40%;background:linear-gradient(90deg,transparent,var(--accent),transparent);animation:scan 1.1s linear infinite;}
      @keyframes scan{from{transform:translateX(-100%);}to{transform:translateX(260%);}}
      .err{color:var(--danger);font:400 11.5px/1.5 var(--mono);}
      .placeholder{font:400 11px/1.5 var(--mono);color:var(--ink-faint);}
      .foot{display:inline-flex;align-items:center;gap:7px;font:500 10px/1 var(--mono);color:var(--ink-dim);}
      .foot .dot{width:6px;height:6px;border-radius:50%;background:var(--ok);box-shadow:0 0 7px var(--ok);}
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="head"><span class="mk"></span><span class="name">Reach<em>out</em></span><span class="kicker">on your claude</span></div>
      <div class="grid">
        <div><label class="flabel" for="lead">Who you're writing to</label><input id="lead" class="in" type="text" autofocus placeholder="Priya, Head of Growth at Acme" /></div>
        <div><label class="flabel" for="sender">You / your offer</label><input id="sender" class="in" type="text" placeholder="Switchboard — run apps on your own Claude" /></div>
      </div>
      <div>
        <label class="flabel" for="hook">The one true, specific reason you're reaching them</label>
        <textarea id="hook" class="in" placeholder="You just shipped an AI feature — this keeps your users' data on their own machine."></textarea>
      </div>
      <div class="row"><button id="go" class="go">Draft the email</button></div>
      <div id="out"><div class="placeholder">A lead and a real reason — get a personalized cold email you can copy and send yourself.</div></div>
      <div class="foot"><span class="dot"></span>Drafted on your own Claude · you copy and send it yourself</div>
    </div>

    <script type="module">
      function injectedText() {
        try { const q = new URLSearchParams(location.search).get("input"); if (q != null && q !== "") return q; } catch {}
        const w = window.__widgetInput;
        if (w && typeof w === "object" && typeof w.text === "string" && w.text.trim()) return w.text;
        if (typeof w === "string" && w.trim()) return w;
        return "";
      }
      const SCOPE = { reason: "Reachout widget — draft one personalized cold email, on your own Claude", models: ["sonnet"] };
      function provider() { const c = window.claude; return (c && c.isRelay && typeof c.request === "function") ? c : null; }
      function waitForProvider(ms = 1500) {
        const p = provider(); if (p) return Promise.resolve(p);
        return new Promise((res) => { let done = false; const fin = () => { if (done) return; done = true; res(provider()); };
          window.addEventListener("claude#initialized", fin, { once: true }); setTimeout(fin, ms); });
      }
      let grantP = null;
      function ensureGrant(p) {
        if (!grantP) grantP = (async () => { try { const g = await p.request({ method: "claude_permissions" }); if (g) return g; } catch {} return p.request({ method: "claude_connect", params: SCOPE }); })();
        return grantP;
      }
      async function streamPrompt(p, params, onText) {
        const { streamId } = await p.request({ method: "claude_stream", params });
        return new Promise((resolve, reject) => {
          let text = "", settled = false;
          const cleanup = () => { settled = true; try { p.removeListener("delta", handler); } catch {} clearTimeout(timer); };
          const handler = (d) => {
            if (!d || d.streamId !== streamId) return;
            if (d.type === "text") { text += d.text; onText && onText(text); }
            else if (d.type === "error") { cleanup(); reject(new Error((d.error && d.error.message) || "stream error")); }
            else if (d.type === "done") { cleanup(); resolve((d.result && d.result.text) || text); }
          };
          const timer = setTimeout(() => { if (!settled) { cleanup(); reject(new Error("Switchboard didn't respond — reload the widget and try again.")); } }, 180000);
          p.on("delta", handler);
        });
      }
      async function ask(prompt, onText) {
        const p = await waitForProvider();
        if (!p) throw new Error("Switchboard isn't connected — open this widget from the notch.");
        await ensureGrant(p);
        return streamPrompt(p, { prompt, model: "sonnet", maxTokens: 1400 }, onText);
      }

      // mirrors src/core/reachout.core.js buildSequencePrompt (single touch)
      function buildPrompt(lead, sender, hook) {
        return [
          "You are Reachout, drafting a personalized B2B outreach email on the sender's own Claude — 1 touch to ONE lead.",
          sender ? `SENDER / ICP CONTEXT (ground the copy in how the sender talks): ${sender}.` : "SENDER / ICP CONTEXT: none lent — write in a plain, honest founder voice.",
          `THE LEAD (the recipient): ${lead}.`,
          `THE HOOK (the one true, specific reason — the ONLY ground for personalization): "${hook}"`,
          "Touch 1: one genuine reason (the hook), one concrete value line, one low-friction ask. Under-6-word subject; 3–5 short lines. Honest and specific — no hype, no fake familiarity, no 'just circling back'. Always leave a clean opt-out.",
          'Return ONLY a JSON object — no prose, no markdown fences — exactly: {"touches":[{"subject":"…","body":"…"}]} with one entry. Body is plain text with real line breaks.',
        ].join("\n\n");
      }
      function parseJson(text) {
        let t = String(text || "").replace(/```[a-z]*\n?/gi, "").trim();
        const s = t.indexOf("{"), e = t.lastIndexOf("}");
        if (s === -1 || e <= s) return null;
        try { return JSON.parse(t.slice(s, e + 1)); } catch { return null; }
      }
      const $ = (id) => document.getElementById(id);
      const mk = (tag, cls, text) => { const n = document.createElement(tag); if (cls) n.className = cls; if (text != null) n.textContent = text; return n; };
      const out = $("out"), leadEl = $("lead"), senderEl = $("sender"), hookEl = $("hook"), goEl = $("go");
      let busy = false;
      function renderEmail(subject, body) {
        out.textContent = "";
        const card = mk("div", "email");
        const subj = mk("div", "subj"); subj.append(mk("div", "k", "subject"), mk("div", "v", subject || "(no subject)")); card.append(subj);
        card.append(mk("div", "bodyt", body || "(empty)"));
        const cp = mk("button", "cp", "copy email");
        cp.onclick = () => { navigator.clipboard?.writeText((subject ? "Subject: " + subject + "\n\n" : "") + body).catch(() => {}); cp.textContent = "copied ✓"; setTimeout(() => (cp.textContent = "copy email"), 1400); };
        card.append(cp); out.append(card);
      }
      async function run() {
        const lead = leadEl.value.trim(), hook = hookEl.value.trim(), sender = senderEl.value.trim();
        if (!lead) { leadEl.focus(); return; }
        if (!hook) { hookEl.focus(); return; }
        if (busy) return;
        busy = true; goEl.disabled = true; out.textContent = "";
        const st = mk("div", "status"); st.append(mk("div", "scan"), mk("span", null, "drafting the email on your Claude…")); out.append(st);
        try {
          const raw = await ask(buildPrompt(lead, sender, hook));
          const d = parseJson(raw);
          if (d && Array.isArray(d.touches) && d.touches[0]) { renderEmail(String(d.touches[0].subject || ""), String(d.touches[0].body || "")); }
          else if (d && (d.subject || d.body)) { renderEmail(String(d.subject || ""), String(d.body || "")); }
          else if (d && (d.summary || d.body)) { renderEmail("", String(d.body || d.summary || "")); }
          else { renderEmail("", String(raw || "").trim() || "(no email came back — try rephrasing the hook)"); }
        } catch (e) { out.textContent = ""; out.append(mk("div", "err", String(e?.message || e).slice(0, 200))); }
        finally { busy = false; goEl.disabled = false; }
      }
      goEl.addEventListener("click", run);
      const seed = injectedText(); if (seed) hookEl.value = seed;
      leadEl.focus();
    </script>
  </body>
</html>
