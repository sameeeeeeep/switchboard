<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>App Planner · widget</title>
    <style>
      :root {
        --page:#0A0C10; --inset:#070809; --panel:#141416; --raised:#1A1F29;
        --edge:#282829; --edge-soft:#1C212B;
        --ink:#E8EDF4; --ink-sec:#B4BECE; --ink-dim:#9A9AA2; --ink-faint:#6E7C90;
        --accent:#C8F250; --accent-soft:#232B0D; --ok:#3DD68C; --danger:#FF2D6E;
        --sans:"Hanken Grotesk",ui-sans-serif,system-ui,-apple-system,sans-serif;
        --mono:"Spline Sans Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
      }
      *{box-sizing:border-box;} [hidden]{display:none !important;}
      html,body{margin:0;}
      body{background:var(--page);color:var(--ink);font:13px/1.5 var(--sans);-webkit-font-smoothing:antialiased;}
      .wrap{width:560px;max-width:100vw;margin:0 auto;padding:14px 16px 16px;display:flex;flex-direction:column;gap:11px;}
      .head{display:flex;align-items:center;gap:8px;}
      .mk{width:16px;height:16px;border-radius:5px;background:var(--accent);box-shadow:0 0 10px rgba(200,242,80,.4);}
      .name{font:600 13px/1 var(--sans);} .name em{font-style:normal;color:var(--accent);}
      .kicker{font:500 9px/1 var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--ink-dim);margin-left:auto;}
      .flabel{font:500 9px/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--ink-dim);margin-bottom:6px;display:block;}
      .in{width:100%;background:var(--inset);border:1px solid var(--edge);border-radius:9px;color:var(--ink);font:400 13px/1.4 var(--sans);padding:11px 12px;outline:none;}
      .in:focus{border-color:color-mix(in srgb,var(--accent) 55%,var(--edge));}
      .row{display:flex;align-items:center;gap:9px;}
      .go{font:600 12px/1 var(--sans);background:var(--accent);color:var(--page);border:0;border-radius:8px;padding:10px 16px;cursor:pointer;transition:opacity .13s;}
      .go:hover{opacity:.9;} .go:disabled{background:var(--raised);color:var(--ink-faint);cursor:not-allowed;}
      .grow{flex:1;}
      .stat{font:500 11px/1.4 var(--mono);color:var(--ink-sec);display:flex;align-items:center;gap:8px;}
      .dot{width:7px;height:7px;border-radius:50%;background:var(--accent);box-shadow:0 0 8px var(--accent);animation:blink 1.1s ease-in-out infinite;}
      @keyframes blink{50%{opacity:.25;}}
      .err{color:var(--danger);font:400 11px/1.5 var(--mono);}
      .out{border:1px solid var(--edge);border-radius:12px;background:var(--panel);overflow:hidden;}
      .pitch{padding:12px 13px;border-bottom:1px solid var(--edge-soft);}
      .pitch .nm{font:600 14px/1.2 var(--sans);color:var(--accent);}
      .pitch .ol{font:400 12px/1.45 var(--sans);color:var(--ink-sec);margin-top:4px;}
      .sect{padding:11px 13px;border-top:1px solid var(--edge-soft);}
      .sect:first-of-type{border-top:0;}
      .slabel{font:500 8.5px/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--ink-faint);margin-bottom:4px;}
      .sbody{font:400 11.5px/1.5 var(--sans);color:var(--ink);}
      .toolrow{display:flex;align-items:center;gap:8px;}
      .act{font:500 11px/1 var(--mono);background:var(--inset);border:1px solid var(--edge);border-radius:999px;color:var(--ink-sec);padding:7px 12px;cursor:pointer;transition:border-color .15s,color .15s;}
      .act:hover{border-color:var(--accent);color:var(--ink);}
      .conn{font:500 10px/1.4 var(--mono);color:var(--ink-dim);}
      .conn a{color:var(--accent);}
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="head"><span class="mk"></span><span class="name"><em>App Planner</em></span><span class="kicker">consumer app · your claude</span></div>
      <div>
        <label class="flabel" for="in">The app idea — one line</label>
        <div class="row">
          <input id="in" class="in" type="text" autofocus placeholder="a daily 2-minute journaling app that turns entries into a mood graph" />
          <button id="go" class="go">Plan it</button>
        </div>
      </div>
      <div id="stat" class="stat" hidden><span class="dot"></span><span id="stat-line">Planning…</span></div>
      <div id="errbox" class="err" hidden></div>
      <div id="out" class="out" hidden></div>
      <div class="toolrow" id="toolrow" hidden>
        <button class="act" id="copy-all">⧉ copy plan</button>
        <span class="grow"></span>
        <span class="conn" id="conn"></span>
      </div>
      <div class="conn" id="conn-idle"></div>
    </div>

    <script type="module">
      function injectedText() {
        try { const q = new URLSearchParams(location.search).get("input"); if (q) return q; } catch {}
        const w = window.__widgetInput;
        if (typeof w === "string" && w.trim()) return w;
        if (w && typeof w === "object" && typeof w.text === "string" && w.text.trim()) return w.text;
        return "";
      }
      const PROVIDER = "claude";
      const SCOPE = { reason: "plan a consumer app end to end on your own Claude", tools: [], models: ["sonnet"] };
      function rawProvider() { const p = window[PROVIDER]; return p && p.isRelay ? p : null; }
      function whenProvider(ms = 2500) { const n = rawProvider(); if (n) return Promise.resolve(n); return new Promise((res) => { const done = () => { clearTimeout(t); res(rawProvider()); }; const t = setTimeout(done, ms); window.addEventListener(`${PROVIDER}#initialized`, done, { once: true }); }); }
      async function ensureConnected(p) { try { const g = await p.request({ method: "claude_permissions" }); if (g) return true; } catch {} try { const g = await p.request({ method: "claude_connect", params: SCOPE }); return !!g; } catch { return false; } }
      function streamText(p, params, onP) {
        return new Promise(async (resolve, reject) => {
          let streamId; try { ({ streamId } = await p.request({ method: "claude_stream", params })); } catch (e) { reject(e); return; }
          let text = "";
          const h = (d) => {
            if (!d || d.streamId !== streamId) return;
            if (d.type === "text") { text += d.text; onP && onP("text", text); }
            else if (d.type === "done") { cleanup(); resolve(text || (d.result && d.result.text) || ""); }
            else if (d.type === "error") { cleanup(); const e = new Error(d.error && d.error.message || "stream error"); e.code = d.error && d.error.code; reject(e); }
          };
          function cleanup() { try { p.removeListener("delta", h); } catch {} }
          p.on("delta", h);
        });
      }
      function parseObj(t) { const m = String(t).replace(/```(?:json)?/gi, "").match(/\{[\s\S]*\}/); if (!m) throw new Error("PARSE"); try { return JSON.parse(m[0]); } catch { throw new Error("PARSE"); } }
      const str = (v, fb = "") => (typeof v === "string" && v.trim() ? v.trim() : fb);

      // ---- plan shape (Consumer App Planner: core loop · retention · distribution · monetization) ----
      const SHAPE = [
        "{",
        '"appName": a short punchy product name,',
        '"oneLiner": one sentence — what it is and who it is for,',
        '"coreLoop": one sentence — the repeatable action the user does that delivers value,',
        '"retentionHook": one sentence — the reason they come back tomorrow,',
        '"distribution": one sentence — the single most credible way the first 1,000 users find it,',
        '"monetization": one sentence — how it makes money,',
        '"northStar": 3-6 words — the one metric that proves it is working',
        "}",
      ].join("\n");
      function buildPrompt(idea) {
        return [
          "You are a sharp consumer-app product strategist. Plan this app end to end, concretely — no buzzwords, no hedging.",
          "THE IDEA: " + idea,
          "Respond with ONLY one JSON object — no prose, no markdown fences — shaped exactly:\n" + SHAPE,
        ].join("\n\n");
      }
      function normalize(d) {
        if (!d || (!str(d.coreLoop) && !str(d.oneLiner))) throw new Error("INCOMPLETE");
        return {
          appName: str(d.appName, "Your app"), oneLiner: str(d.oneLiner),
          coreLoop: str(d.coreLoop), retentionHook: str(d.retentionHook),
          distribution: str(d.distribution), monetization: str(d.monetization), northStar: str(d.northStar),
        };
      }

      const $ = (id) => document.getElementById(id);
      const inEl = $("in"), goEl = $("go"), out = $("out"), stat = $("stat"), statLine = $("stat-line"), errbox = $("errbox");
      const mk = (tag, cls, text) => { const n = document.createElement(tag); if (cls) n.className = cls; if (text != null) n.textContent = text; return n; };
      let busy = false, provider = null, plan = null;
      const SECTIONS = [["coreLoop", "core loop"], ["retentionHook", "retention hook"], ["distribution", "distribution"], ["monetization", "monetization"], ["northStar", "north-star metric"]];

      function idleConn() {
        const c = $("conn-idle"); c.textContent = "";
        if (provider) { c.textContent = "connected — planned on your Claude, the app never sees a key"; return; }
        c.append("everything runs on your own Claude — ");
        const a = mk("a", null, "get Switchboard"); a.href = "https://thelastprompt.ai/switchboard/"; a.target = "_blank"; a.rel = "noreferrer"; c.append(a);
      }
      function setBusy(on, line) { busy = on; stat.hidden = !on; if (on) { errbox.hidden = true; statLine.textContent = line || "Planning…"; } goEl.disabled = on || !inEl.value.trim(); }
      function showError(err) {
        errbox.hidden = false; const msg = String(err?.message || err), code = err?.code;
        if (code === 4290) errbox.textContent = "Budget cap reached — raise it in the Switchboard panel, or try tomorrow.";
        else if (code === 4900) errbox.textContent = "Your Claude is unreachable — start the Switchboard daemon, then retry.";
        else if (msg === "PARSE" || msg === "INCOMPLETE") errbox.textContent = "Reply didn't parse cleanly — hit Plan it again.";
        else errbox.textContent = "Couldn't plan — " + msg.slice(0, 160);
      }
      function render() {
        out.textContent = ""; out.hidden = false; $("toolrow").hidden = false;
        const pitch = mk("div", "pitch");
        pitch.append(mk("div", "nm", plan.appName));
        if (plan.oneLiner) pitch.append(mk("div", "ol", plan.oneLiner));
        out.append(pitch);
        for (const [key, label] of SECTIONS) {
          if (!plan[key]) continue;
          const s = mk("div", "sect");
          s.append(mk("div", "slabel", label), mk("div", "sbody", plan[key]));
          out.append(s);
        }
        $("conn").textContent = "planned on your Claude";
      }
      function planText() {
        const L = [plan.appName + " — " + plan.oneLiner, ""];
        for (const [key, label] of SECTIONS) if (plan[key]) L.push(label.toUpperCase() + ": " + plan[key]);
        return L.join("\n");
      }
      async function run() {
        const idea = inEl.value.trim(); if (busy || !idea) return;
        provider = provider || await whenProvider();
        if (!provider) { showError(new Error("Switchboard isn't connected — open this inside the notch, or install the sidekick.")); return; }
        setBusy(true, "Connecting…");
        if (!await ensureConnected(provider)) { setBusy(false); showError(new Error("Connect declined — approve the Switchboard grant to plan.")); return; }
        setBusy(true, "Planning the app…");
        try {
          const text = await streamText(provider, { prompt: buildPrompt(idea), agentic: false }, (k, v) => { if (k === "text") statLine.textContent = "Planning the app… " + (v.length / 1024).toFixed(1) + " kb"; });
          plan = normalize(parseObj(text)); render();
        } catch (err) { showError(err); }
        finally { setBusy(false); idleConn(); }
      }
      $("copy-all").addEventListener("click", async () => { if (!plan) return; try { await navigator.clipboard.writeText(planText()); } catch {} });
      goEl.addEventListener("click", run);
      inEl.addEventListener("input", () => { goEl.disabled = busy || !inEl.value.trim(); });
      inEl.addEventListener("keydown", (e) => { if (e.key === "Enter") { e.preventDefault(); run(); } });

      const seed = injectedText(); if (seed) inEl.value = seed;
      goEl.disabled = !inEl.value.trim();
      whenProvider(2500).then((p) => { provider = p; idleConn(); });
      idleConn(); inEl.focus();
    </script>
  </body>
</html>
