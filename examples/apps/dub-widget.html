<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Dub · widget</title>
    <style>
      :root {
        --page:#0A0C10; --inset:#070809; --panel:#141416; --raised:#1A1F29;
        --edge:#282829; --edge-soft:#1C212B;
        --ink:#E8EDF4; --ink-sec:#B4BECE; --ink-dim:#9A9AA2; --ink-faint:#6E7C90;
        --accent:#C8F250; --accent-soft:#232B0D; --ok:#3DD68C; --warn:#F59E0B; --danger:#FF2D6E;
        --sans:"Hanken Grotesk",ui-sans-serif,system-ui,-apple-system,sans-serif;
        --mono:"Spline Sans Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
      }
      *{box-sizing:border-box;} [hidden]{display:none !important;}
      html,body{margin:0;}
      body{background:var(--page);color:var(--ink);font:13px/1.5 var(--sans);-webkit-font-smoothing:antialiased;}
      .wrap{width:560px;max-width:100vw;margin:0 auto;padding:14px 16px 16px;display:flex;flex-direction:column;gap:11px;}
      .head{display:flex;align-items:center;gap:8px;}
      .mk{width:16px;height:16px;border-radius:5px;background:var(--accent);box-shadow:0 0 10px rgba(200,242,80,.4);}
      .name{font:600 13px/1 var(--sans);} .name em{font-style:normal;color:var(--accent);}
      .kicker{font:500 9px/1 var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--ink-dim);margin-left:auto;}
      .drop{display:flex;flex-direction:column;align-items:center;gap:5px;text-align:center;border:1.5px dashed var(--edge);border-radius:12px;padding:22px 16px;background:var(--inset);cursor:pointer;transition:border-color .15s,background .15s;}
      .drop:hover,.drop.over{border-color:color-mix(in srgb,var(--accent) 55%,var(--edge));background:color-mix(in srgb,var(--accent-soft) 30%,var(--inset));}
      .drop-ic{font:700 20px/1 var(--sans);color:var(--accent);letter-spacing:.1em;}
      .drop-t{font:600 13px/1.2 var(--sans);color:var(--ink);}
      .drop-s{font:400 11px/1.4 var(--sans);color:var(--ink-dim);max-width:320px;}
      .status{display:flex;align-items:center;gap:8px;font:500 11px/1.4 var(--mono);color:var(--ink-dim);}
      .scan{position:relative;width:24px;height:6px;border-radius:3px;background:var(--inset);overflow:hidden;}
      .scan::after{content:"";position:absolute;inset:0;width:40%;background:linear-gradient(90deg,transparent,var(--accent),transparent);animation:scan 1.1s linear infinite;}
      @keyframes scan{from{transform:translateX(-100%);}to{transform:translateX(260%);}}
      .spk{border:1px solid var(--edge);border-radius:10px;background:var(--panel);padding:9px 11px;display:flex;flex-direction:column;gap:3px;}
      .spk.rec{border-color:color-mix(in srgb,var(--accent) 40%,var(--edge));}
      .spk-top{display:flex;align-items:center;gap:7px;}
      .spk-n{font:600 12px/1 var(--sans);color:var(--ink);}
      .tag{font:500 8px/1 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--accent);background:var(--accent-soft);border:1px solid color-mix(in srgb,var(--accent) 30%,transparent);border-radius:999px;padding:3px 6px;}
      .spk-meta{font:400 11px/1.4 var(--sans);color:var(--ink-dim);}
      .err{color:var(--danger);font:400 12px/1.5 var(--mono);}
      .open{font:600 11px/1 var(--sans);background:var(--accent);color:var(--page);border:0;border-radius:8px;padding:9px 12px;cursor:pointer;align-self:flex-start;}
      .nobadge{display:inline-flex;align-items:center;gap:7px;font:500 10px/1 var(--mono);color:var(--ink-dim);}
      .nobadge .dot{width:6px;height:6px;border-radius:50%;background:var(--ok);box-shadow:0 0 7px var(--ok);}
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="head"><span class="mk"></span><span class="name">D<em>ub</em></span><span class="kicker">revoice speakers</span></div>
      <label class="drop" id="drop">
        <div class="drop-ic">▚</div>
        <div class="drop-t">Drop an audio clip</div>
        <div class="drop-s">wav · mp3 · m4a — transcribed locally to find the speakers. Never uploaded.</div>
        <input id="file" type="file" accept="audio/*" hidden />
      </label>
      <div id="out"></div>
      <div class="nobadge"><span class="dot"></span>Transcription runs on your device · audio stays local</div>
    </div>

    <script type="module">
      // ---- injected-input contract: ?input=<url-encoded data URL> OR window.__widgetInput { audio|dataUrl } ----
      function injectedAudio() {
        try { const q = new URLSearchParams(location.search).get("input"); if (q && /^data:audio\//.test(q)) return q; } catch {}
        const w = window.__widgetInput;
        if (typeof w === "string" && /^data:audio\//.test(w)) return w;
        if (w && typeof w === "object") {
          if (/^data:audio\//.test(String(w.audio || ""))) return w.audio;
          if (/^data:audio\//.test(String(w.dataUrl || ""))) return w.dataUrl;
        }
        return "";
      }

      // ================= window.claude bridge =================
      // The notch host injects window.claude — the raw BYOP provider. A self-contained widget can't
      // bundle the SDK, so we talk to the provider directly: claude_transcribe (local STT) to get the
      // text, then a streamed completion to split it into speakers. Same contract @relay/sdk wraps.
      const SCOPE = { reason: "Dub widget — split an audio clip into a per-speaker script, on your own Claude", models: ["sonnet"] };
      const msg = (e) => String(e?.message || e).slice(0, 200);
      function provider() { const c = window.claude; return (c && c.isRelay && typeof c.request === "function") ? c : null; }
      function waitForProvider(ms = 1500) {
        const p = provider(); if (p) return Promise.resolve(p);
        return new Promise((res) => { let done = false; const fin = () => { if (done) return; done = true; res(provider()); };
          window.addEventListener("claude#initialized", fin, { once: true }); setTimeout(fin, ms); });
      }
      let grantP = null;
      function ensureGrant(p) {
        if (!grantP) grantP = (async () => {
          try { const g = await p.request({ method: "claude_permissions" }); if (g) return g; } catch {}
          return p.request({ method: "claude_connect", params: SCOPE });
        })();
        return grantP;
      }
      async function transcribe(p, audioDataUrl) {
        const out = await p.request({ method: "claude_transcribe", params: { audio: audioDataUrl } });
        const text = String(out?.text || "").trim();
        if (!text) throw new Error("No speech recognized — the daemon needs a local whisper/STT backend.");
        return text;
      }
      async function streamPrompt(p, params) {
        const { streamId } = await p.request({ method: "claude_stream", params });
        return new Promise((resolve, reject) => {
          let text = "", settled = false;
          const cleanup = () => { settled = true; try { p.removeListener("delta", handler); } catch {} clearTimeout(timer); };
          const handler = (d) => {
            if (!d || d.streamId !== streamId) return;
            if (d.type === "text") text += d.text;
            else if (d.type === "error") { cleanup(); reject(new Error((d.error && d.error.message) || "stream error")); }
            else if (d.type === "done") { cleanup(); resolve((d.result && d.result.text) || text); }
          };
          const timer = setTimeout(() => { if (!settled) { cleanup(); reject(new Error("Switchboard didn't respond — reload the widget and try again.")); } }, 180000);
          p.on("delta", handler);
        });
      }
      function parseJson(text) {
        let t = String(text || "").replace(/```[a-z]*\n?/gi, "").trim();
        const s = t.indexOf("{"), e = t.lastIndexOf("}");
        if (s === -1 || e <= s) return null;
        try { return JSON.parse(t.slice(s, e + 1)); } catch { return null; }
      }
      // NOTE: the daemon has no audio diarizer, so this INFERS speakers from the transcript text — a
      // guess, not who-spoke-when. The full page (src/dub.js) has the swappable diarize() seam that
      // will prefer a real daemon diarizer once one exists; this compact widget mirrors its fallback.
      function splitPrompt(transcript) {
        return [
          "You are Dub. You are given a transcript that is NOT diarized (no ground-truth speaker labels). Infer who spoke each part from conversational cues. If clearly one person, return one speaker.",
          `TRANSCRIPT:\n"""${String(transcript).slice(0, 8000)}"""`,
          'Reply with ONE JSON object ONLY — no prose, no fences: { "speakers":[{"id":"s1","name":"Speaker 1"}], "turns":[{"speaker":"s1","text":"…"}] }. Every turn.speaker must be a listed id. Keep turns in spoken order. Never invent content.',
        ].join("\n\n");
      }

      // ---- UI ----
      const mk = (tag, cls, text) => { const n = document.createElement(tag); if (cls) n.className = cls; if (text != null) n.textContent = text; return n; };
      const out = document.getElementById("out"), fileEl = document.getElementById("file"), dropEl = document.getElementById("drop");
      let busy = false;

      function fileToDataUrl(file) {
        return new Promise((resolve, reject) => { const fr = new FileReader(); fr.onload = () => resolve(String(fr.result || "")); fr.onerror = () => reject(new Error("couldn't read that file")); fr.readAsDataURL(file); });
      }
      function showStatus(t) { out.textContent = ""; const st = mk("div", "status"); st.append(mk("div", "scan"), mk("span", null, t)); out.append(st); }
      function showErr(t) { out.textContent = ""; out.append(mk("div", "err", t)); }
      function openDub() { try { window.__openWrapp ? window.__openWrapp("dub") : window.open("/dub.html", "_blank"); } catch { window.open("/dub.html", "_blank"); } }

      async function run(audioDataUrl) {
        if (busy) return; busy = true;
        try {
          const p = await waitForProvider();
          if (!p) throw new Error("Switchboard isn't connected — open this widget from the notch.");
          await ensureGrant(p);
          showStatus("transcribing on your device…");
          const transcript = await transcribe(p, audioDataUrl);
          showStatus("splitting into speakers…");
          const script = parseJson(await streamPrompt(p, { prompt: splitPrompt(transcript), model: "sonnet", maxTokens: 1600 }));
          if (!script || !Array.isArray(script.speakers) || !script.speakers.length) throw new Error("Couldn't split that into speakers — try Dub in the tab.");
          const turns = Array.isArray(script.turns) ? script.turns : [];
          out.textContent = "";
          script.speakers.forEach((sp, i) => {
            const n = turns.filter((t) => t.speaker === sp.id).length;
            const sample = (turns.find((t) => t.speaker === sp.id)?.text || "").slice(0, 90);
            const card = mk("div", "spk" + (i === 0 ? " rec" : ""));
            const top = mk("div", "spk-top"); top.append(mk("span", "spk-n", sp.name || `Speaker ${i + 1}`)); if (i === 0) top.append(mk("span", "tag", "pick a voice")); card.append(top);
            card.append(mk("div", "spk-meta", `${n} turn${n === 1 ? "" : "s"}${sample ? ` · “${sample}${sample.length >= 90 ? "…" : ""}”` : ""}`));
            out.append(card);
          });
          const note = mk("div", "spk-meta", "Speakers inferred from the transcript — not audio diarization.");
          note.style.color = "var(--warn)"; out.append(note);
          const btn = mk("button", "open", "Open Dub — pick voices & regenerate"); btn.onclick = openDub; out.append(btn);
        } catch (e) { showErr(msg(e)); }
        finally { busy = false; }
      }

      fileEl.onchange = () => { const f = fileEl.files && fileEl.files[0]; if (f) fileToDataUrl(f).then(run); };
      dropEl.addEventListener("dragover", (e) => { e.preventDefault(); dropEl.classList.add("over"); });
      dropEl.addEventListener("dragleave", () => dropEl.classList.remove("over"));
      dropEl.addEventListener("drop", (e) => { e.preventDefault(); dropEl.classList.remove("over"); const f = e.dataTransfer?.files?.[0]; if (f) fileToDataUrl(f).then(run); });

      const seed = injectedAudio();
      if (seed) run(seed);
    </script>
  </body>
</html>
