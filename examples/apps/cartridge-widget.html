<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Cartridge · widget</title>
    <style>
      :root {
        --page:#0A0C10; --inset:#070809; --panel:#141416; --raised:#1A1F29;
        --edge:#282829; --edge-soft:#1C212B;
        --ink:#E8EDF4; --ink-sec:#B4BECE; --ink-dim:#9A9AA2; --ink-faint:#6E7C90;
        --accent:#C8F250; --accent-soft:#232B0D; --ok:#3DD68C; --danger:#FF2D6E;
        --sans:"Hanken Grotesk",ui-sans-serif,system-ui,-apple-system,sans-serif;
        --mono:"Spline Sans Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
      }
      *{box-sizing:border-box;} [hidden]{display:none !important;}
      html,body{margin:0;}
      body{background:var(--page);color:var(--ink);font:13px/1.5 var(--sans);-webkit-font-smoothing:antialiased;}
      .wrap{width:560px;max-width:100vw;margin:0 auto;padding:14px 16px 16px;display:flex;flex-direction:column;gap:11px;}
      .head{display:flex;align-items:center;gap:8px;}
      .mk{width:16px;height:16px;border-radius:5px;background:var(--accent);box-shadow:0 0 10px rgba(200,242,80,.4);}
      .name{font:600 13px/1 var(--sans);} .name em{font-style:normal;color:var(--accent);}
      .kicker{font:500 9px/1 var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--ink-dim);margin-left:auto;}
      .flabel{font:500 9px/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--ink-dim);margin-bottom:6px;display:block;}
      .in{width:100%;background:var(--inset);border:1px solid var(--edge);border-radius:9px;color:var(--ink);font:400 13px/1.4 var(--sans);padding:11px 12px;outline:none;}
      .in:focus{border-color:color-mix(in srgb,var(--accent) 55%,var(--edge));}
      .row{display:flex;align-items:center;gap:9px;}
      .go{font:600 12px/1 var(--sans);background:var(--accent);color:var(--page);border:0;border-radius:8px;padding:10px 16px;cursor:pointer;transition:opacity .13s;}
      .go:hover{opacity:.9;} .go:disabled{background:var(--raised);color:var(--ink-faint);cursor:not-allowed;}
      .grow{flex:1;}
      .stat{font:500 11px/1.4 var(--mono);color:var(--ink-sec);display:flex;align-items:center;gap:8px;}
      .dot{width:7px;height:7px;border-radius:50%;background:var(--accent);box-shadow:0 0 8px var(--accent);animation:blink 1.1s ease-in-out infinite;}
      @keyframes blink{50%{opacity:.25;}}
      .err{color:var(--danger);font:400 11px/1.5 var(--mono);}
      .frame-wrap{border:1px solid var(--edge);border-radius:12px;background:#000;overflow:hidden;}
      iframe{width:100%;height:360px;border:0;display:block;background:#000;}
      .toolrow{display:flex;align-items:center;gap:8px;}
      .title{font:600 12px/1.2 var(--sans);color:var(--accent);}
      .act{font:500 11px/1 var(--mono);background:var(--inset);border:1px solid var(--edge);border-radius:999px;color:var(--ink-sec);padding:7px 12px;cursor:pointer;transition:border-color .15s,color .15s;}
      .act:hover{border-color:var(--accent);color:var(--ink);}
      .conn{font:500 10px/1.4 var(--mono);color:var(--ink-dim);}
      .conn a{color:var(--accent);}
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="head"><span class="mk"></span><span class="name"><em>Cartridge</em></span><span class="kicker">tiny arcade game · your claude</span></div>
      <div>
        <label class="flabel" for="in">One line — the game to forge</label>
        <div class="row">
          <input id="in" class="in" type="text" autofocus placeholder="dodge falling asteroids and grab fuel, gets faster" />
          <button id="go" class="go">Forge</button>
        </div>
      </div>
      <div id="stat" class="stat" hidden><span class="dot"></span><span id="stat-line">Forging…</span></div>
      <div id="errbox" class="err" hidden></div>
      <div id="framewrap" class="frame-wrap" hidden><iframe id="frame" sandbox="allow-scripts allow-pointer-lock" title="game"></iframe></div>
      <div class="toolrow" id="toolrow" hidden>
        <span class="title" id="gtitle"></span>
        <span class="grow"></span>
        <button class="act" id="dl">⬇ .html</button>
      </div>
      <div class="conn" id="conn-idle"></div>
    </div>

    <script type="module">
      function injectedText() {
        try { const q = new URLSearchParams(location.search).get("input"); if (q) return q; } catch {}
        const w = window.__widgetInput;
        if (typeof w === "string" && w.trim()) return w;
        if (w && typeof w === "object" && typeof w.text === "string" && w.text.trim()) return w.text;
        return "";
      }
      const PROVIDER = "claude";
      const SCOPE = { reason: "forge a complete, self-contained arcade game from one line on your own Claude", tools: [], models: ["sonnet"] };
      function rawProvider() { const p = window[PROVIDER]; return p && p.isRelay ? p : null; }
      function whenProvider(ms = 2500) { const n = rawProvider(); if (n) return Promise.resolve(n); return new Promise((res) => { const done = () => { clearTimeout(t); res(rawProvider()); }; const t = setTimeout(done, ms); window.addEventListener(`${PROVIDER}#initialized`, done, { once: true }); }); }
      async function ensureConnected(p) { try { const g = await p.request({ method: "claude_permissions" }); if (g) return true; } catch {} try { const g = await p.request({ method: "claude_connect", params: SCOPE }); return !!g; } catch { return false; } }
      function streamText(p, params, onP) {
        return new Promise(async (resolve, reject) => {
          let streamId; try { ({ streamId } = await p.request({ method: "claude_stream", params })); } catch (e) { reject(e); return; }
          let text = "";
          const h = (d) => {
            if (!d || d.streamId !== streamId) return;
            if (d.type === "text") { text += d.text; onP && onP("text", text); }
            else if (d.type === "done") { cleanup(); resolve(text || (d.result && d.result.text) || ""); }
            else if (d.type === "error") { cleanup(); const e = new Error(d.error && d.error.message || "stream error"); e.code = d.error && d.error.code; reject(e); }
          };
          function cleanup() { try { p.removeListener("delta", h); } catch {} }
          p.on("delta", h);
        });
      }
      function extractHtml(t) { let s = String(t).replace(/```(?:html)?/gi, "").trim(); const a = s.search(/<!doctype html|<html[\s>]/i), b = s.lastIndexOf("</html>"); if (a < 0 || b <= a) return null; return s.slice(a, b + 7); }
      function titleOf(html, fb) { const m = /<title>([^<]{1,60})<\/title>/i.exec(html); return (m && m[1].trim()) || fb; }

      // ---- system prompt (verbatim from src/cartridge.js SYSTEM) ----
      const SYSTEM = `You are Cartridge, an expert arcade game developer. You produce COMPLETE, self-contained HTML5 games in a SINGLE file.

Hard requirements — every one matters:
- ONE complete html document: inline <style> and <script>, canvas-based (2D context), no external URLs of any kind (no CDNs, fonts, images, audio files — draw everything with canvas, synthesize any sound with WebAudio).
- Playable immediately: game starts on first key/tap after a brief title screen showing the controls.
- Controls: keyboard (arrows/WASD + space) AND touch (tap/drag) — both must work.
- Core loop: requestAnimationFrame, delta-time based movement, score displayed, lose/win state with a "play again" that fully resets.
- Juice: particles, hit flashes, subtle screen shake, a little WebAudio blip on events. Small file, big feel.
- The page must never scroll; the canvas scales to fit the window (letterboxed) and stays crisp.
- No console errors. No TODOs. No placeholder art comments — finished code only.
- Keep it TIGHT: one perfect mechanic beats three rough ones. Target under ~350 lines / ~12kb — ship the smallest game that feels great.

Respond with ONLY the html document. No prose, no markdown fences.`;

      const $ = (id) => document.getElementById(id);
      const inEl = $("in"), goEl = $("go"), framewrap = $("framewrap"), frame = $("frame"), stat = $("stat"), statLine = $("stat-line"), errbox = $("errbox");
      const mk = (tag, cls, text) => { const n = document.createElement(tag); if (cls) n.className = cls; if (text != null) n.textContent = text; return n; };
      const GEN_LINES = ["WIRING THE PHYSICS…", "PAINTING THE SPRITES…", "TUNING THE DIFFICULTY…", "SYNTHESIZING BLIPS…", "ADDING THE JUICE…", "PRESSING THE CARTRIDGE…"];
      let busy = false, provider = null, html = "", lineTimer = null;

      function idleConn() {
        const c = $("conn-idle"); c.textContent = "";
        if (provider) { c.textContent = "connected — the game is built on your Claude, plays sandboxed here"; return; }
        c.append("everything runs on your own Claude — ");
        const a = mk("a", null, "get Switchboard"); a.href = "https://thelastprompt.ai/switchboard/"; a.target = "_blank"; a.rel = "noreferrer"; c.append(a);
      }
      function setBusy(on) {
        busy = on; stat.hidden = !on; goEl.disabled = on || !inEl.value.trim();
        clearInterval(lineTimer);
        if (on) { errbox.hidden = true; let i = 0; statLine.textContent = GEN_LINES[0]; lineTimer = setInterval(() => { i = (i + 1) % GEN_LINES.length; statLine.textContent = GEN_LINES[i]; }, 2400); }
      }
      function showError(err) {
        errbox.hidden = false; const msg = String(err?.message || err), code = err?.code;
        if (code === 4290) errbox.textContent = "Budget cap reached — raise it in the Switchboard panel, or try tomorrow.";
        else if (code === 4900) errbox.textContent = "Your Claude is unreachable — start the Switchboard daemon, then retry.";
        else errbox.textContent = "Couldn't forge — " + msg.slice(0, 160);
      }
      async function run() {
        const idea = inEl.value.trim(); if (busy || !idea) return;
        provider = provider || await whenProvider();
        if (!provider) { showError(new Error("Switchboard isn't connected — open this inside the notch, or install the sidekick.")); return; }
        setBusy(true);
        if (!await ensureConnected(provider)) { setBusy(false); showError(new Error("Connect declined — approve the Switchboard grant to forge.")); return; }
        try {
          const prompt = [
            "Make this game: " + idea,
            "Also choose a punchy 1-3 word arcade TITLE for it and put it in the <title> tag and on the title screen.",
          ].join("\n");
          const text = await streamText(provider, { prompt, system: SYSTEM, maxTokens: 16000, effort: "low" });
          html = extractHtml(text);
          if (!html) throw new Error("the game didn't come back as HTML — hit Forge again (it usually lands on the second pull)");
          frame.srcdoc = html; framewrap.hidden = false; $("toolrow").hidden = false; $("gtitle").textContent = titleOf(html, "your game");
        } catch (err) { showError(err); }
        finally { setBusy(false); idleConn(); }
      }
      $("dl").addEventListener("click", () => {
        if (!html) return; const u = URL.createObjectURL(new Blob([html], { type: "text/html" }));
        const a = mk("a"); a.href = u; a.download = (titleOf(html, "game").replace(/\s+/g, "-").toLowerCase()) + ".html"; a.click(); setTimeout(() => URL.revokeObjectURL(u), 1000);
      });
      goEl.addEventListener("click", run);
      inEl.addEventListener("input", () => { goEl.disabled = busy || !inEl.value.trim(); });
      inEl.addEventListener("keydown", (e) => { if (e.key === "Enter") { e.preventDefault(); run(); } });

      const seed = injectedText(); if (seed) inEl.value = seed;
      goEl.disabled = !inEl.value.trim();
      whenProvider(2500).then((p) => { provider = p; idleConn(); });
      idleConn(); inEl.focus();
    </script>
  </body>
</html>
