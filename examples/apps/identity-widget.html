<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Identity · widget</title>
    <style>
      /* Notch widget tokens — compact, dark, one system. */
      :root {
        --page:#0A0C10; --inset:#070809; --panel:#141416; --raised:#1A1F29;
        --edge:#282829; --edge-soft:#1C212B;
        --ink:#E8EDF4; --ink-sec:#B4BECE; --ink-dim:#9A9AA2; --ink-faint:#6E7C90;
        --accent:#C8F250; --accent-soft:#232B0D; --ok:#3DD68C; --warn:#F2C14E; --danger:#FF2D6E;
        --sans:"Hanken Grotesk",ui-sans-serif,system-ui,-apple-system,sans-serif;
        --mono:"Spline Sans Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
      }
      *{box-sizing:border-box;} [hidden]{display:none !important;}
      html,body{margin:0;}
      body{background:var(--page);color:var(--ink);font:13px/1.5 var(--sans);-webkit-font-smoothing:antialiased;}
      .wrap{width:560px;max-width:100vw;margin:0 auto;padding:14px 16px 16px;display:flex;flex-direction:column;gap:11px;}
      .head{display:flex;align-items:center;gap:8px;}
      .mk{width:16px;height:16px;border-radius:5px;background:var(--accent);box-shadow:0 0 10px rgba(200,242,80,.4);}
      .name{font:600 13px/1 var(--sans);letter-spacing:-.01em;} .name em{font-style:normal;color:var(--accent);}
      .kicker{font:500 9px/1 var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--ink-dim);margin-left:auto;}
      .flabel{font:500 9px/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--ink-dim);margin-bottom:6px;display:block;}
      .row{display:flex;align-items:flex-end;gap:9px;}
      .grow{flex:1;}
      textarea{width:100%;background:var(--inset);border:1px solid var(--edge);border-radius:9px;color:var(--ink);font:400 13px/1.45 var(--sans);padding:10px 11px;outline:none;resize:vertical;}
      textarea:focus{border-color:color-mix(in srgb,var(--accent) 55%,var(--edge));}
      .go{flex:none;font:600 12px/1 var(--sans);background:var(--accent);color:var(--page);border:0;border-radius:9px;padding:11px 15px;cursor:pointer;transition:filter .15s;}
      .go:hover{filter:brightness(1.06);} .go:disabled{opacity:.5;cursor:default;}
      .act{font:500 11px/1 var(--mono);background:var(--inset);border:1px solid var(--edge);border-radius:999px;color:var(--ink-sec);padding:7px 12px;cursor:pointer;transition:border-color .15s,color .15s;}
      .act:hover{border-color:var(--accent);color:var(--ink);} .act:disabled{opacity:.5;cursor:default;}
      .hint{font:400 10px/1.4 var(--mono);color:var(--ink-faint);}
      .scan{display:flex;align-items:center;gap:9px;font:500 11px/1 var(--mono);color:var(--ink-sec);padding:3px 0;}
      .dot3{width:26px;height:6px;border-radius:6px;background:linear-gradient(90deg,var(--accent),transparent);background-size:200% 100%;animation:sweep 1.1s linear infinite;}
      @keyframes sweep{to{background-position:-200% 0;}}
      .card{border:1px solid var(--edge);border-radius:12px;background:var(--panel);padding:13px 14px;display:flex;flex-direction:column;gap:10px;}
      .persona{display:flex;flex-direction:column;gap:3px;}
      .pname{font:600 16px/1.2 var(--sans);letter-spacing:-.01em;color:var(--ink);}
      .pone{font:400 12.5px/1.4 var(--sans);color:var(--accent);}
      .traits{display:flex;flex-wrap:wrap;gap:6px;}
      .trait{font:500 10px/1 var(--mono);letter-spacing:.04em;color:var(--ink-sec);background:var(--inset);border:1px solid var(--edge);border-radius:999px;padding:5px 9px;}
      .lines{display:flex;flex-direction:column;gap:9px;}
      .line{display:flex;flex-direction:column;gap:2px;}
      .line .k{font:500 9px/1 var(--mono);letter-spacing:.13em;text-transform:uppercase;color:var(--ink-faint);}
      .line .v{font:400 12.5px/1.45 var(--sans);color:var(--ink-sec);}
      .err{color:var(--danger);font:400 11px/1.5 var(--mono);}
      .aibadge{display:inline-flex;align-items:center;gap:7px;font:500 10px/1 var(--mono);color:var(--ink-dim);}
      .aibadge .dot{width:6px;height:6px;border-radius:50%;background:var(--accent);box-shadow:0 0 7px var(--accent);}
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="head"><span class="mk"></span><span class="name"><em>Identity</em></span><span class="kicker">on your Claude</span></div>
      <div>
        <label class="flabel" for="in">The creator — one line</label>
        <div class="row">
          <textarea id="in" rows="2" autofocus placeholder="e.g. a dry, no-nonsense creator teaching SaaS founders to sell…"></textarea>
          <button class="go" id="go">Compose</button>
        </div>
        <div class="hint" style="margin-top:6px;">⌘/Ctrl + Enter · a persona: name, voice, traits, one-liner</div>
      </div>
      <div id="out"></div>
      <div class="aibadge"><span class="dot"></span>Runs on your own Claude · no key · nothing leaves but your prompt</div>
    </div>

    <script type="module">
      // ============================================================================================
      // window.claude bridge — the notch host injects `window.claude` (the raw BYOP provider the full
      // Identity page uses via @relay/sdk). We talk to it directly: connect once, then stream.
      // ============================================================================================
      const SCOPE = { reason: "Identity — compose an AI creator persona on your own Claude", models: ["sonnet"], tools: [] };
      function provider() { const c = window.claude; return (c && c.isRelay && typeof c.request === "function") ? c : null; }
      function waitForProvider(ms = 1500) {
        const p = provider(); if (p) return Promise.resolve(p);
        return new Promise((res) => { let done = false; const fin = () => { if (done) return; done = true; res(provider()); };
          window.addEventListener("claude#initialized", fin, { once: true }); setTimeout(fin, ms); });
      }
      let grantP = null;
      function ensureGrant(p) {
        if (!grantP) grantP = (async () => { try { const g = await p.request({ method: "claude_permissions" }); if (g) return g; } catch {} return p.request({ method: "claude_connect", params: SCOPE }); })();
        return grantP;
      }
      async function streamPrompt(p, params, onText) {
        const { streamId } = await p.request({ method: "claude_stream", params });
        return new Promise((resolve, reject) => {
          let text = "", settled = false;
          const cleanup = () => { settled = true; try { p.removeListener("delta", handler); } catch {} clearTimeout(timer); };
          const handler = (d) => {
            if (!d || d.streamId !== streamId) return;
            if (d.type === "text") { text += d.text; onText && onText(text); }
            else if (d.type === "error") { cleanup(); reject(new Error((d.error && d.error.message) || "stream error")); }
            else if (d.type === "done") { cleanup(); resolve((d.result && d.result.text) || text); }
          };
          const timer = setTimeout(() => { if (!settled) { cleanup(); reject(new Error("Switchboard didn't respond — reload the widget and try again.")); } }, 180000);
          p.on("delta", handler);
        });
      }
      async function ask(prompt, onText) {
        const p = await waitForProvider();
        if (!p) throw new Error("Switchboard isn't connected — open this widget from the notch.");
        await ensureGrant(p);
        return streamPrompt(p, { prompt, model: "sonnet", maxTokens: 900 }, onText);
      }
      function parseJson(text) {
        const t = String(text || "").replace(/```[a-z]*\n?/gi, "").trim();
        const s = t.indexOf("{"), e = t.lastIndexOf("}");
        if (s === -1 || e <= s) return null;
        try { return JSON.parse(t.slice(s, e + 1)); } catch { return null; }
      }

      // ---- injected-input contract ----
      function injectedText() {
        try { const q = new URLSearchParams(location.search).get("input"); if (q != null && q !== "") return q; } catch {}
        const w = window.__widgetInput;
        if (w && typeof w === "object" && typeof w.text === "string" && w.text.trim()) return w.text;
        if (typeof w === "string" && w.trim()) return w;
        return "";
      }

      // ---- primary action: compose (a compact single-pass reuse of Identity's facet composer) ----
      const $ = (id) => document.getElementById(id);
      const el = (tag, cls, text) => { const n = document.createElement(tag); if (cls) n.className = cls; if (text != null) n.textContent = text; return n; };
      const msg = (e) => String(e?.message || e).slice(0, 200);
      const inEl = $("in"), out = $("out"), goBtn = $("go");
      let running = false;

      async function run() {
        const brief = inEl.value.trim();
        if (!brief) { inEl.focus(); return; }
        if (running) return;
        running = true; goBtn.disabled = true; render({ status: "composing the persona…" });
        try {
          const text = await ask([
            "You are Identity, composing an AI creator persona from a founder's one line, on their own Claude. Invent a real human creator who could own this niche — never a brand name. Ground every facet in the brief.",
            `THE BRIEF: "${brief}"`,
            "Return ONLY this JSON (no prose, no fences):",
            `{"name":"a real first+last name for the creator","oneliner":"<=12 words — who they are in one line","voice":"one line: how they sound on camera + a signature phrase","traits":["trait","trait","trait"],"audience":"one line: who this creator is for"}`,
          ].join("\n\n"));
          const p = parseJson(text);
          if (!p) throw new Error("couldn't read a persona — try again");
          render({ persona: {
            name: String(p.name || "The Creator").slice(0, 60),
            oneliner: String(p.oneliner || "").slice(0, 140),
            voice: String(p.voice || "").slice(0, 240),
            traits: (Array.isArray(p.traits) ? p.traits : []).slice(0, 5).map((t) => String(t).slice(0, 24)),
            audience: String(p.audience || "").slice(0, 240),
          } });
        } catch (e) { render({ error: msg(e) }); }
        finally { running = false; goBtn.disabled = false; }
      }

      function render(s) {
        out.textContent = "";
        if (s?.status) { const r = el("div", "scan"); r.append(el("span", "dot3"), el("span", null, s.status)); out.append(r); return; }
        if (s?.error) {
          const box = el("div", "card"); box.append(el("div", "err", s.error));
          const retry = el("button", "act", "try again"); retry.onclick = () => void run(); box.append(retry);
          out.append(box); return;
        }
        if (s?.persona) {
          const v = s.persona, card = el("div", "card");
          const per = el("div", "persona");
          per.append(el("div", "pname", v.name));
          if (v.oneliner) per.append(el("div", "pone", v.oneliner));
          card.append(per);
          if (v.traits.length) { const t = el("div", "traits"); for (const x of v.traits) t.append(el("span", "trait", x)); card.append(t); }
          const lines = el("div", "lines");
          if (v.voice) { const l = el("div", "line"); l.append(el("span", "k", "voice"), el("span", "v", v.voice)); lines.append(l); }
          if (v.audience) { const l = el("div", "line"); l.append(el("span", "k", "who it's for"), el("span", "v", v.audience)); lines.append(l); }
          card.append(lines);
          const bar = el("div", "row"); bar.style.alignItems = "center";
          const cp = el("button", "act", "copy"); cp.onclick = () => navigator.clipboard?.writeText(`${v.name} — ${v.oneliner}\n\nTraits: ${v.traits.join(", ")}\nVoice: ${v.voice}\nWho it's for: ${v.audience}`).catch(() => {});
          const again = el("button", "act", "× new"); again.onclick = () => { out.textContent = ""; inEl.focus(); };
          bar.append(cp, again); card.append(bar);
          out.append(card); return;
        }
      }

      goBtn.onclick = () => void run();
      inEl.addEventListener("keydown", (e) => { if (e.key === "Enter" && (e.metaKey || e.ctrlKey)) { e.preventDefault(); void run(); } });

      const seed = injectedText();
      if (seed) { inEl.value = seed; void run(); }
      inEl.focus();
    </script>
  </body>
</html>
