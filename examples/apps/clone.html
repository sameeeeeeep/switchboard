<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Clone — make a voice from a clip, then speak in it</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Hanken+Grotesk:wght@400;500;600&family=Spline+Sans+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <style>
      /* HOUSE "Atlas cockpit" system (brandbrain tokens): near-black surfaces, panel cards on
         hairline edges, ONE lime accent, Bricolage display / Hanken body / Spline mono. */
      :root {
        --page: #0A0C10; --inset: #070809; --panel: #12151C; --raised: #1A1F29;
        --edge: #262C38; --edge-soft: #1C212B;
        --ink: #E8EDF4; --ink-sec: #B4BECE; --ink-dim: #99A3B7; --ink-faint: #6E7C90;
        --accent: #C8F250; --accent-soft: #232B0D;
        --ok: #3DD68C; --warn: #F59E0B; --danger: #FF2D6E; --blue: #7DE0FF;
        --display: "Bricolage Grotesque", ui-sans-serif, system-ui, sans-serif;
        --sans: "Hanken Grotesk", ui-sans-serif, system-ui, sans-serif;
        --mono: "Spline Sans Mono", ui-monospace, monospace;
      }
      * { box-sizing: border-box; }
      [hidden] { display: none !important; }
      html, body { margin: 0; min-height: 100%; }
      body { background: var(--page); color: var(--ink); font: 14px/1.6 var(--sans); -webkit-font-smoothing: antialiased; }
      ::selection { background: rgba(200, 242, 80, 0.3); }
      button { font-family: inherit; }
      .kicker { font: 500 10px/1 var(--mono); letter-spacing: .16em; text-transform: uppercase; color: var(--ink-dim); }

      header { display: flex; align-items: center; gap: 14px; padding: 13px 20px; border-bottom: 1px solid var(--edge-soft); }
      .word { font: 700 20px/1 var(--display); letter-spacing: -0.02em; display: flex; align-items: center; gap: 9px; }
      .word em { font-style: normal; color: var(--accent); }
      .word .mk { width: 22px; height: 22px; border-radius: 6px; background: var(--accent); box-shadow: 0 0 14px rgba(200,242,80,.4); }
      #chip-dock { margin-left: auto; }

      main { max-width: 720px; margin: 0 auto; padding: 40px 20px 90px; }
      .hero h1 { font: 700 clamp(1.7rem, 4vw, 2.5rem)/1.05 var(--display); letter-spacing: -0.02em; margin: 0 0 10px; }
      .hero h1 em { font-style: normal; color: var(--accent); }
      .hero p { color: var(--ink-sec); margin: 0 0 26px; font-size: 14.5px; max-width: 540px; }

      .primary { font: 600 13.5px/1 var(--sans); border-radius: 10px; padding: 12px 18px; cursor: pointer; border: 1px solid var(--accent); background: var(--accent); color: var(--page); transition: filter .15s, opacity .15s; }
      .primary:hover { filter: brightness(1.08); }
      .primary:disabled { opacity: .5; cursor: default; }
      .primary.sm { padding: 10px 14px; font-size: 12.5px; }
      .act { font: 500 11.5px/1 var(--mono); background: var(--inset); border: 1px solid var(--edge); border-radius: 999px; color: var(--ink-sec); padding: 8px 12px; cursor: pointer; transition: border-color .15s, color .15s; }
      .act:hover { border-color: var(--accent); color: var(--ink); }

      .researching { display: flex; align-items: center; gap: 8px; margin-top: 14px; font: 500 11.5px/1.4 var(--mono); color: var(--ink-dim); }
      .scan { position: relative; width: 26px; height: 6px; border-radius: 3px; background: var(--inset); overflow: hidden; }
      .scan::after { content: ""; position: absolute; inset: 0; width: 40%; background: linear-gradient(90deg, transparent, var(--accent), transparent); animation: scan 1.1s linear infinite; }
      @keyframes scan { from { transform: translateX(-100%); } to { transform: translateX(260%); } }
      .err { color: var(--danger); font: 400 12px/1.6 var(--mono); margin-top: 4px; background: color-mix(in srgb, var(--danger) 8%, var(--panel)); border: 1px solid color-mix(in srgb, var(--danger) 35%, var(--edge)); border-radius: 10px; padding: 10px 12px; }

      .toast { position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%); background: var(--raised); border: 1px solid var(--edge); color: var(--ink); font: 500 12.5px/1.4 var(--sans); padding: 11px 16px; border-radius: 10px; box-shadow: 0 14px 40px -14px rgba(0,0,0,.7); z-index: 200; max-width: 80vw; }
      .toast.err { border-color: var(--danger); color: #ffd6e2; }

      /* ==== app-specific ==== */
      .clone { display: flex; flex-direction: column; gap: 16px; }
      .panel { background: var(--panel); border: 1px solid var(--edge); border-radius: 16px; padding: 18px; }
      .stephead { display: grid; grid-template-columns: auto 1fr; align-items: center; gap: 10px; margin-bottom: 14px; }
      .stepn { width: 22px; height: 22px; display: grid; place-items: center; border-radius: 7px; background: var(--accent-soft); border: 1px solid color-mix(in srgb, var(--accent) 30%, transparent); color: var(--accent); font: 600 12px/1 var(--mono); }
      .steptitle { font: 700 15px/1.2 var(--display); color: var(--ink); }
      .stepsub { grid-column: 2; font: 400 12.5px/1.5 var(--sans); color: var(--ink-dim); margin-top: 1px; }

      .urlbox { display: flex; gap: 8px; }
      .urlbox input { flex: 1; min-width: 0; background: var(--inset); border: 1px solid var(--edge); border-radius: 10px; color: var(--ink); font: 400 13px/1.4 var(--sans); padding: 12px 13px; outline: none; }
      .urlbox input:focus { border-color: color-mix(in srgb, var(--accent) 55%, var(--edge)); }

      .srctools { display: grid; grid-template-columns: 1fr auto; gap: 10px; margin-top: 10px; align-items: stretch; }
      .drop { display: flex; align-items: center; gap: 10px; border: 1px dashed var(--edge); border-radius: 12px; padding: 13px 15px; cursor: pointer; color: var(--ink-dim); transition: border-color .15s, color .15s, background .15s; }
      .drop:hover, .drop.over { border-color: var(--accent); color: var(--ink); background: color-mix(in srgb, var(--accent-soft) 40%, transparent); }
      .dropicon { font: 700 16px/1 var(--sans); color: var(--accent); }
      .droptxt { font: 400 12.5px/1.3 var(--sans); }
      .rec { white-space: nowrap; }
      .rec.on { border-color: var(--danger); color: #ffd6e2; }

      .wave { width: 100%; height: 132px; display: block; background: var(--inset); border: 1px solid var(--edge); border-radius: 12px; cursor: ew-resize; touch-action: none; }
      .wavemeta { display: flex; align-items: center; gap: 12px; margin: 10px 0 14px; }
      .sellen { font: 500 12px/1 var(--mono); color: var(--ink-faint); }
      .sellen.ok { color: var(--accent); }
      .wavemeta .act { margin-left: auto; }

      .namerow { display: flex; gap: 8px; }
      .nameinput { flex: 1; min-width: 0; background: var(--inset); border: 1px solid var(--edge); border-radius: 10px; color: var(--ink); font: 400 13px/1.4 var(--sans); padding: 12px 13px; outline: none; }
      .nameinput:focus { border-color: color-mix(in srgb, var(--accent) 55%, var(--edge)); }

      .say { width: 100%; min-height: 120px; resize: vertical; background: var(--inset); border: 1px solid var(--edge); border-radius: 12px; color: var(--ink); font: 400 15px/1.6 var(--sans); padding: 14px 16px; outline: none; }
      .say:focus { border-color: color-mix(in srgb, var(--accent) 55%, var(--edge)); }
      .say::placeholder { color: var(--ink-dim); }
      .genrow { display: flex; gap: 10px; align-items: center; margin-top: 12px; }
      .voice { background: var(--inset); border: 1px solid var(--edge); border-radius: 10px; color: var(--ink); font: 500 13px/1 var(--sans); padding: 11px 12px; outline: none; cursor: pointer; }
      .genrow .primary { margin-left: auto; }
      .clip { display: flex; flex-direction: column; gap: 11px; background: var(--inset); border: 1px solid var(--edge); border-radius: 12px; padding: 14px 16px; margin-top: 14px; }
      .clip audio { width: 100%; }
      .clipmeta { display: flex; align-items: center; gap: 12px; }
      .clipmeta .kicker { color: var(--accent); }
      .clipmeta .act { margin-left: auto; text-decoration: none; }
    </style>
  </head>
  <body>
    <header>
      <span class="word"><span class="mk"></span>Cl<em>one</em></span>
      <div id="chip-dock"></div>
    </header>
    <main>
      <section class="hero" id="hero">
        <h1>Any voice. <em>Cloned on your Mac.</em></h1>
        <p>Drop a clip, record, or paste a YouTube link — pick the few seconds that sound right, and Clone makes a reusable voice on your machine (on-device, ~instant, no key). Then paste any text and hear it speak. Every cloned voice shows up in Echo and God too.</p>
      </section>
      <div id="view"></div>
    </main>
    <script type="module" src="./dist/clone.js"></script>
  </body>
</html>
