<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>QR — make a QR code on your device</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Hanken+Grotesk:wght@400;500;600&family=Spline+Sans+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <style>
      /* HOUSE "Atlas cockpit" system (brandbrain tokens). Add app CSS at the END. */
      :root {
        --page: #0A0C10; --inset: #070809; --panel: #12151C; --raised: #1A1F29;
        --edge: #262C38; --edge-soft: #1C212B;
        --ink: #E8EDF4; --ink-sec: #B4BECE; --ink-dim: #99A3B7; --ink-faint: #6E7C90;
        --accent: #C8F250; --accent-soft: #232B0D;
        --ok: #3DD68C; --warn: #F59E0B; --danger: #FF2D6E; --blue: #7DE0FF;
        --display: "Bricolage Grotesque", ui-sans-serif, system-ui, sans-serif;
        --sans: "Hanken Grotesk", ui-sans-serif, system-ui, sans-serif;
        --mono: "Spline Sans Mono", ui-monospace, monospace;
      }
      * { box-sizing: border-box; }
      [hidden] { display: none !important; }
      html, body { margin: 0; min-height: 100%; }
      body { background: var(--page); color: var(--ink); font: 14px/1.6 var(--sans); -webkit-font-smoothing: antialiased; }
      ::selection { background: rgba(200, 242, 80, 0.3); }
      button { font-family: inherit; }
      .kicker { font: 500 10px/1 var(--mono); letter-spacing: .16em; text-transform: uppercase; color: var(--ink-dim); }

      header { display: flex; align-items: center; gap: 14px; padding: 13px 20px; border-bottom: 1px solid var(--edge-soft); }
      .word { font: 700 20px/1 var(--display); letter-spacing: -0.02em; display: flex; align-items: center; gap: 9px; }
      .word em { font-style: normal; color: var(--accent); }
      .word .mk { width: 22px; height: 22px; border-radius: 6px; background: var(--accent); box-shadow: 0 0 14px rgba(200,242,80,.4); }
      #chip-dock { margin-left: auto; }

      main { max-width: 720px; margin: 0 auto; padding: 40px 20px 90px; }
      .hero h1 { font: 700 clamp(1.7rem, 4vw, 2.5rem)/1.05 var(--display); letter-spacing: -0.02em; margin: 0 0 10px; }
      .hero h1 em { font-style: normal; color: var(--accent); }
      .hero p { color: var(--ink-sec); margin: 0 0 26px; font-size: 14.5px; max-width: 540px; }

      .primary { font: 600 13.5px/1 var(--sans); border-radius: 10px; padding: 12px 18px; cursor: pointer; border: 1px solid var(--accent); background: var(--accent); color: var(--page); }
      .act { font: 500 11.5px/1 var(--mono); background: var(--inset); border: 1px solid var(--edge); border-radius: 999px; color: var(--ink-sec); padding: 7px 11px; cursor: pointer; transition: border-color .15s, color .15s; text-decoration: none; display: inline-block; }
      .act:hover { border-color: var(--accent); color: var(--ink); }

      .toast { position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%); background: var(--raised); border: 1px solid var(--edge); color: var(--ink); font: 500 12.5px/1.4 var(--sans); padding: 11px 16px; border-radius: 10px; box-shadow: 0 14px 40px -14px rgba(0,0,0,.7); z-index: 200; max-width: 80vw; }
      .toast.err { border-color: var(--danger); color: #ffd6e2; }

      /* ==== app-specific CSS below this line ==== */
      .work { display: flex; flex-direction: column; gap: 16px; margin-top: 6px; }
      .field { display: flex; flex-direction: column; gap: 8px; }
      .flabel { font: 500 10px/1 var(--mono); letter-spacing: .14em; text-transform: uppercase; color: var(--ink-dim); }

      .qr-in { width: 100%; background: var(--inset); border: 1px solid var(--edge); border-radius: 12px; color: var(--ink); font: 400 14px/1.4 var(--mono); padding: 13px 14px; outline: none; }
      .qr-in:focus { border-color: color-mix(in srgb, var(--accent) 55%, var(--edge)); }

      /* KIND tabs — what the code should BE (link · Wi-Fi · contact · …). Same pill grammar as .seg,
         but wrapping, because there are seven of them and the panel is narrow. */
      .kindrow { display: flex; flex-wrap: wrap; gap: 4px; background: var(--inset); border: 1px solid var(--edge); border-radius: 12px; padding: 4px; }
      .kindbtn { font: 500 12px/1 var(--sans); background: none; border: 0; color: var(--ink-sec); border-radius: 8px; padding: 9px 14px; cursor: pointer; transition: background .15s, color .15s; }
      .kindbtn:hover { color: var(--ink); }
      .kindbtn.on { background: var(--accent); color: var(--page); font-weight: 600; }
      /* the active kind's form. One field = full width (the original single-input flow); a longer
         form goes two-up so a contact card doesn't become a scroll. */
      .qform { display: grid; grid-template-columns: 1fr; gap: 14px; }
      .qform.two { grid-template-columns: 1fr 1fr; }
      .qform .field.wide { grid-column: 1 / -1; }
      @media (max-width: 560px) { .qform.two { grid-template-columns: 1fr; } }
      select.qr-in { appearance: none; cursor: pointer; }
      .toggle { align-self: flex-start; font: 500 13px/1 var(--sans); background: var(--inset); border: 1px solid var(--edge); border-radius: 12px; color: var(--ink-sec); padding: 13px 22px; cursor: pointer; transition: background .15s, color .15s, border-color .15s; }
      .toggle.on { background: var(--accent); border-color: var(--accent); color: var(--page); font-weight: 600; }
      .ctlrow { display: flex; align-items: flex-end; gap: 20px; flex-wrap: wrap; }
      .ctlrow .field { flex: 1; min-width: 180px; }
      .seg { display: inline-flex; background: var(--inset); border: 1px solid var(--edge); border-radius: 10px; padding: 3px; gap: 3px; align-self: flex-start; }
      .segbtn { font: 500 12px/1 var(--sans); background: none; border: 0; color: var(--ink-sec); border-radius: 7px; padding: 9px 16px; cursor: pointer; transition: background .15s, color .15s; }
      .segbtn:hover { color: var(--ink); }
      .segbtn.on { background: var(--accent); color: var(--page); font-weight: 600; }
      input[type="range"] { -webkit-appearance: none; appearance: none; width: 100%; height: 4px; border-radius: 3px; background: var(--edge); outline: none; }
      input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 16px; height: 16px; border-radius: 50%; background: var(--accent); cursor: pointer; box-shadow: 0 0 0 4px var(--accent-soft); }

      .outcard { border: 1px solid var(--edge); border-radius: 16px; background: var(--panel); padding: 20px; display: flex; flex-direction: column; gap: 12px; align-items: center; }
      .qr-canvas { border-radius: 10px; border: 1px solid var(--edge); image-rendering: pixelated; background: #fff; max-width: 100%; }
      .qr-meta { font: 500 11px/1 var(--mono); color: var(--ink-faint); }
      .dlrow { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
      .dl { border-color: color-mix(in srgb, var(--accent) 45%, var(--edge)); color: var(--accent); }
      .placeholder { font: 400 12.5px/1.5 var(--mono); color: var(--ink-faint); padding: 30px 0; }
      .err { color: var(--danger); font: 400 12.5px/1.6 var(--mono); text-align: center; }

      .nobadge { display: inline-flex; align-items: center; gap: 8px; font: 500 11.5px/1 var(--mono); color: var(--ink-dim); background: var(--panel); border: 1px solid var(--edge-soft); border-radius: 999px; padding: 8px 13px; align-self: flex-start; }
      .nobadge .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--ok); box-shadow: 0 0 8px var(--ok); }
    </style>
      <link rel="stylesheet" href="./house.css" />
  </head>
  <body>
    <header>
      <span class="word"><span class="mk"></span><em>QR</em></span>
      <div id="chip-dock"></div>
    </header>
    <main>
      <section class="hero" id="hero">
        <h1>Text in. <em>A QR code out.</em></h1>
        <p>Turn a link or any text into a scannable QR code — entirely in this tab. No AI, no upload, no cost, no waiting on a server. Download it as a crisp PNG or a scalable SVG. Pure client-side encoding, zero network.</p>
      </section>
      <div id="view"></div>
    </main>
    <script type="module" src="./dist/qr.js"></script>
  </body>
</html>
