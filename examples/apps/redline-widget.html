<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Redline · widget</title>
    <style>
      /* Notch widget tokens — compact, dark, one system. Shared across every Switchboard widget. */
      :root {
        --page:#0A0C10; --inset:#070809; --panel:#141416; --raised:#1A1F29;
        --edge:#282829; --edge-soft:#1C212B;
        --ink:#E8EDF4; --ink-sec:#B4BECE; --ink-dim:#9A9AA2; --ink-faint:#6E7C90;
        --accent:#C8F250; --accent-soft:#232B0D; --ok:#3DD68C; --warn:#F59E0B; --danger:#FF2D6E;
        --sans:"Hanken Grotesk",ui-sans-serif,system-ui,-apple-system,sans-serif;
        --mono:"Spline Sans Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
      }
      *{box-sizing:border-box;} [hidden]{display:none !important;}
      html,body{margin:0;}
      body{background:var(--page);color:var(--ink);font:13px/1.5 var(--sans);-webkit-font-smoothing:antialiased;}
      .wrap{width:560px;max-width:100vw;margin:0 auto;padding:14px 16px 16px;display:flex;flex-direction:column;gap:11px;}
      .head{display:flex;align-items:center;gap:8px;}
      .mk{width:16px;height:16px;border-radius:5px;background:var(--accent);box-shadow:0 0 10px rgba(200,242,80,.4);position:relative;}
      .mk::after{content:"";position:absolute;left:4px;right:4px;top:7px;height:2px;background:var(--page);}
      .name{font:600 13px/1 var(--sans);letter-spacing:-.01em;} .name em{font-style:normal;color:var(--accent);}
      .kicker{font:500 9px/1 var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--ink-dim);margin-left:auto;}
      .flabel{font:500 9px/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--ink-dim);margin-bottom:6px;display:block;}
      textarea,.in{width:100%;background:var(--inset);border:1px solid var(--edge);border-radius:9px;color:var(--ink);font:400 13px/1.5 var(--sans);padding:10px 12px;outline:none;resize:vertical;}
      textarea:focus,.in:focus{border-color:color-mix(in srgb,var(--accent) 55%,var(--edge));}
      textarea.el{font:400 12px/1.5 var(--mono);min-height:52px;}
      .row{display:flex;gap:9px;align-items:center;}
      .go{font:600 12.5px/1 var(--sans);background:var(--accent);color:var(--page);border:0;border-radius:9px;padding:11px 16px;cursor:pointer;transition:filter .15s,opacity .15s;}
      .go:hover{filter:brightness(1.08);} .go:disabled{opacity:.45;cursor:default;}
      .grow{flex:1;}
      .out{display:flex;flex-direction:column;gap:9px;}
      .summ{font:500 11px/1.5 var(--mono);color:var(--accent);}
      .opt{position:relative;border:1px solid var(--edge);background:var(--panel);border-radius:13px;padding:12px 13px;display:flex;flex-direction:column;gap:6px;}
      .opt.rec{border-color:color-mix(in srgb,var(--accent) 45%,var(--edge));}
      .opt .tag{display:inline-block;font:500 8.5px/1 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--accent);background:var(--accent-soft);border:1px solid color-mix(in srgb,var(--accent) 30%,transparent);border-radius:999px;padding:3px 7px;align-self:flex-start;}
      .opt .olabel{font:600 13px/1.3 var(--sans);color:var(--ink);}
      .opt .otext{font:400 12.5px/1.5 var(--sans);color:var(--ink-sec);white-space:pre-wrap;word-break:break-word;}
      .opt .repl{font:400 12px/1.5 var(--mono);color:var(--ink);background:var(--inset);border:1px solid var(--edge);border-radius:8px;padding:9px 10px;white-space:pre-wrap;word-break:break-word;}
      .cp{font:500 10.5px/1 var(--mono);background:var(--inset);border:1px solid var(--edge);border-radius:999px;color:var(--ink-sec);padding:6px 11px;cursor:pointer;align-self:flex-start;transition:border-color .15s,color .15s;}
      .cp:hover{border-color:var(--accent);color:var(--ink);}
      .md{font:400 13px/1.65 var(--sans);color:var(--ink-sec);white-space:pre-wrap;word-break:break-word;border:1px solid var(--edge);background:var(--panel);border-radius:12px;padding:13px;}
      .status{display:flex;align-items:center;gap:8px;font:500 11px/1.4 var(--mono);color:var(--ink-dim);}
      .scan{position:relative;width:24px;height:6px;border-radius:3px;background:var(--inset);overflow:hidden;flex:none;}
      .scan::after{content:"";position:absolute;inset:0;width:40%;background:linear-gradient(90deg,transparent,var(--accent),transparent);animation:scan 1.1s linear infinite;}
      @keyframes scan{from{transform:translateX(-100%);}to{transform:translateX(260%);}}
      .err{color:var(--danger);font:400 11.5px/1.5 var(--mono);}
      .placeholder{font:400 11px/1.5 var(--mono);color:var(--ink-faint);}
      .foot{display:inline-flex;align-items:center;gap:7px;font:500 10px/1 var(--mono);color:var(--ink-dim);}
      .foot .dot{width:6px;height:6px;border-radius:50%;background:var(--ok);box-shadow:0 0 7px var(--ok);}
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="head"><span class="mk"></span><span class="name">Red<em>line</em></span><span class="kicker">on your claude</span></div>
      <div>
        <label class="flabel" for="el">The element — paste the copy you want to change</label>
        <textarea id="el" class="el" autofocus placeholder="We unleash your workflow with next-gen synergy."></textarea>
      </div>
      <div>
        <label class="flabel" for="note">What should change?</label>
        <div class="row">
          <input id="note" class="in grow" type="text" placeholder="make it concrete, cut the hype" />
          <button id="go" class="go">Ask Redline</button>
        </div>
      </div>
      <div class="out" id="out"><div class="placeholder">Paste an element and say what to change — your Claude returns edit options.</div></div>
      <div class="foot"><span class="dot"></span>Runs on your own Claude · via Switchboard · nothing is written to disk</div>
    </div>

    <script type="module">
      // ---- injected-input contract: ?input=<url-encoded> OR window.__widgetInput { text, dataUrl?, filename? }
      function injectedText() {
        try { const q = new URLSearchParams(location.search).get("input"); if (q != null && q !== "") return q; } catch {}
        const w = window.__widgetInput;
        if (w && typeof w === "object" && typeof w.text === "string" && w.text.trim()) return w.text;
        if (typeof w === "string" && w.trim()) return w;
        return "";
      }

      // ================= window.claude bridge =================
      // The notch host injects window.claude — the raw BYOP provider (EIP-1193-style request + `delta`
      // events) that @relay/sdk wraps. A self-contained widget can't bundle the SDK, so we talk to the
      // provider directly, mirroring the SDK's connect + streamed-completion contract exactly.
      const SCOPE = { reason: "Redline widget — turn a comment on one element into edit options, on your own Claude", models: ["sonnet"] };
      function provider() { const c = window.claude; return (c && c.isRelay && typeof c.request === "function") ? c : null; }
      function waitForProvider(ms = 1500) {
        const p = provider(); if (p) return Promise.resolve(p);
        return new Promise((res) => { let done = false; const fin = () => { if (done) return; done = true; res(provider()); };
          window.addEventListener("claude#initialized", fin, { once: true }); setTimeout(fin, ms); });
      }
      let grantP = null;
      function ensureGrant(p) {
        if (!grantP) grantP = (async () => {
          try { const g = await p.request({ method: "claude_permissions" }); if (g) return g; } catch {}
          return p.request({ method: "claude_connect", params: SCOPE });
        })();
        return grantP;
      }
      // Streamed completion — await claude_stream for the id, THEN attach the delta handler (SDK order).
      async function streamPrompt(p, params, onText) {
        const { streamId } = await p.request({ method: "claude_stream", params });
        return new Promise((resolve, reject) => {
          let text = "", settled = false;
          const cleanup = () => { settled = true; try { p.removeListener("delta", handler); } catch {} clearTimeout(timer); };
          const handler = (d) => {
            if (!d || d.streamId !== streamId) return;
            if (d.type === "text") { text += d.text; onText && onText(text); }
            else if (d.type === "error") { cleanup(); reject(new Error((d.error && d.error.message) || "stream error")); }
            else if (d.type === "done") { cleanup(); resolve((d.result && d.result.text) || text); }
          };
          const timer = setTimeout(() => { if (!settled) { cleanup(); reject(new Error("Switchboard didn't respond — reload the widget and try again.")); } }, 180000);
          p.on("delta", handler);
        });
      }
      async function ask(prompt, onText) {
        const p = await waitForProvider();
        if (!p) throw new Error("Switchboard isn't connected — open this widget from the notch.");
        await ensureGrant(p);
        return streamPrompt(p, { prompt, model: "sonnet", maxTokens: 1600 }, onText);
      }

      // ---- redline respond-router prompt (mirrors src/redline.js respond()) ----
      function buildPrompt(elText, note) {
        return [
          "You are Redline, reviewing a landing page with the founder. They left a comment on ONE element. Decide the single best way to respond and return ONE JSON object — no prose, no fences.",
          `Current visible text: "${elText.replace(/\s+/g, " ").trim().slice(0, 400)}"`,
          `Reviewer's comment: "${note.replace(/\s+/g, " ").trim()}"`,
          "Choose a mode:",
          '• "edit" — the comment wants to CHANGE the copy (rewrite, sharpen, shorten, remove). Return {"mode":"edit","summary":<one line>,"find":<the visible text above>,"options":[{"label":<short name>,"replace":<the rewritten text>,"preview":<the new visible text>,"recommended":<true for exactly one>}]} — 2–3 options.',
          '• "reply" — the comment is a question or asks your opinion. Return {"mode":"reply","markdown":<your answer, a few tight lines>}.',
          "SOURCE:\n" + elText,
        ].join("\n\n");
      }
      function parseJson(text) {
        let t = String(text || "").replace(/```[a-z]*\n?/gi, "").trim();
        const s = t.indexOf("{"), e = t.lastIndexOf("}");
        if (s === -1 || e <= s) return null;
        try { return JSON.parse(t.slice(s, e + 1)); } catch { return null; }
      }
      const stripTags = (s) => String(s || "").replace(/<[^>]+>/g, "");

      // ---- UI ----
      const $ = (id) => document.getElementById(id);
      const mk = (tag, cls, text) => { const n = document.createElement(tag); if (cls) n.className = cls; if (text != null) n.textContent = text; return n; };
      const out = $("out"), elEl = $("el"), noteEl = $("note"), goEl = $("go");
      let busy = false;

      async function run() {
        const elText = elEl.value.trim(), note = noteEl.value.trim();
        if (!elText) { elEl.focus(); return; }
        if (!note) { noteEl.focus(); return; }
        if (busy) return;
        busy = true; goEl.disabled = true;
        out.textContent = "";
        const st = mk("div", "status"); st.append(mk("div", "scan"), mk("span", null, "reading the element on your Claude…")); out.append(st);
        try {
          const raw = await ask(buildPrompt(elText, note));
          const route = parseJson(raw);
          out.textContent = "";
          if (!route || !route.mode) throw new Error("no decision came back — try rephrasing your note");
          if (route.mode === "reply") { out.append(mk("div", "md", String(route.markdown || "(no reply)"))); return; }
          if (!Array.isArray(route.options) || !route.options.length) throw new Error("no edit came back — try rephrasing");
          if (route.summary) out.append(mk("div", "summ", route.summary));
          for (const o of route.options.slice(0, 3)) {
            const card = mk("div", "opt" + (o.recommended ? " rec" : ""));
            if (o.recommended) card.append(mk("span", "tag", "recommended"));
            card.append(mk("div", "olabel", String(o.label || "Option")));
            const preview = o.preview != null ? String(o.preview) : stripTags(o.replace || "").slice(0, 220);
            if (preview) card.append(mk("div", "otext", preview));
            const replace = o.replace != null ? String(o.replace) : "";
            if (replace) {
              card.append(mk("div", "repl", replace || "(removed)"));
              const cp = mk("button", "cp", "copy rewrite");
              cp.onclick = () => { navigator.clipboard?.writeText(replace).catch(() => {}); cp.textContent = "copied ✓"; setTimeout(() => (cp.textContent = "copy rewrite"), 1400); };
              card.append(cp);
            }
            out.append(card);
          }
        } catch (e) {
          out.textContent = "";
          out.append(mk("div", "err", String(e?.message || e).slice(0, 200)));
        } finally { busy = false; goEl.disabled = false; }
      }
      goEl.addEventListener("click", run);
      noteEl.addEventListener("keydown", (e) => { if (e.key === "Enter") run(); });

      // init: injected input pre-fills the element field
      const seed = injectedText();
      if (seed) elEl.value = seed;
      elEl.focus();
    </script>
  </body>
</html>
