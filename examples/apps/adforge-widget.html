<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AdForge · widget</title>
    <style>
      :root {
        --page:#0A0C10; --inset:#070809; --panel:#141416; --raised:#1A1F29;
        --edge:#282829; --edge-soft:#1C212B;
        --ink:#E8EDF4; --ink-sec:#B4BECE; --ink-dim:#9A9AA2; --ink-faint:#6E7C90;
        --accent:#C8F250; --accent-soft:#232B0D; --ok:#3DD68C; --danger:#FF2D6E;
        --sans:"Hanken Grotesk",ui-sans-serif,system-ui,-apple-system,sans-serif;
        --mono:"Spline Sans Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
      }
      *{box-sizing:border-box;} [hidden]{display:none !important;}
      html,body{margin:0;}
      body{background:var(--page);color:var(--ink);font:13px/1.5 var(--sans);-webkit-font-smoothing:antialiased;}
      .wrap{width:560px;max-width:100vw;margin:0 auto;padding:14px 16px 16px;display:flex;flex-direction:column;gap:11px;}
      .head{display:flex;align-items:center;gap:8px;}
      .mk{width:16px;height:16px;border-radius:5px;background:var(--accent);box-shadow:0 0 10px rgba(200,242,80,.4);}
      .name{font:600 13px/1 var(--sans);} .name em{font-style:normal;color:var(--accent);}
      .kicker{font:500 9px/1 var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--ink-dim);margin-left:auto;}
      .flabel{font:500 9px/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--ink-dim);margin-bottom:6px;display:block;}
      .in{width:100%;background:var(--inset);border:1px solid var(--edge);border-radius:9px;color:var(--ink);font:400 13px/1.4 var(--sans);padding:11px 12px;outline:none;}
      .in:focus{border-color:color-mix(in srgb,var(--accent) 55%,var(--edge));}
      .row{display:flex;align-items:center;gap:9px;}
      .go{font:600 12px/1 var(--sans);background:var(--accent);color:var(--page);border:0;border-radius:8px;padding:10px 16px;cursor:pointer;transition:opacity .13s;}
      .go:hover{opacity:.9;} .go:disabled{background:var(--raised);color:var(--ink-faint);cursor:not-allowed;}
      .grow{flex:1;}
      .stat{font:500 11px/1.4 var(--mono);color:var(--ink-sec);display:flex;align-items:center;gap:8px;}
      .dot{width:7px;height:7px;border-radius:50%;background:var(--accent);box-shadow:0 0 8px var(--accent);animation:blink 1.1s ease-in-out infinite;}
      @keyframes blink{50%{opacity:.25;}}
      .err{color:var(--danger);font:400 11px/1.5 var(--mono);}
      .cards{display:flex;flex-direction:column;gap:8px;}
      .card{border:1px solid var(--edge);border-radius:11px;background:var(--panel);padding:12px 13px;position:relative;}
      .card.rec{border-color:var(--accent);background:var(--accent-soft);}
      .ctop{display:flex;align-items:center;gap:8px;margin-bottom:6px;flex-wrap:wrap;}
      .cname{font:600 13px/1.2 var(--sans);}
      .tag{font:500 8.5px/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--ink-dim);border:1px solid var(--edge);border-radius:999px;padding:4px 7px;}
      .tag.sel{color:var(--page);background:var(--accent);border-color:var(--accent);}
      .cta{font:500 8.5px/1 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--accent);margin-left:auto;}
      .hook{font:500 12.5px/1.4 var(--sans);color:var(--ink);}
      .headline{font:400 11px/1.4 var(--mono);color:var(--ink-sec);margin-top:5px;}
      .body{font:400 10.5px/1.5 var(--sans);color:var(--ink-dim);margin-top:6px;max-height:64px;overflow:hidden;white-space:pre-wrap;}
      .cact{margin-top:8px;}
      .act{font:500 10px/1 var(--mono);background:var(--inset);border:1px solid var(--edge);border-radius:999px;color:var(--ink-sec);padding:6px 10px;cursor:pointer;transition:border-color .15s,color .15s;}
      .act:hover{border-color:var(--accent);color:var(--ink);}
      .act.copied{border-color:var(--accent);color:var(--accent);}
      .conn{font:500 10px/1.4 var(--mono);color:var(--ink-dim);}
      .conn a{color:var(--accent);}
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="head"><span class="mk"></span><span class="name"><em>AdForge</em></span><span class="kicker">meta ads · your claude</span></div>
      <div>
        <label class="flabel" for="in">A site URL, or a product/brand in one line</label>
        <div class="row">
          <input id="in" class="in" type="text" autofocus placeholder="allbirds.com — or: merino wool sneakers, no socks, machine washable" />
          <button id="go" class="go">Forge 3</button>
        </div>
      </div>
      <div id="stat" class="stat" hidden><span class="dot"></span><span id="stat-line">Forging…</span></div>
      <div id="errbox" class="err" hidden></div>
      <div id="cards" class="cards" hidden></div>
      <div class="conn" id="conn-idle"></div>
    </div>

    <script type="module">
      function injectedText() {
        try { const q = new URLSearchParams(location.search).get("input"); if (q) return q; } catch {}
        const w = window.__widgetInput;
        if (typeof w === "string" && w.trim()) return w;
        if (w && typeof w === "object" && typeof w.text === "string" && w.text.trim()) return w.text;
        return "";
      }
      // ---- minimal window.claude bridge (the same provider @relay/sdk wraps) ----
      const PROVIDER = "claude";
      const SCOPE = { reason: "forge Meta ad concepts from a site or product line on your own Claude", tools: ["WebFetch"], models: ["sonnet"], contextKinds: ["brand"] };
      function rawProvider() { const p = window[PROVIDER]; return p && p.isRelay ? p : null; }
      function whenProvider(ms = 2500) { const n = rawProvider(); if (n) return Promise.resolve(n); return new Promise((res) => { const done = () => { clearTimeout(t); res(rawProvider()); }; const t = setTimeout(done, ms); window.addEventListener(`${PROVIDER}#initialized`, done, { once: true }); }); }
      async function ensureConnected(p) { try { const g = await p.request({ method: "claude_permissions" }); if (g) return true; } catch {} try { const g = await p.request({ method: "claude_connect", params: SCOPE }); return !!g; } catch { return false; } }
      function streamText(p, params, onP) {
        return new Promise(async (resolve, reject) => {
          let streamId; try { ({ streamId } = await p.request({ method: "claude_stream", params })); } catch (e) { reject(e); return; }
          let text = "";
          const h = (d) => {
            if (!d || d.streamId !== streamId) return;
            if (d.type === "text") { text += d.text; onP && onP("text", text); }
            else if (d.type === "tool_proposed") { onP && onP("tool", d.call && d.call.name); }
            else if (d.type === "done") { cleanup(); resolve(text || (d.result && d.result.text) || ""); }
            else if (d.type === "error") { cleanup(); const e = new Error(d.error && d.error.message || "stream error"); e.code = d.error && d.error.code; reject(e); }
          };
          function cleanup() { try { p.removeListener("delta", h); } catch {} }
          p.on("delta", h);
        });
      }
      function parseObj(t) { const m = String(t).replace(/```(?:json)?/gi, "").match(/\{[\s\S]*\}/); if (!m) throw new Error("PARSE"); try { return JSON.parse(m[0]); } catch { throw new Error("PARSE"); } }
      const str = (v, fb = "") => (typeof v === "string" && v.trim() ? v.trim() : fb);

      // ---- prompt (reuses src/adforge.js CONCEPT_SHAPE + WebFetch idea) ----
      const CONCEPT_SHAPE = '{"concepts":[exactly 3 items, each {"name":string (2-4 word concept name),"angle":string,"hook":string (the scroll-stopping first line),"primaryText":string (Meta primary text, at most 90 words, short paragraphs separated by \\n\\n, the hook as its first line),"headline":string (max 40 characters),"cta":"Shop Now"|"Learn More"|"Get Offer"|"Sign Up","recommended":boolean}]}';
      const CTAS = ["Shop Now", "Learn More", "Get Offer", "Sign Up"];
      function urlOf(line) { const m = String(line).match(/https?:\/\/\S+/i); if (m) return m[0]; if (/^[\w-]+(\.[\w-]+)+(\/\S*)?$/.test(String(line).trim())) return "https://" + String(line).trim(); return ""; }
      function buildPrompt(input) {
        const url = urlOf(input);
        return [
          "You are a senior direct-response copywriter forging Meta feed ad concepts.",
          url ? ("FIRST: use the WebFetch tool to read " + url + " for the real product, proof points and voice. Never invent claims the site doesn't support.") : ("The brief: " + input),
          "Draft 3 genuinely distinct concepts — different buyer psychology each, one marked recommended (the most likely to convert). Ban empty superlatives.",
          "Respond with ONLY one JSON object — no prose, no markdown fences — shaped exactly:\n" + CONCEPT_SHAPE,
        ].filter(Boolean).join("\n\n");
      }
      function normalize(d) {
        if (!d || !Array.isArray(d.concepts) || !d.concepts.length) throw new Error("INCOMPLETE");
        const list = d.concepts.slice(0, 3).map((c) => ({
          name: str(c?.name, "Concept"), angle: str(c?.angle),
          hook: str(c?.hook, str(c?.headline, "—")), primaryText: str(c?.primaryText, str(c?.hook)),
          headline: str(c?.headline).slice(0, 60), cta: CTAS.includes(c?.cta) ? c.cta : "Learn More",
          recommended: c?.recommended === true,
        }));
        if (!list.some((c) => c.recommended)) list[0].recommended = true;
        return list;
      }

      // ---- UI ----
      const $ = (id) => document.getElementById(id);
      const inEl = $("in"), goEl = $("go"), cards = $("cards"), stat = $("stat"), statLine = $("stat-line"), errbox = $("errbox");
      const mk = (tag, cls, text) => { const n = document.createElement(tag); if (cls) n.className = cls; if (text != null) n.textContent = text; return n; };
      let busy = false, provider = null;

      function idleConn() {
        const c = $("conn-idle"); c.textContent = "";
        if (provider) { c.textContent = "connected — writes on your Claude, the app never sees a key"; return; }
        c.append("everything runs on your own Claude — ");
        const a = mk("a", null, "get Switchboard"); a.href = "https://thelastprompt.ai/switchboard/"; a.target = "_blank"; a.rel = "noreferrer"; c.append(a);
      }
      function setBusy(on, line) { busy = on; stat.hidden = !on; if (on) { errbox.hidden = true; statLine.textContent = line || "Forging…"; } goEl.disabled = on || !inEl.value.trim(); }
      function showError(err) {
        errbox.hidden = false; const msg = String(err?.message || err), code = err?.code;
        if (code === 4290) errbox.textContent = "Budget cap reached — raise it in the Switchboard panel, or try tomorrow.";
        else if (code === 4900) errbox.textContent = "Your Claude is unreachable — start the Switchboard daemon, then retry.";
        else if (msg === "PARSE" || msg === "INCOMPLETE") errbox.textContent = "Reply didn't parse cleanly — hit Forge 3 again.";
        else errbox.textContent = "Couldn't forge — " + msg.slice(0, 160);
      }
      function render(list) {
        cards.textContent = ""; cards.hidden = false;
        for (const c of list) {
          const card = mk("div", "card" + (c.recommended ? " rec" : ""));
          const top = mk("div", "ctop");
          top.append(mk("span", "cname", c.name));
          if (c.angle) top.append(mk("span", "tag", c.angle));
          if (c.recommended) top.append(mk("span", "tag sel", "recommended"));
          top.append(mk("span", "cta", c.cta));
          card.append(top);
          card.append(mk("div", "hook", c.hook));
          if (c.headline) card.append(mk("div", "headline", "◆ " + c.headline));
          if (c.primaryText) card.append(mk("div", "body", c.primaryText));
          const actrow = mk("div", "cact");
          const cp = mk("button", "act", "⧉ copy ad text");
          cp.onclick = async () => { try { await navigator.clipboard.writeText(c.primaryText + "\n\n" + c.headline); } catch {} cp.classList.add("copied"); cp.textContent = "copied ✓"; setTimeout(() => { cp.classList.remove("copied"); cp.textContent = "⧉ copy ad text"; }, 1200); };
          actrow.append(cp); card.append(actrow);
          cards.append(card);
        }
      }
      async function run() {
        const input = inEl.value.trim(); if (busy || !input) return;
        provider = provider || await whenProvider();
        if (!provider) { showError(new Error("Switchboard isn't connected — open this inside the notch, or install the sidekick.")); return; }
        setBusy(true, "Connecting…");
        if (!await ensureConnected(provider)) { setBusy(false); showError(new Error("Connect declined — approve the Switchboard grant to forge.")); return; }
        setBusy(true, urlOf(input) ? "Reading the site…" : "Drafting concepts…");
        try {
          const text = await streamText(provider, { prompt: buildPrompt(input), agentic: true }, (k, v) => {
            if (k === "tool" && v === "WebFetch") statLine.textContent = "Reading the site (WebFetch)…";
            else if (k === "text") statLine.textContent = "Drafting concepts… " + (v.length / 1024).toFixed(1) + " kb";
          });
          render(normalize(parseObj(text)));
        } catch (err) { showError(err); }
        finally { setBusy(false); idleConn(); }
      }
      goEl.addEventListener("click", run);
      inEl.addEventListener("input", () => { goEl.disabled = busy || !inEl.value.trim(); });
      inEl.addEventListener("keydown", (e) => { if (e.key === "Enter") { e.preventDefault(); run(); } });

      const seed = injectedText(); if (seed) inEl.value = seed;
      goEl.disabled = !inEl.value.trim();
      whenProvider(2500).then((p) => { provider = p; idleConn(); });
      idleConn(); inEl.focus();
    </script>
  </body>
</html>
