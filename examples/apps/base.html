<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Base Converter — dec / hex / bin / oct on your device</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Hanken+Grotesk:wght@400;500;600&family=Spline+Sans+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <style>
      /* HOUSE "Atlas cockpit" system (brandbrain tokens). Add app CSS at the END. */
      :root {
        --page: #0A0C10; --inset: #070809; --panel: #12151C; --raised: #1A1F29;
        --edge: #262C38; --edge-soft: #1C212B;
        --ink: #E8EDF4; --ink-sec: #B4BECE; --ink-dim: #99A3B7; --ink-faint: #6E7C90;
        --accent: #C8F250; --accent-soft: #232B0D;
        --ok: #3DD68C; --warn: #F59E0B; --danger: #FF2D6E; --blue: #7DE0FF;
        --display: "Bricolage Grotesque", ui-sans-serif, system-ui, sans-serif;
        --sans: "Hanken Grotesk", ui-sans-serif, system-ui, sans-serif;
        --mono: "Spline Sans Mono", ui-monospace, monospace;
      }
      * { box-sizing: border-box; }
      [hidden] { display: none !important; }
      html, body { margin: 0; min-height: 100%; }
      body { background: var(--page); color: var(--ink); font: 14px/1.6 var(--sans); -webkit-font-smoothing: antialiased; }
      ::selection { background: rgba(200, 242, 80, 0.3); }
      button { font-family: inherit; }
      .kicker { font: 500 10px/1 var(--mono); letter-spacing: .16em; text-transform: uppercase; color: var(--ink-dim); }

      header { display: flex; align-items: center; gap: 14px; padding: 13px 20px; border-bottom: 1px solid var(--edge-soft); }
      .word { font: 700 20px/1 var(--display); letter-spacing: -0.02em; display: flex; align-items: center; gap: 9px; }
      .word em { font-style: normal; color: var(--accent); }
      .word .mk { width: 22px; height: 22px; border-radius: 6px; background: var(--accent); box-shadow: 0 0 14px rgba(200,242,80,.4); }
      #chip-dock { margin-left: auto; }

      main { max-width: 720px; margin: 0 auto; padding: 40px 20px 90px; }
      .hero h1 { font: 700 clamp(1.7rem, 4vw, 2.5rem)/1.05 var(--display); letter-spacing: -0.02em; margin: 0 0 10px; }
      .hero h1 em { font-style: normal; color: var(--accent); }
      .hero p { color: var(--ink-sec); margin: 0 0 26px; font-size: 14.5px; max-width: 540px; }

      .act { font: 500 11.5px/1 var(--mono); background: var(--inset); border: 1px solid var(--edge); border-radius: 999px; color: var(--ink-sec); padding: 7px 11px; cursor: pointer; transition: border-color .15s, color .15s; text-decoration: none; display: inline-block; }
      .act:hover { border-color: var(--accent); color: var(--ink); }

      .toast { position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%); background: var(--raised); border: 1px solid var(--edge); color: var(--ink); font: 500 12.5px/1.4 var(--sans); padding: 11px 16px; border-radius: 10px; box-shadow: 0 14px 40px -14px rgba(0,0,0,.7); z-index: 200; max-width: 80vw; }
      .toast.err { border-color: var(--danger); color: #ffd6e2; }

      /* ==== app-specific CSS below this line ==== */
      .work { display: flex; flex-direction: column; gap: 16px; margin-top: 6px; }
      .field { display: flex; flex-direction: column; gap: 8px; }
      .flabel { font: 500 10px/1 var(--mono); letter-spacing: .14em; text-transform: uppercase; color: var(--ink-dim); }

      /* the input row: the value field grows, the base selector sits beside it (custom base tucks in too) */
      .inrow { display: grid; grid-template-columns: 1fr auto; align-items: end; gap: 14px; }
      .inrow .frombase { min-width: 148px; }
      .inrow .custfield { min-width: 108px; }
      @media (max-width: 520px) { .inrow { grid-template-columns: 1fr; } }

      .vin { background: var(--inset); border: 1px solid var(--edge); border-radius: 12px; color: var(--ink); font: 400 17px/1.4 var(--mono); padding: 12px 14px; outline: none; width: 100%; }
      .vin:focus { border-color: color-mix(in srgb, var(--accent) 55%, var(--edge)); }
      .bsel { background: var(--inset); border: 1px solid var(--edge); border-radius: 12px; color: var(--ink); font: 400 14px/1.4 var(--sans); padding: 12px 12px; outline: none; cursor: pointer; width: 100%; }
      .bsel:focus { border-color: color-mix(in srgb, var(--accent) 55%, var(--edge)); }
      .cin { background: var(--inset); border: 1px solid var(--edge); border-radius: 12px; color: var(--ink); font: 400 15px/1.4 var(--mono); padding: 12px 12px; outline: none; width: 100%; }
      .cin:focus { border-color: color-mix(in srgb, var(--accent) 55%, var(--edge)); }

      /* the results panel — one row per base, monospace so digits line up */
      .outcard { border: 1px solid var(--edge); border-radius: 16px; background: var(--panel); overflow: hidden; }
      .brows { display: flex; flex-direction: column; }
      .brow { display: grid; grid-template-columns: 108px 1fr auto; align-items: center; gap: 12px; padding: 14px 18px; border-bottom: 1px solid var(--edge); }
      .brow:last-child { border-bottom: 0; }
      .brow.src { background: color-mix(in srgb, var(--accent) 7%, var(--panel)); }
      .blabel { font: 500 10px/1.3 var(--mono); letter-spacing: .1em; text-transform: uppercase; color: var(--ink-dim); }
      .brow.src .blabel { color: var(--accent); }
      .bval { font: 400 16px/1.35 var(--mono); color: var(--ink); word-break: break-all; overflow-wrap: anywhere; }
      .bval .bpfx { color: var(--ink-faint); }
      .bcopy { font: 500 11px/1 var(--mono); background: var(--inset); border: 1px solid var(--edge); color: var(--ink-sec); border-radius: 999px; padding: 7px 11px; cursor: pointer; transition: border-color .15s, color .15s; }
      .bcopy:hover { border-color: var(--accent); color: var(--ink); }
      .bnote { padding: 12px 18px; border-top: 1px solid var(--edge); font: 400 12px/1.4 var(--mono); color: var(--ink-dim); }

      .placeholder { padding: 26px 22px; text-align: center; color: var(--ink-faint); font: 400 13px/1.6 var(--sans); }
      .err { color: var(--danger); font: 400 12.5px/1.6 var(--mono); padding: 22px; text-align: center; }

      .nobadge { display: inline-flex; align-items: center; gap: 8px; font: 500 11.5px/1 var(--mono); color: var(--ink-dim); background: var(--panel); border: 1px solid var(--edge-soft); border-radius: 999px; padding: 8px 13px; align-self: flex-start; }
      .nobadge .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--ok); box-shadow: 0 0 8px var(--ok); }
    </style>
      <link rel="stylesheet" href="./house.css" />
  </head>
  <body>
    <header>
      <span class="word"><span class="mk"></span><em>Base</em></span>
      <div id="chip-dock"></div>
    </header>
    <main>
      <section class="hero" id="hero">
        <h1>One integer. <em>Every base at once.</em></h1>
        <p>Type a number, pick the base it's in, and read it in decimal, hex, binary and octal — with exact BigInt maths, so a 64-bit value never rounds off. Entirely in this tab. No AI, no upload, no cost.</p>
      </section>
      <div id="view"></div>
    </main>
    <script type="module" src="./dist/base.js"></script>
  </body>
</html>
