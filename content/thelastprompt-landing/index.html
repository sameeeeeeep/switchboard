<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>thelastprompt.ai</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300;400;500;600&display=swap">
<style>
:root{--bg:#07080A;--ink:#EDEEEA;--dim:#8A8D94;--faint:#4A4D54;--pop:#9FCB6E;--line:#202226;--card:#0E0F12;}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);overflow:hidden;
  font-family:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,monospace;-webkit-font-smoothing:antialiased}
#stage{position:fixed;inset:0}
canvas{position:absolute;inset:0;display:block}
.layer{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;
  justify-content:center;text-align:center;pointer-events:none;padding:24px;will-change:opacity,transform}
.l1 .big,.l2 .big{font-size:clamp(27px,4.8vw,54px);font-weight:300;line-height:1.14;
  letter-spacing:-.015em;max-width:20ch;text-wrap:balance}
.big .g{color:var(--pop);font-weight:400}
/* final block */
.final{gap:20px}
.mark{font-size:12.5px;letter-spacing:.42em;color:var(--dim);text-transform:lowercase;padding-left:.42em}
.mark b{color:var(--ink);font-weight:500}
.tag{font-size:clamp(26px,4.4vw,46px);font-weight:300;letter-spacing:-.01em;line-height:1.12;
  max-width:16ch;text-wrap:balance}
.tag .g{color:var(--pop);font-weight:400}
.vision{font-size:11.5px;letter-spacing:.16em;color:var(--faint);text-transform:uppercase;
  display:flex;align-items:center;gap:12px}
.vision .step{color:var(--faint)}
.vision .now{color:var(--dim)}
.vision .end{color:var(--pop)}
.vision .arr{color:var(--line)}
.card{pointer-events:auto;margin-top:8px;display:flex;align-items:center;gap:16px;text-align:left;
  background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 18px;
  min-width:340px;max-width:min(92vw,440px);box-shadow:0 24px 60px rgba(0,0,0,.5)}
.ctile{width:42px;height:42px;border-radius:11px;flex:none;display:grid;place-items:center;
  background:rgba(159,203,110,.12);border:1px solid rgba(159,203,110,.28)}
.ctile i{width:15px;height:15px;border-radius:4px;background:var(--pop);display:block}
.cmeta{flex:1;min-width:0}
.ctitle{font-size:15px;font-weight:600;color:var(--ink);letter-spacing:-.01em}
.cdesc{font-size:11px;line-height:1.5;color:var(--dim);margin-top:3px}
.enter{flex:none;background:var(--pop);color:#07080A;font-family:inherit;font-weight:600;
  font-size:13px;letter-spacing:.02em;border:none;border-radius:999px;padding:11px 18px;
  cursor:pointer;text-decoration:none;white-space:nowrap;transition:transform .15s ease,filter .15s ease}
.enter:hover{filter:brightness(1.08);transform:translateY(-1px)}
.replay{position:fixed;bottom:20px;right:22px;pointer-events:auto;background:none;border:none;
  color:var(--faint);font-family:inherit;font-size:11px;letter-spacing:.18em;cursor:pointer;text-transform:uppercase}
.replay:hover{color:var(--dim)}
</style></head>
<body>
<div id="stage"><canvas id="c"></canvas></div>

<div class="layer l1" id="line1" style="opacity:0">
  <div class="big">you're one prompt away from <span class="g">superintelligence</span></div>
</div>
<div class="layer l2" id="line2" style="opacity:0">
  <div class="big">the last prompt helps you <span class="g">close that gap</span></div>
</div>
<div class="layer final" id="final" style="opacity:0">
  <div class="mark"><b>thelastprompt</b>.ai</div>
  <div class="tag">an AI lab for <span class="g">AI experiments</span></div>
  <div class="vision"><span class="now">prompts</span><span class="arr">→</span><span class="step">fewer</span><span class="arr">→</span><span class="end">promptless</span></div>
  <div class="card">
    <div class="ctile"><i></i></div>
    <div class="cmeta">
      <div class="ctitle">Switchboard</div>
      <div class="cdesc">route your AI — subscription · context · models · users · agents</div>
    </div>
    <a class="enter" href="https://thelastprompt.ai/switchboard/">Enter →</a>
  </div>
</div>
<button class="replay" id="replay">↻ replay</button>

<script>
(function(){
  const c=document.getElementById('c'), ctx=c.getContext('2d');
  const reduce=matchMedia('(prefers-reduced-motion:reduce)').matches;
  const L1=document.getElementById('line1'),L2=document.getElementById('line2'),FIN=document.getElementById('final');
  let W,H,cx,cy,DPR,SIM=false;
  function size(){DPR=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;cx=W/2;cy=H/2;
    c.width=W*DPR;c.height=H*DPR;c.style.width=W+'px';c.style.height=H+'px';ctx.setTransform(DPR,0,0,DPR,0,0);}
  size();
  const clamp=(v,a,b)=>v<a?a:v>b?b:v;
  const ramp=(t,a,b)=>clamp((t-a)/(b-a),0,1);
  const pulse=(t,ia,ib,oa,ob)=>ramp(t,ia,ib)*(1-ramp(t,oa,ob));

  function handPoints(scale){
    const w=Math.round(230*scale), h=Math.round(250*scale);
    const o=document.createElement('canvas'); o.width=w; o.height=h;
    const g=o.getContext('2d'); g.fillStyle='#fff'; g.strokeStyle='#fff'; g.lineCap='round'; g.lineJoin='round'; const S=scale;
    g.beginPath(); g.moveTo(20*S,95*S);
    g.quadraticCurveTo(20*S,150*S,55*S,168*S); g.quadraticCurveTo(95*S,185*S,120*S,168*S);
    g.quadraticCurveTo(140*S,155*S,140*S,128*S); g.quadraticCurveTo(140*S,100*S,120*S,92*S);
    g.quadraticCurveTo(95*S,78*S,55*S,86*S); g.quadraticCurveTo(28*S,92*S,20*S,95*S); g.closePath(); g.fill();
    for(let i=0;i<3;i++){ g.beginPath(); g.arc((60+i*26)*S,90*S,15*S,0,7); g.fill(); }
    g.lineWidth=24*S; g.beginPath(); g.moveTo(46*S,104*S); g.quadraticCurveTo(30*S,74*S,44*S,52*S); g.stroke();
    g.lineWidth=26*S; g.beginPath(); g.moveTo(120*S,120*S); g.quadraticCurveTo(175*S,116*S,214*S,118*S); g.stroke();
    g.beginPath(); g.arc(214*S,118*S,13*S,0,7); g.fill();
    const img=g.getImageData(0,0,w,h).data; const pts=[]; const step=Math.max(3,Math.round(4.4*S));
    for(let y=0;y<h;y+=step) for(let x=0;x<w;x+=step){ if(img[(y*w+x)*4+3]>128){ pts.push({x:x+(Math.random()-.5)*step,y:y+(Math.random()-.5)*step}); } }
    return {pts,tipx:214*S,tipy:118*S};
  }
  let P=[], hand, handScale, tStart, boomAt=false, raf;
  const OPEN=()=>Math.max(220,Math.min(W,H)*0.42);
  const NEAR=()=>Math.max(46,Math.min(W,H)*0.075);
  const REST=()=>Math.min(W,H)*0.012;
  function build(){
    handScale=Math.max(.72,Math.min(1.35,Math.min(W,H)/560)); hand=handPoints(handScale); P=[];
    function place(side){ for(const p of hand.pts){ let lx=p.x-hand.tipx, ly=p.y-hand.tipy; if(side>0){lx=-lx;}
      P.push({side,lx,ly,x:cx+(side<0?-1:1)*(W*0.6)+(Math.random()-.5)*140,y:cy+(Math.random()-.5)*H*0.9,
        vx:0,vy:0,a:0,size:1.1+Math.random()*1.3,seed:Math.random()*6.28}); } }
    place(-1); place(1); tStart=performance.now(); boomAt=false;
    L1.style.opacity=0;L2.style.opacity=0;FIN.style.opacity=0;
  }
  function tipHalf(t){
    const o=OPEN()/2,n=NEAR()/2,r=REST()/2;
    if(t<1.0) return o;
    if(t<2.0){ const e=1-Math.pow(1-ramp(t,1.0,2.0),3); return o+(n-o)*e; }
    if(t<2.6) return n;
    const e=1-Math.pow(1-ramp(t,2.6,2.85),2); return n+(r-n)*e;
  }
  function setText(t){
    const o1=pulse(t,1.15,1.8,2.65,3.0), o2=pulse(t,3.5,4.1,5.15,5.6), of=ramp(t,5.75,6.7);
    L1.style.opacity=o1; L1.style.transform='translateY('+((1-o1)*8)+'px)';
    L2.style.opacity=o2; L2.style.transform='translateY('+((1-o2)*8)+'px)';
    FIN.style.opacity=of; FIN.style.transform='translateY('+((1-of)*10)+'px)';
    FIN.style.pointerEvents=of>0.5?'auto':'none';
  }
  function frame(now){
    const t=(now-tStart)/1000;
    ctx.clearRect(0,0,W,H); ctx.globalCompositeOperation='lighter';
    if(!boomAt && t>=2.9){ boomAt=true;
      for(const p of P){ const px=cx+(p.side<0?-1:1)*tipHalf(2.85)+p.lx, py=cy+p.ly;
        const dx=px-cx,dy=py-cy,d=Math.hypot(dx,dy)||1,f=(1.6+Math.random()*2.4);
        p.vx=(dx/d)*f*(2.4+Math.random()*3.2)+(Math.random()-.5)*2;
        p.vy=(dy/d)*f*(2.4+Math.random()*3.2)-(0.6+Math.random()*1.4); p.x=px; p.y=py; } }
    setText(t);
    // spark
    if(t>1.6 && t<3.25){ const gg=Math.max(0,1-Math.abs(t-2.85)/0.9), r=14+gg*170;
      const gr=ctx.createRadialGradient(cx,cy,0,cx,cy,r);
      gr.addColorStop(0,'rgba(224,255,196,'+(0.92*gg)+')'); gr.addColorStop(.35,'rgba(159,203,110,'+(0.5*gg)+')');
      gr.addColorStop(1,'rgba(159,203,110,0)'); ctx.fillStyle=gr; ctx.beginPath(); ctx.arc(cx,cy,r,0,7); ctx.fill(); }
    if(boomAt && t<3.85){ const rt=(t-2.9)/0.95, rr=rt*Math.max(W,H)*0.55;
      ctx.strokeStyle='rgba(159,203,110,'+(0.5*(1-rt))+')'; ctx.lineWidth=2; ctx.beginPath(); ctx.arc(cx,cy,rr,0,7); ctx.stroke(); }
    const half=tipHalf(t);
    for(const p of P){ let col;
      if(!boomAt){ const hx=cx+(p.side<0?-1:1)*half+p.lx, hy=cy+p.ly, spd=t<1.0?0.06:0.14;
        p.x+=(hx-p.x)*spd; p.y+=(hy-p.y)*spd; p.a+=(Math.min(1,t/0.9)-p.a)*0.1;
        col='rgba(210,224,196,'+(0.55*p.a)+')'; if(p.lx>-26*handScale){ col='rgba(190,232,150,'+(0.82*p.a)+')'; } }
      else{ p.vx*=0.955; p.vy*=0.955; p.vy+=0.015; p.x+=p.vx; p.y+=p.vy; p.a*=0.986; col='rgba(176,214,140,'+(0.7*p.a)+')'; }
      ctx.fillStyle=col; const s=p.size*(boomAt?0.9:1); ctx.fillRect(p.x,p.y,s,s); }
    ctx.globalCompositeOperation='source-over';
    if(boomAt && t>4.6){ for(const p of P){ p.x+=Math.sin(now/1400+p.seed)*0.06; p.y+=Math.cos(now/1600+p.seed)*0.05; } }
    if(!SIM) raf=requestAnimationFrame(frame);
  }
  function start(){ build(); if(reduce){ L1.style.opacity=0;L2.style.opacity=0;FIN.style.opacity=1;FIN.style.pointerEvents='auto'; return; }
    cancelAnimationFrame(raf); raf=requestAnimationFrame(frame); }
  addEventListener('resize',size);
  document.getElementById('replay').addEventListener('click',start);
  start();
})();
</script>
</body></html>
